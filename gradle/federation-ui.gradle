def uiRepositoryDir = rootProject.layout.projectDirectory.asFile
def uiVerificationMetadata = rootProject.layout.projectDirectory.file('gradle/verification-metadata.xml')
def uiProductJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def uiLdlibJar = configurations.runtimeClasspath.incoming.artifactView {
    componentFilter { identifier -> identifier.displayName.contains('ldlib2-neoforge-1.21.1:2.2.34') }
}.files.elements.map { elements -> elements.collect { it.asFile }.find { it.name.endsWith('-all.jar') } }

def uiSha256 = { byte[] bytes ->
    MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
}

def uiRunProcess = { List<String> command, File directory, File stdout, timeoutSeconds, Map<String, String> environment ->
    stdout.parentFile.mkdirs()
    def builder = new ProcessBuilder(command.collect { it.toString() })
            .directory(directory).redirectErrorStream(true).redirectOutput(stdout)
    builder.environment().putAll(environment)
    def process = builder.start()
    def completed = process.waitFor(timeoutSeconds, TimeUnit.SECONDS)
    if (!completed) {
        def descendants = process.toHandle().descendants().toList()
        descendants.reverseEach { it.destroyForcibly() }
        process.destroyForcibly()
        process.waitFor(10, TimeUnit.SECONDS)
        return [exit: 124, timedOut: true]
    }
    [exit: process.exitValue(), timedOut: false]
}

def uiStrictCanonicalPath = { File file ->
    def absolute = file.absoluteFile.toPath()
    if (absolute != absolute.normalize() || file.absolutePath != file.canonicalPath) {
        throw new GradleException("Symlink or traversal path rejected: ${file}")
    }
    file.canonicalFile
}

def uiDeleteRecursively = { File root ->
    if (!root.exists()) return
    Files.walk(root.toPath()).withCloseable { paths ->
        paths.sorted(Comparator.reverseOrder()).forEach { Files.deleteIfExists(it) }
    }
}

def uiCurrentSourceIdentity = { File outputDir ->
    outputDir.mkdirs()
    def headFile = new File(outputDir, 'source-head.txt')
    def diffFile = new File(outputDir, 'source-diff.patch')
    def statusFile = new File(outputDir, 'source-status.txt')
    if (uiRunProcess(['git', 'rev-parse', 'HEAD'], uiRepositoryDir, headFile, 20, [:]).exit != 0
            || uiRunProcess(['git', 'diff', '--binary', 'HEAD', '--', '.', ':(exclude).omo/**',
                    ':(exclude)**/build/**', ':(exclude)neoforge-1.21.1/run-gametest/**',
                    ':(exclude)neoforge-1.21.1/run-server/**',
                    ':(exclude)neoforge-1.21.1/run-uitest/**'], uiRepositoryDir, diffFile, 20, [:]).exit != 0
            || uiRunProcess(['git', 'status', '--porcelain=v1', '--untracked-files=all', '--', '.',
                    ':(exclude).omo/**', ':(exclude)**/build/**',
                    ':(exclude)neoforge-1.21.1/run-gametest/**', ':(exclude)neoforge-1.21.1/run-server/**',
                    ':(exclude)neoforge-1.21.1/run-uitest/**'], uiRepositoryDir, statusFile, 20, [:]).exit != 0) {
        throw new GradleException('Cannot capture current UI-test source identity')
    }
    def worktreeIdentity = new StringBuilder(statusFile.text)
    statusFile.readLines().each { statusLine ->
        if (statusLine.length() > 3) {
            def relativePath = statusLine.substring(3).replace(' -> ', '\n').readLines().last()
            def sourceFile = new File(uiRepositoryDir, relativePath)
            if (sourceFile.isFile()) {
                worktreeIdentity.append(relativePath).append('=').append(uiSha256(sourceFile.bytes)).append('\n')
            }
        }
    }
    def dirtyIdentityFile = new File(outputDir, 'dirty-identity.txt')
    dirtyIdentityFile.text = worktreeIdentity.toString()
    [revision: headFile.text.trim(), dirtySha256: uiSha256(dirtyIdentityFile.bytes),
            files: [headFile, diffFile, statusFile, dirtyIdentityFile]]
}

def uiTaskThreeScenarioNames = ['ui-harness.shared-resource', 'ui-harness.server-ack'] as Set
def uiTaskThreeExpectedCases = ['ui-harness.shared-resource', 'ui-harness.server-ack', 'ui-harness.reject-stale'] as Set
def uiTaskFifteenScenarioNames = ['ui.router', 'ui.bridge', 'ui.shared-policy', 'ui.stale-context',
        'ui.close-unsubscribe'] as Set
def uiTaskFifteenExpectedCases = uiTaskFifteenScenarioNames
def uiTaskThirtyThreeScenarioNames = ['ui.graph-controls', 'ui.mapping', 'ui.endpoint',
        'ui.multipart-attachments', 'ui.chinese-scales', 'ui.reject-claim-conflict'] as Set
def uiTaskThirtyThreeExpectedCases = uiTaskThirtyThreeScenarioNames
def uiTaskThirtyFourExpectedCases = ['multiclient.shared-server', 'multiclient.conflicting-edit',
        'multiclient.domain-split', 'multiclient.disconnect-cleanup'] as Set
def uiAllScenarioNames = uiTaskThreeScenarioNames + uiTaskFifteenScenarioNames + uiTaskThirtyThreeScenarioNames

def verifyTaskFifteenReport = { List attachments, List controls, List captures, String runId ->
    def outcomes = attachments.findAll { it.caseId != null }.collectEntries { [(it.caseId): it] }
    if (outcomes.keySet() as Set != uiTaskFifteenScenarioNames || captures.size() < 5
            || controls.count { it.selector == '#policy_toggle' } < 5) {
        throw new GradleException('Task 15 control, screenshot, or scenario outcome accounting is incomplete')
    }
    if (outcomes.values().any { it.recordIdentity == null || it.recordIdentity.isBlank()
            || it.recordIdentity != it.bridgeRecordIdentity }) {
        throw new GradleException('Task 15 Router and Bridge entrances do not derive one real directional Policy identity')
    }
    ['ui.router', 'ui.bridge'].each { caseId ->
        def outcome = outcomes[caseId]
        def revision = outcome.policyRevision as long
        def expectedStatus = "Server accepted revision ${revision} - acknowledgment policy-${revision}"
        if (outcome.mutationStatus != 'ACCEPTED' || revision <= 0L || outcome.policyEnabled != 'true'
                || outcome.visibleStatus != expectedStatus) {
            throw new GradleException("Task 15 server acknowledgment is invalid for ${caseId}")
        }
    }
    def shared = outcomes['ui.shared-policy']
    if (shared.mutationStatus != 'SHARED' || shared.policyEnabled != 'true'
            || (shared.policyRevision as long) <= 0L
            || shared.visibleRule != "STORAGE: enabled (revision ${shared.policyRevision})") {
        throw new GradleException('Task 15 Router edit was not observed as the same Bridge policy record')
    }
    if (!attachments.any { it.bridgeDiagnosticOnly == 'true' }) {
        throw new GradleException('Task 15 disabled Bridge did not remain diagnostic-only')
    }
    def stale = outcomes['ui.stale-context']
    if (stale.mutationStatus != 'STALE_CONTEXT' || stale.staleContext != 'true'
            || (stale.policyRevision as long) != 0L || stale.policyEnabled != 'false'
            || stale.visibleStatus != 'Rejected by server: Federation Domain topology changed; reopen this editor') {
        throw new GradleException('Task 15 stale Federation Domain context was not visibly rejected without mutation')
    }
    def closed = outcomes['ui.close-unsubscribe']
    if (closed.menuClosedBeforeMutation != 'true' || closed.sharingContinues != 'true'
            || closed.mutationStatus != 'POST_CLOSE_ACCEPTED' || closed.policyEnabled != 'false'
            || (closed.policyRevision as long) != (closed.previousRevision as long) + 1L
            || closed.visibleRule != "STORAGE: disabled (revision ${closed.policyRevision})") {
        throw new GradleException('Task 15 menu closure lifecycle or continued sharing is invalid')
    }
}

def verifyTaskThirtyThreeReport = { List attachments, List controls, List captures, String runId ->
    def outcomes = attachments.findAll { it.caseId != null }.collectEntries { [(it.caseId): it] }
    if (outcomes.keySet() as Set != uiTaskThirtyThreeScenarioNames || captures.size() < 10
            || controls.find { it.selector == '#domain_graph' } == null
            || controls.find { it.selector == '#mapping_toggle' } == null
            || controls.find { it.selector == '#endpoint_detail' } == null) {
        throw new GradleException('Task 33 graph, mapping, Endpoint, screenshot, or outcome accounting is incomplete')
    }
    if (outcomes.values().any { it.graphVisible != 'true' || it.glRenderer == null || it.glRenderer.isBlank() }) {
        throw new GradleException('Task 33 actual-client graph or renderer evidence is missing')
    }
    def mapping = outcomes['ui.mapping']
    if (mapping.authoritativeMappingLanes != '[0]'
            || mapping.mappingAck != 'Server: accepted-0-0'
            || mapping.providerId == null || mapping.providerId.isBlank()) {
        throw new GradleException('Task 33 authoritative Provider mapping acknowledgment is invalid')
    }
    def endpoint = outcomes['ui.endpoint']
    if (endpoint.endpointMode != 'FEDERATED' || endpoint.endpointId == null || endpoint.endpointId.isBlank()
            || !endpoint.endpointDetail.contains('Claim epoch 1')) {
        throw new GradleException('Task 33 live Endpoint diagnostic is invalid')
    }
    def multipart = outcomes['ui.multipart-attachments']
    if (multipart.multipartAttachment != 'north:bridge;cable-extension:5'
            || multipart.visibleAttachment != 'ME Federation Bridge - side north / type bridge / cable extension 5.0') {
        throw new GradleException('Task 33 multipart Bridge attachment evidence is invalid')
    }
    def chinese = outcomes['ui.chinese-scales']
    def exercisedScales = outcomes.values().collect { it.guiScale as double } as Set
    if (chinese.language != 'zh_cn' || chinese.guiScale as double != 4d
            || !chinese.largeQuantity.contains('4000000000') || exercisedScales != ([2d, 3d, 4d] as Set)) {
        throw new GradleException('Task 33 Chinese text, large quantity, or GUI scale evidence is invalid')
    }
    def conflict = outcomes['ui.reject-claim-conflict']
    if (conflict.claimConflict != 'Rejected' || !conflict.claimConflictResult.contains('OWNER_CONFLICT')
            || !conflict.endpointDetail.contains('Claim epoch 1')) {
        throw new GradleException('Task 33 Claim conflict was not visibly rejected by production authority')
    }
    def controlsOutcome = outcomes['ui.graph-controls']
    if ((controlsOutcome.policyRevision as long) <= 0L || controlsOutcome.policyEnabled != 'true'
            || !controlsOutcome.visibleStatus.startsWith('Server accepted revision ')
            || controlsOutcome.worldCaptures != 'router-overview,bridge-north,provider-host,endpoint-faces'
            || !captures.any { it.path.contains('world-router-overview') }
            || !captures.any { it.path.contains('world-multipart-bridge-north') }
            || !captures.any { it.path.contains('world-provider-host') }
            || !captures.any { it.path.contains('world-endpoint-faces') }) {
        throw new GradleException('Task 33 current-source policy edit or actual-world captures are incomplete')
    }
}

def verifyLdlibReport = { File reportFile, File outputDir, Set<String> selectedScenarios, String runId ->
    if (!reportFile.isFile()) throw new GradleException("LDLib2 UI report is missing: ${reportFile}")
    def report
    try {
        report = new JsonSlurper().parse(reportFile)
    } catch (Exception exception) {
        throw new GradleException("Malformed LDLib2 UI report: ${reportFile}", exception)
    }
    if (report.schema != 1 || report.status != 'PASS' || report.runId == null
            || report.totals.scenarios != selectedScenarios.size() || report.totals.passed != selectedScenarios.size()
            || report.totals.failed != 0 || report.totals.errored != 0 || report.totals.checks <= 0
            || report.totals.checksFailed != 0 || report.totals.captures < selectedScenarios.size()) {
        throw new GradleException('LDLib2 UI report status or nonzero accounting is invalid')
    }
    def scenarios = report.scenarios.collectEntries { [(it.name): it] }
    if (scenarios.keySet() as Set != selectedScenarios) {
        throw new GradleException("LDLib2 executed scenario mismatch: ${scenarios.keySet()} != ${selectedScenarios}")
    }
    def controls = []
    def captures = []
    scenarios.each { name, scenario ->
        if (scenario.status != 'PASS' || scenario.steps == null || scenario.steps.isEmpty()) {
            throw new GradleException("LDLib2 scenario did not pass: ${name}")
        }
        scenario.steps.each { step ->
            if (step.status != 'PASS' || step.checks.any { !it.passed }) {
                throw new GradleException("LDLib2 step/check failed in ${name}: ${step.name}")
            }
            if (step.target != null) {
                if (!(step.target.selector instanceof String) || step.target.selector.isBlank()
                        || step.target.width <= 0 || step.target.height <= 0 || !step.target.hitTestOk) {
                    throw new GradleException("Invalid or unclickable control bounds in ${name}: ${step.target}")
                }
                controls.add([scenario: name, selector: step.target.selector, path: step.target.path,
                        x: step.target.x, y: step.target.y, width: step.target.width, height: step.target.height])
            }
            step.captures.each { capture ->
                def image = new File(outputDir, capture.path as String).canonicalFile
                if (!image.toPath().startsWith(outputDir.canonicalFile.toPath()) || !image.isFile()
                        || image.length() <= 100 || capture.suspect) {
                    throw new GradleException("Missing, blank, suspect, or external screenshot: ${capture.path}")
                }
                def dimensionsLog = File.createTempFile('ae2f-ui-identify-', '.txt')
                try {
                    def identify = uiRunProcess(['identify', '-format', '%m %w %h %[mean] %[standard-deviation]', image.absolutePath],
                            uiRepositoryDir, dimensionsLog, 20, [:])
                    if (identify.exit != 0) throw new GradleException("Cannot inspect screenshot ${image}")
                    def metadata = dimensionsLog.text.trim().split(/\s+/)
                    if (metadata.size() != 5 || metadata[0] != 'PNG' || (metadata[1] as int) <= 0
                            || (metadata[2] as int) <= 0 || (metadata[4] as double) <= 0d) {
                        throw new GradleException("Screenshot has invalid dimensions or flat pixels: ${image}")
                    }
                    captures.add([scenario: name, path: outputDir.parentFile.toPath().relativize(image.toPath()).toString(),
                            sha256: uiSha256(image.bytes), width: metadata[1] as int, height: metadata[2] as int,
                            mean: metadata[3] as double, standardDeviation: metadata[4] as double])
                } finally {
                    dimensionsLog.delete()
                }
            }
        }
    }
    def attachments = scenarios.values().collectMany { scenario ->
        scenario.steps.collectMany { step -> step.attachments == null ? [] : [step.attachments] }
    }
    def shared = attachments.find { it.controlId == 'shared_resource_text' }
    if (selectedScenarios == uiTaskThreeScenarioNames) {
        def ack = attachments.find { it.controlId == 'ack_control' }
        if (shared?.visibleText != 'Shared resource rendered after reload'
                || ack?.visibleText != "Server acknowledged ${runId}"
                || ack?.acknowledgmentId != runId || controls.find { it.selector == '#ack_control' } == null) {
            throw new GradleException('Rendered shared-resource text, stable control, or matching server acknowledgment is missing')
        }
    } else if (selectedScenarios == uiTaskFifteenScenarioNames) {
        verifyTaskFifteenReport(attachments, controls, captures, runId)
    } else if (selectedScenarios == uiTaskThirtyThreeScenarioNames) {
        verifyTaskThirtyThreeReport(attachments, controls, captures, runId)
    } else {
        throw new GradleException("Unsupported LDLib2 scenario set: ${selectedScenarios}")
    }
    def environment = report.environment
    def runtime = selectedScenarios == uiTaskThreeScenarioNames ? shared
            : attachments.find { it.glRenderer != null }
    if (environment.guiScale <= 0 || environment.windowWidth <= 0 || environment.windowHeight <= 0
            || environment.framebufferWidth <= 0 || environment.framebufferHeight <= 0
            || environment.inputMode != 'SYNTHETIC' || runtime?.guiScale == null
            || runtime?.windowWidth == null || runtime?.windowHeight == null
            || runtime?.framebufferWidth == null || runtime?.framebufferHeight == null) {
        throw new GradleException('LDLib2 client environment metadata is incomplete')
    }
    [report: report, controls: controls, captures: captures, attachments: attachments]
}

def verifyUiPersistedReport
verifyUiPersistedReport = { File resultFile, boolean requireCurrentIdentity ->
    uiStrictCanonicalPath(resultFile)
    if (!resultFile.isFile()) throw new GradleException("UI result report does not exist: ${resultFile}")
    def attempt = resultFile.parentFile.canonicalFile
    def report
    try {
        report = new JsonSlurper().parse(resultFile)
    } catch (Exception exception) {
        throw new GradleException("Malformed UI result report: ${resultFile}", exception)
    }
    if (report.schemaVersion != 3 || report.kind != 'ui' || report.status != 'complete' || report.parentExit != 0
            || report.evidenceRoot != attempt.parentFile.canonicalPath || report.attemptPath != attempt.canonicalPath
            || attempt.name != "attempt-${report.runId}") {
        throw new GradleException('UI result report identity/status is invalid')
    }
    def binding = [evidenceRoot: report.evidenceRoot, attemptPath: report.attemptPath, runId: report.runId]
    if (report.pathIdentitySha256 != uiSha256(JsonOutput.toJson(binding).getBytes(StandardCharsets.UTF_8))) {
        throw new GradleException('UI producer path identity hash mismatch')
    }
    def started = Instant.parse(report.startedAt as String)
    def ended = Instant.parse(report.endedAt as String)
    if (ended.isBefore(started) || ended.isAfter(Instant.now().plusSeconds(5))
            || started.isBefore(Instant.now().minusSeconds(900))) {
        throw new GradleException('UI result timestamps are stale or invalid')
    }
    def expectedCases = report.requested as Set
    if (!(report.requested instanceof List)
            || !(expectedCases == uiTaskThreeExpectedCases || expectedCases == uiTaskFifteenExpectedCases
                    || expectedCases == uiTaskThirtyThreeExpectedCases || expectedCases == uiTaskThirtyFourExpectedCases)
            || report.executed != report.requested
            || !(report.assertions instanceof List) || report.assertions.size() != report.requested.size()
            || report.assertions.any { it.status != 'passed' || !(it.caseId in report.requested) }
            || report.clientExit != 0 || report.displayMode != 'xvfb' || report.inputMode != 'SYNTHETIC'
            || !(report.controls instanceof List) || report.controls.isEmpty()
            || !(report.screenshots instanceof List) || report.screenshots.size() < 2) {
        throw new GradleException('UI case, client, control, input, or screenshot accounting is incomplete')
    }
    report.artifacts.each { artifact ->
        def file = new File(attempt, artifact.path as String).canonicalFile
        if (!file.toPath().startsWith(attempt.toPath()) || !file.isFile() || uiSha256(file.bytes) != artifact.sha256) {
            throw new GradleException("UI artifact is missing, external, or hash-mismatched: ${artifact.path}")
        }
    }
    report.screenshots.each { screenshot ->
        def file = new File(attempt, screenshot.path as String).canonicalFile
        if (!file.toPath().startsWith(attempt.toPath()) || !file.isFile()
                || uiSha256(file.bytes) != screenshot.sha256) {
            throw new GradleException("UI screenshot is stale or hash-mismatched: ${screenshot.path}")
        }
    }
    if (expectedCases == uiTaskThirtyFourExpectedCases) {
        def server = new Properties(); server.load(new File(attempt, 'server.properties').newInputStream())
        def clientA = new Properties(); clientA.load(new File(attempt, 'clients/client-a.properties').newInputStream())
        def clientB = new Properties(); clientB.load(new File(attempt, 'clients/client-b.properties').newInputStream())
        if (server.getProperty('status') != 'passed' || server.getProperty('dedicatedServer') != 'true'
                || server.getProperty('connectedClients') != '2' || server.getProperty('authoritativeRevision') != '1'
                || server.getProperty('staleRevisionRejected') != 'true'
                || server.getProperty('federationDomainSplitInvalidated') != 'true'
                || server.getProperty('scopeRefreshed') != 'true'
                || server.getProperty('refreshedFederationDomainMembers') != '2'
                || server.getProperty('refreshedReferenceCurrent') != 'true'
                || server.getProperty('refreshedExpectedIdentities') != 'true'
                || server.getProperty('activeSubscriptions') != '0'
                || (server.getProperty('subscriptionRemovals') as long) < 4
                || (server.getProperty('closedGuiSimulationTicks') as long) < 20
                || clientA.getProperty('singleplayer') != 'false' || clientB.getProperty('singleplayer') != 'false'
                || clientA.getProperty('firstAccepted') != 'true' || clientB.getProperty('staleRevision') != 'true'
                || clientA.getProperty('staleContext') != 'true'
                || clientB.getProperty('staleRevisionRenderedText') != 'Rejected by server: policy revision is now 1'
                || (clientB.getProperty('staleRevisionStableFrames') as int) < 3
                || clientA.getProperty('staleContextRenderedText') != 'Rejected by server: Federation Domain topology changed; reopen this editor'
                || (clientA.getProperty('staleContextStableFrames') as int) < 3
                || !report.screenshots.any { it.path == 'clients/client-b-stale-revision.png' }
                || !report.screenshots.any { it.path == 'clients/client-a-domain-split.png' }
                || clientA.getProperty('refreshedRenderedStatus') != 'Ready - changes require server confirmation'
                || clientB.getProperty('refreshedRenderedStatus') != 'Ready - changes require server confirmation'
                || clientA.getProperty('refreshedRenderedMembers') != '2 members'
                || clientB.getProperty('refreshedRenderedMembers') != '2 members'
                || (clientA.getProperty('refreshedStableFrames') as int) < 3
                || (clientB.getProperty('refreshedStableFrames') as int) < 3
                || !report.screenshots.any { it.path == 'clients/client-a-refreshed.png' }
                || !report.screenshots.any { it.path == 'clients/client-b-refreshed.png' }
                || clientA.getProperty('scopeRefreshed') != 'true' || clientB.getProperty('scopeRefreshed') != 'true'
                || report.serverExit != 0 || report.clientExits != [A: 0, B: 0]) {
            throw new GradleException('Task 34 dedicated-server authority, invalidation, or cleanup evidence is invalid')
        }
    } else {
        def upstreamArtifacts = report.artifacts.findAll { it.path == 'ldlib2/report.json' }
        if (upstreamArtifacts.size() != 1) {
            throw new GradleException('UI result must bind exactly one LDLib2 report artifact')
        }
        def upstreamReport = new File(attempt, upstreamArtifacts[0].path as String).canonicalFile
        def selectedScenarios = expectedCases.findAll { it in uiAllScenarioNames } as Set
        def verifiedUpstream = verifyLdlibReport(upstreamReport, upstreamReport.parentFile, selectedScenarios,
                report.runId as String)
        def upstreamAttachments = verifiedUpstream.attachments.findAll { !it.isEmpty() }
        def renderer = upstreamAttachments.find { it.glRenderer != null } ?: [:]
        if (report.upstreamReportRunId != verifiedUpstream.report.runId
                || report.controls != verifiedUpstream.controls || report.controlAttachments != upstreamAttachments
                || report.screenshots != verifiedUpstream.captures || report.guiScale != renderer.guiScale as double
                || report.language != renderer.language || report.glVendor != renderer.glVendor
                || report.glRenderer != renderer.glRenderer || report.glVersion != renderer.glVersion
                || report.window != [width: renderer.windowWidth as int, height: renderer.windowHeight as int,
                        framebufferWidth: renderer.framebufferWidth as int,
                        framebufferHeight: renderer.framebufferHeight as int]) {
            throw new GradleException('UI result semantic projections do not match the bound LDLib2 report')
        }
    }
    if (requireCurrentIdentity) {
        def identityDir = new File(attempt, '.identity-check')
        def identity = uiCurrentSourceIdentity(identityDir)
        uiDeleteRecursively(identityDir)
        def jar = uiProductJar.get().asFile
        def ldlib = uiLdlibJar.get()
        if (report.sourceRevision != identity.revision || report.dirtyDiffSha256 != identity.dirtySha256
                || report.dependencyLockSha256 != uiSha256(uiVerificationMetadata.asFile.bytes)
                || !jar.isFile() || report.productJarSha256 != uiSha256(jar.bytes)
                || ldlib == null || report.ldlibJarSha256 != uiSha256(ldlib.bytes)) {
            throw new GradleException('UI report source, dependency, product, or LDLib2 identity is stale')
        }
    }
    report
}

def uiCopyRecursively = { File source, File target ->
    Files.walk(source.toPath()).withCloseable { paths ->
        paths.forEach { path ->
            def destination = target.toPath().resolve(source.toPath().relativize(path))
            if (Files.isDirectory(path)) {
                Files.createDirectories(destination)
            } else {
                Files.copy(path, destination, StandardCopyOption.REPLACE_EXISTING)
            }
        }
    }
}

def uiCreatePersistedProbe = { File resultFile, File probeRoot, String name, Closure mutate ->
    def originalAttempt = resultFile.parentFile.canonicalFile
    def attempt = new File(probeRoot, "${name}/${originalAttempt.name}")
    uiCopyRecursively(originalAttempt, attempt)
    def reboundResult = new File(attempt, 'result.json')
    def report = new JsonSlurper().parse(reboundResult)
    def binding = [evidenceRoot: attempt.parentFile.canonicalPath, attemptPath: attempt.canonicalPath,
            runId: report.runId]
    report.evidenceRoot = binding.evidenceRoot
    report.attemptPath = binding.attemptPath
    report.pathIdentitySha256 = uiSha256(JsonOutput.toJson(binding).getBytes(StandardCharsets.UTF_8))
    def identityDir = new File(attempt, '.probe-identity')
    def identity = uiCurrentSourceIdentity(identityDir)
    uiDeleteRecursively(identityDir)
    report.sourceRevision = identity.revision
    report.dirtyDiffSha256 = identity.dirtySha256
    report.dependencyLockSha256 = uiSha256(uiVerificationMetadata.asFile.bytes)
    report.productJarSha256 = uiSha256(uiProductJar.get().asFile.bytes)
    report.ldlibJarSha256 = uiSha256(uiLdlibJar.get().bytes)
    report.startedAt = Instant.now().minusSeconds(1).toString()
    report.endedAt = Instant.now().toString()
    def upstream = report.requested as Set == uiTaskThirtyFourExpectedCases
            ? attempt : new File(attempt, 'ldlib2/report.json')
    mutate(report, upstream)
    report.artifacts.each { artifact ->
        artifact.sha256 = uiSha256(new File(attempt, artifact.path as String).bytes)
    }
    reboundResult.text = JsonOutput.prettyPrint(JsonOutput.toJson(report)) + '\n'
    reboundResult
}

def uiPersistedVerifierRejects = { File resultFile, File probeRoot, String name, Closure mutate ->
    def reboundResult = uiCreatePersistedProbe(resultFile, probeRoot, name, mutate)
    try {
        verifyUiPersistedReport(reboundResult, true)
        null
    } catch (GradleException exception) {
        exception.message
    }
}

def uiPersistedOuterRejects = { File baselineResult, File probeRoot, String name, Closure mutate ->
    def sourceAttempt = baselineResult.parentFile.canonicalFile
    def attempt = new File(probeRoot, "${name}/${sourceAttempt.name}")
    uiCopyRecursively(sourceAttempt, attempt)
    def result = new File(attempt, 'result.json')
    def report = new JsonSlurper().parse(result)
    def binding = [evidenceRoot: attempt.parentFile.canonicalPath, attemptPath: attempt.canonicalPath,
            runId: report.runId]
    report.evidenceRoot = binding.evidenceRoot
    report.attemptPath = binding.attemptPath
    report.pathIdentitySha256 = uiSha256(JsonOutput.toJson(binding).getBytes(StandardCharsets.UTF_8))
    mutate(report, attempt)
    result.text = JsonOutput.prettyPrint(JsonOutput.toJson(report)) + '\n'
    try {
        verifyUiPersistedReport(result, true)
        null
    } catch (GradleException exception) {
        exception.message
    }
}

def uiPreparePersistedBaseline = { File canonicalResult, File probeRoot ->
    def baselineAttempt = new File(probeRoot, "baseline/${canonicalResult.parentFile.name}")
    uiCopyRecursively(canonicalResult.parentFile, baselineAttempt)
    def baselineResult = new File(baselineAttempt, 'result.json')
    def baselineReport = new JsonSlurper().parse(baselineResult)
    def sourceIdentity = uiCurrentSourceIdentity(new File(baselineAttempt, '.identity-rebind'))
    uiDeleteRecursively(new File(baselineAttempt, '.identity-rebind'))
    def binding = [evidenceRoot: baselineAttempt.parentFile.canonicalPath,
            attemptPath: baselineAttempt.canonicalPath, runId: baselineReport.runId]
    baselineReport.evidenceRoot = binding.evidenceRoot
    baselineReport.attemptPath = binding.attemptPath
    baselineReport.pathIdentitySha256 = uiSha256(JsonOutput.toJson(binding).getBytes(StandardCharsets.UTF_8))
    baselineReport.sourceRevision = sourceIdentity.revision
    baselineReport.dirtyDiffSha256 = sourceIdentity.dirtySha256
    baselineReport.dependencyLockSha256 = uiSha256(uiVerificationMetadata.asFile.bytes)
    baselineReport.productJarSha256 = uiSha256(uiProductJar.get().asFile.bytes)
    baselineReport.ldlibJarSha256 = uiSha256(uiLdlibJar.get().bytes)
    baselineReport.startedAt = Instant.now().minusSeconds(1).toString()
    baselineReport.endedAt = Instant.now().toString()
    baselineReport.artifacts.each { artifact ->
        artifact.sha256 = uiSha256(new File(baselineAttempt, artifact.path as String).bytes)
    }
    baselineResult.text = JsonOutput.prettyPrint(JsonOutput.toJson(baselineReport)) + '\n'
    verifyUiPersistedReport(baselineResult, true)
    baselineResult
}

