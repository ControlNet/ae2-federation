tasks.register('federationUiTest') {
    group = 'verification'
    description = 'Runs bounded LDLib2 2.2.34 scenarios in an actual Minecraft client under Xvfb.'
    dependsOn(tasks.named('jar'), tasks.named('test'), tasks.named('testmodClasses'))
    notCompatibleWithConfigurationCache('Launches an isolated actual client and captures current machine evidence.')
    doLast {
        def requested = casesProperty.orNull?.split(',')?.collect { it.trim() }?.findAll { !it.isEmpty() } ?: []
        def requestedSet = requested as Set
        def selectedScenarioNames = requestedSet == uiTaskThreeExpectedCases ? uiTaskThreeScenarioNames
                : requestedSet == uiTaskFifteenExpectedCases ? uiTaskFifteenScenarioNames : null
        if (requested.isEmpty() || selectedScenarioNames == null) {
            throw new GradleException("UI verification requires exact Task 3 or Task 15 cases; requested=${requested}")
        }
        def evidenceText = uiEvidenceProperty.orNull
        if (evidenceText == null || evidenceText.isBlank()) throw new GradleException('Missing -PevidenceDir')
        def evidenceRoot = uiStrictCanonicalPath(rootProject.file(evidenceText))
        evidenceRoot.mkdirs()
        def runId = DateTimeFormatter.ofPattern("yyyyMMdd'T'HHmmssSSS'Z'").withZone(ZoneOffset.UTC).format(Instant.now())
        def attempt = new File(evidenceRoot, "attempt-${runId}")
        if (!attempt.mkdirs()) throw new GradleException("Cannot create UI evidence attempt ${attempt}")
        def sourceIdentity = uiCurrentSourceIdentity(attempt)
        def jar = uiProductJar.get().asFile
        def ldlib = uiLdlibJar.get()
        if (ldlib == null) throw new GradleException('Resolved LDLib2 2.2.34 all JAR is unavailable')
        def startedAt = Instant.now().toString()
        def ldlibOutput = new File(attempt, 'ldlib2')
        def clientLog = new File(attempt, 'actual-client.log')
        def gradleExecutable = new File(gradle.gradleHomeDir, 'bin/gradle')
        def command = ['xvfb-run', '--auto-servernum', '--server-args=-screen 0 1280x720x24 -nolisten tcp',
                gradleExecutable.absolutePath, '--no-daemon', '--dependency-verification=strict',
                ':neoforge-1.21.1:runUiTestClient',
                 "-PfederationUiSelection=${selectedScenarioNames.join(',')}",
                "-PfederationUiOutputDir=${ldlibOutput.absolutePath}", "-PfederationUiRunId=${runId}",
                '-PfederationUiGuiScale=3', '-PfederationUiWindow=1280x720', '-PfederationUiWatchdogSec=90']
        def child
        try {
            child = uiRunProcess(command, uiRepositoryDir, clientLog, 240, ['LIBGL_ALWAYS_SOFTWARE': '1'])
        } finally {
            cleanupUiRuntime(attempt)
        }
        if (child.exit != 0 || child.timedOut) {
            throw new GradleException("Actual Minecraft client failed or timed out; exit=${child.exit}, log=${clientLog}")
        }
        def verified = verifyLdlibReport(new File(ldlibOutput, 'report.json'), ldlibOutput, selectedScenarioNames, runId)
        def assertionMap = requested.collect { caseId -> [caseId: caseId, status: 'passed'] }
        def cleanupReceipt = new File(attempt, 'cleanup-receipt.txt')
        cleanupReceipt.text = 'xvfb-run owned the private display with -nolisten tcp; actual client exited; run-uitest was removed; no task-owned listener/world/config remains.\n'
        def files = []
        Files.walk(attempt.toPath()).withCloseable { paths ->
            paths.filter { Files.isRegularFile(it) }.forEach { path ->
                def relative = attempt.toPath().relativize(path).toString()
                if (relative != 'result.json' && !relative.startsWith('.identity-check/')) {
                    files.add(path.toFile())
                }
            }
        }
        def artifacts = files.collect { file ->
            def canonical = file.canonicalFile
            [path: attempt.canonicalFile.toPath().relativize(canonical.toPath()).toString(), sha256: uiSha256(canonical.bytes)]
        }
        def binding = [evidenceRoot: evidenceRoot.canonicalPath, attemptPath: attempt.canonicalPath, runId: runId]
        def attachments = verified.attachments.findAll { !it.isEmpty() }
        def renderer = attachments.find { it.glRenderer != null } ?: [:]
        def report = [schemaVersion: 3, kind: 'ui', status: 'complete', runId: runId,
                evidenceRoot: binding.evidenceRoot, attemptPath: binding.attemptPath,
                pathIdentitySha256: uiSha256(JsonOutput.toJson(binding).getBytes(StandardCharsets.UTF_8)),
                sourceRevision: sourceIdentity.revision, dirtyDiffSha256: sourceIdentity.dirtySha256,
                dependencyLockSha256: uiSha256(uiVerificationMetadata.asFile.bytes),
                productJarSha256: uiSha256(jar.bytes), ldlibJarSha256: uiSha256(ldlib.bytes),
                ldlibCoordinates: 'com.lowdragmc.ldlib2:ldlib2-neoforge-1.21.1:2.2.34:all',
                startedAt: startedAt, endedAt: Instant.now().toString(), requested: requested, executed: requested,
                assertions: assertionMap, parentExit: 0, clientExit: child.exit, displayMode: 'xvfb',
                displayNetwork: 'disabled (-nolisten tcp)', inputMode: 'SYNTHETIC',
                guiScale: renderer.guiScale as double, language: renderer.language,
                glVendor: renderer.glVendor, glRenderer: renderer.glRenderer, glVersion: renderer.glVersion,
                window: [width: renderer.windowWidth as int, height: renderer.windowHeight as int,
                        framebufferWidth: renderer.framebufferWidth as int,
                        framebufferHeight: renderer.framebufferHeight as int],
                controls: verified.controls, controlAttachments: attachments, screenshots: verified.captures,
                upstreamReportRunId: verified.report.runId, artifacts: artifacts]
        def resultFile = new File(attempt, 'result.json')
        resultFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(report)) + '\n'
        verifyUiPersistedReport(resultFile, true)
        def outerProbeRoot = new File(temporaryDir, "outer-${runId}")
        uiDeleteRecursively(outerProbeRoot)
        try {
            def baselineResult = uiPreparePersistedBaseline(resultFile, outerProbeRoot)
            def outerRejections = [
                    stale: uiPersistedOuterRejects(baselineResult, outerProbeRoot, 'stale') { probe, probeAttempt ->
                        probe.startedAt = Instant.now().minusSeconds(3600).toString()
                    },
                    missing: uiPersistedOuterRejects(baselineResult, outerProbeRoot, 'missing') { probe, probeAttempt ->
                        new File(probeAttempt, probe.screenshots[0].path as String).delete()
                    },
                    mismatch: uiPersistedOuterRejects(baselineResult, outerProbeRoot, 'mismatch') { probe, probeAttempt ->
                        probe.runId = 'different'
                    },
                    screenshotHash: uiPersistedOuterRejects(baselineResult, outerProbeRoot, 'screenshot-hash') { probe, probeAttempt ->
                        new File(probeAttempt, probe.screenshots[0].path as String).bytes = [1, 2, 3] as byte[]
                    }
            ]
            if (outerRejections.any { it.value == null }) {
                throw new GradleException("Stale, missing, mismatched, or screenshot-hash UI evidence was accepted: ${outerRejections}")
            }
        } finally {
            uiDeleteRecursively(outerProbeRoot)
        }
        logger.lifecycle("Federation UI evidence: ${attempt}")
    }
}

tasks.register('federationUiVerifyEvidence') {
    group = 'verification'
    description = 'Consumes and validates a persisted Task 3 actual-client report.'
    dependsOn(tasks.named('jar'))
    notCompatibleWithConfigurationCache('Captures current Git worktree identity while consuming UI evidence.')
    doLast {
        def resultText = uiResultProperty.orNull
        if (resultText == null || resultText.isBlank()) throw new GradleException('Missing -PresultFile')
        def resultFile = new File(resultText)
        verifyUiPersistedReport(resultFile.isAbsolute() ? resultFile : new File(uiRepositoryDir, resultText), true)
    }
}

tasks.register('federationUiVerifierSelfTest') {
    group = 'verification'
    description = 'Proves rebound malformed or forged upstream LDLib2 reports fail persisted consumption.'
    dependsOn(tasks.named('jar'))
    notCompatibleWithConfigurationCache('Copies and mutates a canonical persisted UI evidence attempt.')
    doLast {
        def resultText = uiResultProperty.orNull
        if (resultText == null || resultText.isBlank()) throw new GradleException('Missing -PresultFile')
        def resultFile = new File(resultText)
        def canonicalResult = resultFile.isAbsolute() ? resultFile : new File(uiRepositoryDir, resultText)
        def probeRoot = new File(temporaryDir, 'rebound-upstream')
        uiDeleteRecursively(probeRoot)
        try {
            def baselineResult = uiPreparePersistedBaseline(canonicalResult, probeRoot)
            def rejected = uiMutationsFor(baselineResult).collectEntries { name, mutate ->
                [(name): uiPersistedVerifierRejects(baselineResult, probeRoot, name, mutate)]
            }
            if (rejected.any { it.value == null }) {
                throw new GradleException("Persisted UI verifier accepted rebound upstream evidence: ${rejected}")
            }
            rejected.each { name, reason ->
                logger.lifecycle("Federation UI verifier probe: ${name}=rejected reason=${reason}")
            }
        } finally {
            uiDeleteRecursively(probeRoot)
        }
    }
}

tasks.register('federationUiVerifierProbe') {
    group = 'verification'
    description = 'Runs one rebound upstream LDLib2 corruption through persisted consumption and must fail.'
    dependsOn(tasks.named('jar'))
    notCompatibleWithConfigurationCache('Copies and mutates a canonical persisted UI evidence attempt.')
    doLast {
        def resultText = uiResultProperty.orNull
        if (resultText == null || resultText.isBlank()) throw new GradleException('Missing -PresultFile')
        def probeName = uiProbeProperty.orNull
        def resultFile = new File(resultText)
        def canonicalResult = resultFile.isAbsolute() ? resultFile : new File(uiRepositoryDir, resultText)
        def mutations = uiMutationsFor(canonicalResult)
        def mutation = mutations[probeName]
        if (mutation == null) throw new GradleException("Unknown -Pprobe; expected ${mutations.keySet()}")
        def probeRoot = new File(temporaryDir, "selected-${probeName}")
        uiDeleteRecursively(probeRoot)
        try {
            def baselineResult = uiPreparePersistedBaseline(canonicalResult, probeRoot)
            def reboundResult = uiCreatePersistedProbe(baselineResult, probeRoot, probeName, mutation)
            verifyUiPersistedReport(reboundResult, true)
            throw new GradleException("Persisted UI verifier accepted rebound probe ${probeName}")
        } finally {
            uiDeleteRecursively(probeRoot)
        }
    }
}
