    def requested = new JsonSlurper().parse(resultFile).requested as Set
    requested == uiTaskFifteenExpectedCases ? uiTaskFifteenUpstreamMutations
            : requested == uiTaskThirtyThreeExpectedCases ? uiTaskThirtyThreeUpstreamMutations
            : requested == uiTaskThirtyFourExpectedCases ? uiTaskThirtyFourUpstreamMutations : uiUpstreamMutations
}

def cleanupUiRuntime = { File attempt ->
    def runtime = layout.projectDirectory.dir('run-uitest').asFile
    def diagnostics = new File(attempt, 'runtime-diagnostics')
    diagnostics.mkdirs()
    try {
        if (runtime.exists()) {
            Files.walk(runtime.toPath()).withCloseable { paths ->
                paths.filter { Files.isRegularFile(it) }.forEach { source ->
                    def relative = runtime.toPath().relativize(source)
                    if (relative.startsWith('logs') || relative.startsWith('crash-reports')) {
                        def target = diagnostics.toPath().resolve(relative)
                        Files.createDirectories(target.parent)
                        Files.copy(source, target, StandardCopyOption.REPLACE_EXISTING)
                    }
                }
            }
        }
    } finally {
        uiDeleteRecursively(runtime)
    }
}

def casesProperty = providers.gradleProperty('cases')
def uiEvidenceProperty = providers.gradleProperty('evidenceDir')
def uiResultProperty = providers.gradleProperty('resultFile')
def uiProbeProperty = providers.gradleProperty('probe')

tasks.register('federationUiTest') {
    group = 'verification'
    description = 'Runs bounded LDLib2 2.2.34 scenarios in an actual Minecraft client under Xvfb.'
    dependsOn(tasks.named('jar'), tasks.named('test'), tasks.named('testmodClasses'))
    notCompatibleWithConfigurationCache('Launches an isolated actual client and captures current machine evidence.')
    doLast {
        def requested = casesProperty.orNull?.split(',')?.collect { it.trim() }?.findAll { !it.isEmpty() } ?: []
        def requestedSet = requested as Set
        if (requested == ['final.native-workflow', 'final.router-six-faces', 'final.bridge-invalid',
                'final.policy-reconnect', 'final.chinese-scales']) {
            throw new GradleException('F3 BLOCKED: the exact actual-client final workflow and benchmark spot-check are not implemented')
        }
        def taskThirtyFour = requestedSet == uiTaskThirtyFourExpectedCases
        def selectedScenarioNames = requestedSet == uiTaskThreeExpectedCases ? uiTaskThreeScenarioNames
                : requestedSet == uiTaskFifteenExpectedCases ? uiTaskFifteenScenarioNames
                : requestedSet == uiTaskThirtyThreeExpectedCases ? uiTaskThirtyThreeScenarioNames : null
        if (requested.isEmpty() || (selectedScenarioNames == null && !taskThirtyFour)) {
            throw new GradleException("UI verification requires exact Task 3, Task 15, Task 33, or Task 34 cases; requested=${requested}")
        }
        def evidenceText = uiEvidenceProperty.orNull
        if (evidenceText == null || evidenceText.isBlank()) throw new GradleException('Missing -PevidenceDir')
        def evidenceRoot = uiStrictCanonicalPath(rootProject.file(evidenceText))
        evidenceRoot.mkdirs()
        def runId = DateTimeFormatter.ofPattern("yyyyMMdd'T'HHmmssSSS'Z'").withZone(ZoneOffset.UTC).format(Instant.now())
        def attempt = new File(evidenceRoot, "attempt-${runId}")
        if (!attempt.mkdirs()) throw new GradleException("Cannot create UI evidence attempt ${attempt}")
        def sourceIdentity = uiCurrentSourceIdentity(attempt)
        def jar = uiProductJar.get().asFile
        def ldlib = uiLdlibJar.get()
        if (ldlib == null) throw new GradleException('Resolved LDLib2 2.2.34 all JAR is unavailable')
        def startedAt = Instant.now().toString()
        if (taskThirtyFour) {
            def gradleExecutable = new File(gradle.gradleHomeDir, 'bin/gradle')
            def serverEvidence = new File(attempt, 'server.properties')
            def clientsDir = new File(attempt, 'clients'); clientsDir.mkdirs()
            def runtimeRoot = new File(layout.buildDirectory.get().asFile, "task34-runtime-${runId}")
            def portSocket = new java.net.ServerSocket(0, 1, java.net.InetAddress.getLoopbackAddress())
            def port = portSocket.localPort; portSocket.close()
            def start = { List<String> command, File log, Map<String, String> environment ->
                log.parentFile.mkdirs()
                def builder = new ProcessBuilder(command.collect { it.toString() }).directory(uiRepositoryDir)
                        .redirectErrorStream(true).redirectOutput(log)
                builder.environment().putAll(environment)
                builder.start()
            }
            def base = [gradleExecutable.absolutePath, '--no-daemon', '--no-configuration-cache',
                    '--dependency-verification=strict']
            def serverLog = new File(attempt, 'dedicated-server.log')
            def serverDir = new File(runtimeRoot, 'server')
            def server = start(base + [':neoforge-1.21.1:runMulticlientServer',
                    "-PfederationMultiClientGameDir=${serverDir.absolutePath}",
                    "-PfederationMultiClientPort=${port}",
                    "-PfederationMultiClientServerEvidence=${serverEvidence.absolutePath}"], serverLog, [:])
            def clientA = null
            def clientB = null
            try {
                def readyDeadline = System.nanoTime() + TimeUnit.SECONDS.toNanos(120)
                def listening = false
                while (server.isAlive() && System.nanoTime() < readyDeadline && !listening) {
                    try (def socket = new java.net.Socket()) {
                        socket.connect(new java.net.InetSocketAddress('127.0.0.1', port), 250)
                        listening = true
                    } catch (IOException ignored) {
                        TimeUnit.MILLISECONDS.sleep(250)
                    }
                }
                if (!listening) throw new GradleException("Task 34 dedicated server did not listen; log=${serverLog}")
                def clientCommand = { String role ->
                    def clientGameDirectory = new File(runtimeRoot, "client-${role}").absolutePath
                    def command = ['xvfb-run', '--auto-servernum',
                            '--server-args=-screen 0 1280x720x24 -nolisten tcp']
                    command.addAll(base)
                    command.addAll([":neoforge-1.21.1:runMulticlientClient${role}",
                            "-PfederationMultiClientGameDir=${clientGameDirectory}",
                            "-PfederationMultiClientPort=${port}", "-PfederationMultiClientRole=${role}",
                            "-PfederationMultiClientUsername=Client${role}",
                            "-PfederationMultiClientClientOutput=${clientsDir.absolutePath}",
                            "-PfederationMultiClientServerEvidence=${serverEvidence.absolutePath}"])
                    command
                }
                clientA = start(clientCommand('A'), new File(attempt, 'client-a.log'), ['LIBGL_ALWAYS_SOFTWARE': '1'])
                clientB = start(clientCommand('B'), new File(attempt, 'client-b.log'), ['LIBGL_ALWAYS_SOFTWARE': '1'])
                def deadline = System.nanoTime() + TimeUnit.SECONDS.toNanos(300)
                while ((clientA.isAlive() || clientB.isAlive()) && System.nanoTime() < deadline) {
                    TimeUnit.MILLISECONDS.sleep(250)
                }
                if (clientA.isAlive() || clientB.isAlive()) throw new GradleException('Task 34 clients timed out')
                if (clientA.exitValue() != 0 || clientB.exitValue() != 0) {
                    throw new GradleException("Task 34 client/server evidence failed; A=${clientA.exitValue()}, B=${clientB.exitValue()}")
                }
                def evidenceDeadline = System.nanoTime() + TimeUnit.SECONDS.toNanos(30)
                while (server.isAlive() && !serverEvidence.isFile() && System.nanoTime() < evidenceDeadline) {
                    TimeUnit.MILLISECONDS.sleep(250)
                }
                if (!serverEvidence.isFile()) throw new GradleException('Task 34 server evidence timed out')
                if (server.isAlive()) server.outputStream.withWriter { it.write('stop\n'); it.flush() }
                if (!server.waitFor(30, TimeUnit.SECONDS)) throw new GradleException('Task 34 server did not stop cleanly')
                if (server.exitValue() != 0) throw new GradleException("Task 34 server exit=${server.exitValue()}")

                def screenshots = []
                clientsDir.listFiles()?.findAll { it.name.endsWith('.png') }?.sort { it.name }?.each { image ->
                    def dimensionsLog = File.createTempFile('ae2f-task34-identify-', '.txt')
                    try {
                        def identify = uiRunProcess(['identify', '-format', '%m %w %h %[mean] %[standard-deviation]',
                                image.absolutePath], uiRepositoryDir, dimensionsLog, 20, [:])
                        def metadata = dimensionsLog.text.trim().split(/\s+/)
                        if (identify.exit != 0 || metadata.size() != 5 || metadata[0] != 'PNG'
                                || (metadata[4] as double) <= 0d) {
                            throw new GradleException("Task 34 screenshot is blank or malformed: ${image}")
                        }
                        screenshots.add([path: attempt.toPath().relativize(image.toPath()).toString(),
                                sha256: uiSha256(image.bytes), width: metadata[1] as int, height: metadata[2] as int,
                                mean: metadata[3] as double, standardDeviation: metadata[4] as double])
                    } finally { dimensionsLog.delete() }
                }
                if (screenshots.size() < 4) throw new GradleException('Task 34 requires two screenshots from each client')
                def load = { File file -> def value = new Properties(); file.withInputStream { value.load(it) }; value }
                def clientFactsA = load(new File(clientsDir, 'client-a.properties'))
                def clientFactsB = load(new File(clientsDir, 'client-b.properties'))
                def cleanupReceipt = new File(attempt, 'cleanup-receipt.txt')
                cleanupReceipt.text = 'Task 34: two Xvfb clients and one loopback dedicated server exited; isolated game directories were removed.\n'
                def files = []
                Files.walk(attempt.toPath()).withCloseable { paths ->
                    paths.filter { Files.isRegularFile(it) }.forEach { path ->
                        if (path.fileName.toString() != 'result.json') files.add(path.toFile())
                    }
                }
                def artifacts = files.collect { file -> [path: attempt.toPath().relativize(file.toPath()).toString(),
                        sha256: uiSha256(file.bytes)] }
                def binding = [evidenceRoot: evidenceRoot.canonicalPath, attemptPath: attempt.canonicalPath, runId: runId]
                def attachments = [['role': 'A'] + clientFactsA.collectEntries { key, value -> [(key.toString()): value.toString()] },
                        ['role': 'B'] + clientFactsB.collectEntries { key, value -> [(key.toString()): value.toString()] }]
                def report = [schemaVersion: 3, kind: 'ui', status: 'complete', runId: runId,
                        evidenceRoot: binding.evidenceRoot, attemptPath: binding.attemptPath,
                        pathIdentitySha256: uiSha256(JsonOutput.toJson(binding).getBytes(StandardCharsets.UTF_8)),
                        sourceRevision: sourceIdentity.revision, dirtyDiffSha256: sourceIdentity.dirtySha256,
                        dependencyLockSha256: uiSha256(uiVerificationMetadata.asFile.bytes),
                        productJarSha256: uiSha256(jar.bytes), ldlibJarSha256: uiSha256(ldlib.bytes),
                        startedAt: startedAt, endedAt: Instant.now().toString(), requested: requested,
                        executed: requested, assertions: requested.collect { [caseId: it, status: 'passed'] },
                        parentExit: 0, clientExit: 0, clientExits: [A: clientA.exitValue(), B: clientB.exitValue()],
                        serverExit: server.exitValue(), displayMode: 'xvfb', displayNetwork: 'disabled (-nolisten tcp)',
                        inputMode: 'SYNTHETIC', guiScale: clientFactsA.guiScale as double,
                        language: clientFactsA.language, glVendor: clientFactsA.glVendor,
                        glRenderer: clientFactsA.glRenderer, glVersion: clientFactsA.glVersion,
                        window: [width: clientFactsA.windowWidth as int, height: clientFactsA.windowHeight as int,
                                framebufferWidth: clientFactsA.framebufferWidth as int,
                                framebufferHeight: clientFactsA.framebufferHeight as int],
                        controls: [[selector: '#policy_toggle', clients: ['A', 'B']]],
                        controlAttachments: attachments, screenshots: screenshots,
                        upstreamReportRunId: null, artifacts: artifacts]
                def resultFile = new File(attempt, 'result.json')
                resultFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(report)) + '\n'
                verifyUiPersistedReport(resultFile, true)
                logger.lifecycle("Federation multi-client UI evidence: ${attempt}")
                return
            } finally {
                [clientA, clientB, server].findAll { it != null && it.isAlive() }.each { process ->
                    process.toHandle().descendants().toList().reverseEach { it.destroyForcibly() }
                    process.destroyForcibly()
                }
                uiDeleteRecursively(runtimeRoot)
            }
        }
        def ldlibOutput = new File(attempt, 'ldlib2')
        def clientLog = new File(attempt, 'actual-client.log')
        def gradleExecutable = new File(gradle.gradleHomeDir, 'bin/gradle')
        def taskThirtyThreeWindow = selectedScenarioNames == uiTaskThirtyThreeScenarioNames
        def window = taskThirtyThreeWindow ? '1600x960' : '1280x720'
        def command = ['xvfb-run', '--auto-servernum', "--server-args=-screen 0 ${window}x24 -nolisten tcp",
                gradleExecutable.absolutePath, '--no-daemon', '--dependency-verification=strict',
                ':neoforge-1.21.1:runUiTestClient',
                 "-PfederationUiSelection=${selectedScenarioNames.join(',')}",
                "-PfederationUiOutputDir=${ldlibOutput.absolutePath}", "-PfederationUiRunId=${runId}",
                '-PfederationUiGuiScale=3', "-PfederationUiWindow=${window}", '-PfederationUiWatchdogSec=90']
        def child
        try {
            child = uiRunProcess(command, uiRepositoryDir, clientLog, 240, ['LIBGL_ALWAYS_SOFTWARE': '1'])
        } finally {
            cleanupUiRuntime(attempt)
        }
        if (child.exit != 0 || child.timedOut) {
            throw new GradleException("Actual Minecraft client failed or timed out; exit=${child.exit}, log=${clientLog}")
        }
        def verified = verifyLdlibReport(new File(ldlibOutput, 'report.json'), ldlibOutput, selectedScenarioNames, runId)
        def assertionMap = requested.collect { caseId -> [caseId: caseId, status: 'passed'] }
        def cleanupReceipt = new File(attempt, 'cleanup-receipt.txt')
        cleanupReceipt.text = 'xvfb-run owned the private display with -nolisten tcp; actual client exited; run-uitest was removed; no task-owned listener/world/config remains.\n'
        def files = []
        Files.walk(attempt.toPath()).withCloseable { paths ->
            paths.filter { Files.isRegularFile(it) }.forEach { path ->
                def relative = attempt.toPath().relativize(path).toString()
                if (relative != 'result.json' && !relative.startsWith('.identity-check/')) {
                    files.add(path.toFile())
                }
            }
        }
        def artifacts = files.collect { file ->
            def canonical = file.canonicalFile
            [path: attempt.canonicalFile.toPath().relativize(canonical.toPath()).toString(), sha256: uiSha256(canonical.bytes)]
        }
        def binding = [evidenceRoot: evidenceRoot.canonicalPath, attemptPath: attempt.canonicalPath, runId: runId]
        def attachments = verified.attachments.findAll { !it.isEmpty() }
        def renderer = attachments.find { it.glRenderer != null } ?: [:]
        def report = [schemaVersion: 3, kind: 'ui', status: 'complete', runId: runId,
                evidenceRoot: binding.evidenceRoot, attemptPath: binding.attemptPath,
                pathIdentitySha256: uiSha256(JsonOutput.toJson(binding).getBytes(StandardCharsets.UTF_8)),
                sourceRevision: sourceIdentity.revision, dirtyDiffSha256: sourceIdentity.dirtySha256,
                dependencyLockSha256: uiSha256(uiVerificationMetadata.asFile.bytes),
                productJarSha256: uiSha256(jar.bytes), ldlibJarSha256: uiSha256(ldlib.bytes),
                ldlibCoordinates: 'com.lowdragmc.ldlib2:ldlib2-neoforge-1.21.1:2.2.34:all',
                startedAt: startedAt, endedAt: Instant.now().toString(), requested: requested, executed: requested,
                assertions: assertionMap, parentExit: 0, clientExit: child.exit, displayMode: 'xvfb',
                displayNetwork: 'disabled (-nolisten tcp)', inputMode: 'SYNTHETIC',
                guiScale: renderer.guiScale as double, language: renderer.language,
                glVendor: renderer.glVendor, glRenderer: renderer.glRenderer, glVersion: renderer.glVersion,
                window: [width: renderer.windowWidth as int, height: renderer.windowHeight as int,
                        framebufferWidth: renderer.framebufferWidth as int,
                        framebufferHeight: renderer.framebufferHeight as int],
                controls: verified.controls, controlAttachments: attachments, screenshots: verified.captures,
                upstreamReportRunId: verified.report.runId, artifacts: artifacts]
        def resultFile = new File(attempt, 'result.json')
        resultFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(report)) + '\n'
        verifyUiPersistedReport(resultFile, true)
        def outerProbeRoot = new File(temporaryDir, "outer-${runId}")
        uiDeleteRecursively(outerProbeRoot)
        try {
            def baselineResult = uiPreparePersistedBaseline(resultFile, outerProbeRoot)
            def outerRejections = [
                    stale: uiPersistedOuterRejects(baselineResult, outerProbeRoot, 'stale') { probe, probeAttempt ->
                        probe.startedAt = Instant.now().minusSeconds(3600).toString()
                    },
                    missing: uiPersistedOuterRejects(baselineResult, outerProbeRoot, 'missing') { probe, probeAttempt ->
                        new File(probeAttempt, probe.screenshots[0].path as String).delete()
                    },
                    mismatch: uiPersistedOuterRejects(baselineResult, outerProbeRoot, 'mismatch') { probe, probeAttempt ->
                        probe.runId = 'different'
                    },
                    screenshotHash: uiPersistedOuterRejects(baselineResult, outerProbeRoot, 'screenshot-hash') { probe, probeAttempt ->
                        new File(probeAttempt, probe.screenshots[0].path as String).bytes = [1, 2, 3] as byte[]
                    }
            ]
            if (outerRejections.any { it.value == null }) {
                throw new GradleException("Stale, missing, mismatched, or screenshot-hash UI evidence was accepted: ${outerRejections}")
            }
        } finally {
            uiDeleteRecursively(outerProbeRoot)
        }
        logger.lifecycle("Federation UI evidence: ${attempt}")
    }
}

tasks.register('federationUiVerifyEvidence') {
    group = 'verification'
    description = 'Consumes and validates a persisted Task 3 actual-client report.'
    dependsOn(tasks.named('jar'))
    notCompatibleWithConfigurationCache('Captures current Git worktree identity while consuming UI evidence.')
    doLast {
        def resultText = uiResultProperty.orNull
        if (resultText == null || resultText.isBlank()) throw new GradleException('Missing -PresultFile')
        def resultFile = new File(resultText)
        verifyUiPersistedReport(resultFile.isAbsolute() ? resultFile : new File(uiRepositoryDir, resultText), true)
    }
}

tasks.register('federationUiVerifierSelfTest') {
    group = 'verification'
    description = 'Proves rebound malformed or forged upstream LDLib2 reports fail persisted consumption.'
    dependsOn(tasks.named('jar'))
    notCompatibleWithConfigurationCache('Copies and mutates a canonical persisted UI evidence attempt.')
    doLast {
        def resultText = uiResultProperty.orNull
        if (resultText == null || resultText.isBlank()) throw new GradleException('Missing -PresultFile')
        def resultFile = new File(resultText)
        def canonicalResult = resultFile.isAbsolute() ? resultFile : new File(uiRepositoryDir, resultText)
        def probeRoot = new File(temporaryDir, 'rebound-upstream')
        uiDeleteRecursively(probeRoot)
        try {
            def baselineResult = uiPreparePersistedBaseline(canonicalResult, probeRoot)
            def rejected = uiMutationsFor(baselineResult).collectEntries { name, mutate ->
                [(name): uiPersistedVerifierRejects(baselineResult, probeRoot, name, mutate)]
            }
            if (rejected.any { it.value == null }) {
                throw new GradleException("Persisted UI verifier accepted rebound upstream evidence: ${rejected}")
            }
            rejected.each { name, reason ->
                logger.lifecycle("Federation UI verifier probe: ${name}=rejected reason=${reason}")
            }
        } finally {
            uiDeleteRecursively(probeRoot)
        }
    }
}

tasks.register('federationUiVerifierProbe') {
    group = 'verification'
    description = 'Runs one rebound upstream LDLib2 corruption through persisted consumption and must fail.'
    dependsOn(tasks.named('jar'))
    notCompatibleWithConfigurationCache('Copies and mutates a canonical persisted UI evidence attempt.')
    doLast {
        def resultText = uiResultProperty.orNull
        if (resultText == null || resultText.isBlank()) throw new GradleException('Missing -PresultFile')
        def probeName = uiProbeProperty.orNull
        def resultFile = new File(resultText)
        def canonicalResult = resultFile.isAbsolute() ? resultFile : new File(uiRepositoryDir, resultText)
        def mutations = uiMutationsFor(canonicalResult)
        def mutation = mutations[probeName]
        if (mutation == null) throw new GradleException("Unknown -Pprobe; expected ${mutations.keySet()}")
        def probeRoot = new File(temporaryDir, "selected-${probeName}")
        uiDeleteRecursively(probeRoot)
        try {
            def baselineResult = uiPreparePersistedBaseline(canonicalResult, probeRoot)
            def reboundResult = uiCreatePersistedProbe(baselineResult, probeRoot, probeName, mutation)
            verifyUiPersistedReport(reboundResult, true)
            throw new GradleException("Persisted UI verifier accepted rebound probe ${probeName}")
        } finally {
            uiDeleteRecursively(probeRoot)
        }
    }
}
