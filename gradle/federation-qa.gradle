                        && it.resource == authority.event && it.attribution == authority.resource }
                        && closed.any { matchesAuthority(it, authority) && it.value == authority.value
                                && it.resource == authority.event && it.attribution == authority.resource }
                        && snapshots.any { matchesAuthority(it, authority) }
