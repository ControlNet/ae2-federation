            || parsed.craftingreplacerequester.getProperty('requesterIdentityReused') != 'false'
            || parsed.craftingreplacerequester.getProperty('oldLinkInherited') != 'false') {
        throw new GradleException('Task 29 same-coordinate requester identity was reused')
    }
}

verifyTaskTwentyBenchmarkEvidence = { File attempt, Map report, List<String> declaredPaths ->
