def executeHarness = { String kind, List<String> requestedCases, String profile, File evidenceRoot ->
    evidenceRoot = strictCanonicalPath(evidenceRoot)
    def manifest = new JsonSlurper().parse(manifestFile.asFile)
    def knownCases = manifest.cases.collectEntries { [(it.id): it] }
    def knownProfiles = manifest.profiles.collectEntries { [(it.id): it] }
    if (kind == 'verify') {
        if (requestedCases.isEmpty()) throw new GradleException('No cases requested')
        def unknown = requestedCases.findAll { !knownCases.containsKey(it) }
        if (!unknown.isEmpty()) throw new GradleException("Unknown cases: ${unknown}")
    } else if (!knownProfiles.containsKey(profile)) {
        throw new GradleException("Unknown benchmark profile: ${profile}")
    }
    def processingLifecycle = benchmarkLifecycleForEntry(knownProfiles['processing-small'] as Map)

    def runId = DateTimeFormatter.ofPattern("yyyyMMdd'T'HHmmssSSS'Z'").withZone(ZoneOffset.UTC).format(Instant.now())
    def attempt = new File(evidenceRoot, "attempt-${runId}")
    if (!attempt.mkdirs()) throw new GradleException("Cannot create evidence attempt ${attempt}")
    def sourceIdentity = currentSourceIdentity(attempt)
    def jar = productJar.get().asFile
    def startedAt = Instant.now().toString()
    def executed = []
    def assertions = []
    def childExits = [:]
    def childLifecycles = [:]
    def childArtifacts = sourceIdentity.files as List<File>

    def gradleCommand = { String label, List<String> args, Map options ->
        def log = new File(attempt, "${label}.log")
        def command = [new File(gradle.gradleHomeDir, 'bin/gradle').absolutePath, '--no-daemon',
                '--dependency-verification=strict', "-PfederationRuntimeDiagnosticsDir=${new File(attempt, label + '-cleanup').absolutePath}"] + args
        def result
        try {
            result = runProcessLifecycle(command, repositoryDir.asFile, log, options.timeout as long,
                    (options.shutdownGrace ?: 10) as long)
        } finally {
            if (!options.retainRuntime) cleanupRuntime(new File(attempt, label + '-parent-cleanup'))
        }
        childExits[label] = result.exit
        childLifecycles[label] = [executionTimedOut: result.executionTimedOut,
                shutdownTimedOut: result.shutdownTimedOut, mainExit: result.mainExit,
                survivingDescendants: result.survivingDescendants,
                executionTimeoutSeconds: result.executionTimeoutSeconds,
                shutdownGraceSeconds: result.shutdownGraceSeconds]
        childArtifacts.add(log)
        [result: result, output: log.getText(StandardCharsets.UTF_8.name())]
    }

    if (kind == 'benchmark') {
        def benchmarkProfile = knownProfiles[profile] as Map
        def profileLifecycle = benchmarkLifecycleForEntry(benchmarkProfile)
        def nativeEvidence = new File(attempt, 'benchmark-native.properties')
        def benchmarkArgs = [':neoforge-1.21.1:runGameTestServer',
                '-PfederationGameTestSelection=benchmark', "-PfederationGameTestId=${benchmarkProfile.testId}",
                "-PfederationNativeEvidenceFile=${nativeEvidence.absolutePath}"]
        File benchmarkBudget = null
        if (profile in ['processing-small', 'mixed-small']) {
            def copies = [config: 'benchmark-profile.json', baseline: 'benchmark-baseline.json',
                    budgets: 'benchmark-budgets.json'].collectEntries { field, name ->
                def source = strictCanonicalPath(rootProject.file(benchmarkProfile[field] as String))
                def target = new File(attempt, name)
                target.bytes = source.bytes
                childArtifacts.add(target)
                [(field): target]
            }
            benchmarkBudget = copies.budgets
            if (profile == 'processing-small') {
                benchmarkArgs.add("-PfederationProcessingBenchmarkProfile=${copies.config.absolutePath}")
                def replaySeed = providers.gradleProperty('processingBenchmarkSeed').orNull
                if (replaySeed != null && !replaySeed.isBlank()) {
                    benchmarkArgs.add("-PfederationProcessingBenchmarkSeed=${replaySeed}")
                }
            } else {
                benchmarkArgs.add("-PfederationMixedBenchmarkProfile=${copies.config.absolutePath}")
            }
        }
        def child = gradleCommand('benchmark-gametest', benchmarkArgs,
                [timeout: profileLifecycle.executionTimeoutSeconds,
                 shutdownGrace: profileLifecycle.shutdownGraceSeconds, retainRuntime: false])
        if (child.result.exit != 0) {
            throw new GradleException("Benchmark GameTest failed; report=${childArtifacts.last().absolutePath}")
        }
        def nativeResult = verifyNativeEvidence(nativeEvidence, [kind: 'benchmark', testId: benchmarkProfile.testId,
                structure: benchmarkProfile.structure, assertions: benchmarkProfile.assertions,
                operations: benchmarkProfile.operations])
        childArtifacts.add(nativeEvidence)
        if (profile == 'mixed-small') {
            def runtimeEvidence = new File(attempt, 'benchmark-runtime.receipts')
            if (!runtimeEvidence.isFile()) throw new GradleException('Task 30 independent runtime receipt is missing')
            childArtifacts.add(runtimeEvidence)
        }
        executed.add(profile)
        def assertion = [caseId: profile, status: 'passed', nativeTestId: benchmarkProfile.testId,
                structure: benchmarkProfile.structure,
                assertionCount: nativeResult.assertions, operationCount: nativeResult.operations,
                inserted: nativeResult.inserted, extracted: nativeResult.extracted,
                elapsedNanos: nativeResult.elapsedNanos, lifecycle: profileLifecycle]
        if (profile == 'processing-small') {
            assertion.putAll(taskTwentyProjection(loadTaskTwentyMetrics(nativeEvidence),
                    new JsonSlurper().parse(benchmarkBudget) as Map, profileLifecycle))
        }
        assertions.add(assertion)
    } else {
        def gameTestCases = requestedCases.collect { knownCases[it] }.findAll { it.backend == 'gametest' }
        gameTestCases.collectEntries { [(it.testId): it] }.each { testId, testCase ->
            def nativeEvidence = new File(attempt, "native-${testId}.properties")
            def child = gradleCommand("positive-${testId}", [':neoforge-1.21.1:runGameTestServer',
                    '-PfederationGameTestSelection=positive', "-PfederationGameTestId=${testId}",
                    "-PfederationNativeEvidenceFile=${nativeEvidence.absolutePath}"], [timeout: 180, retainRuntime: false])
            if (child.result.exit != 0) {
                throw new GradleException("Positive GameTest failed; report=${childArtifacts.last().absolutePath}")
            }
            verifyNativeEvidence(nativeEvidence, [kind: 'verify', testId: testCase.testId,
                    structure: testCase.structure, assertions: testCase.assertions,
                    accounting: !(testCase.id in taskEighteenCases || testCase.id.startsWith('processing.')
                            || testCase.id.startsWith('mixed.')),
                    operations: testCase.id == 'energy.directional-policy' ? 2
                            : (testCase.id.startsWith('ports.') || testCase.id.startsWith('lane.')
                    || testCase.id.startsWith('endpoint.') || testCase.id.startsWith('storage-proof.')
                    || testCase.id.startsWith('craft-proof.') || testCase.id.startsWith('energy-proof.')
                    || testCase.id.startsWith('energy.')
                    || testCase.id.startsWith('bridge.') || testCase.id.startsWith('hub.')
                    || testCase.id.startsWith('fabric.') || testCase.id.startsWith('policy.')
                    || testCase.id.startsWith('provider.') || testCase.id.startsWith('claim.')
                    || testCase.id.startsWith('processing.') || testCase.id.startsWith('storage.')
                    || testCase.id.startsWith('provenance.') || testCase.id.startsWith('chain.')
                    || testCase.id.startsWith('subscription.') || testCase.id.startsWith('resources.')
                    || testCase.id.startsWith('crafting.') || testCase.id.startsWith('terminal.')
                    || testCase.id.startsWith('automation.') || testCase.id.startsWith('observe.')) ? 1 : 2,
                    allowZeroWork: testCase.id.startsWith('ports.') || testCase.id.startsWith('lane.')
                            || testCase.id.startsWith('endpoint.') || testCase.id.startsWith('storage-proof.')
                            || testCase.id.startsWith('craft-proof.') || testCase.id.startsWith('energy-proof.')
                            || testCase.id.startsWith('energy.')
                            || testCase.id.startsWith('bridge.') || testCase.id.startsWith('hub.')
                            || testCase.id.startsWith('fabric.') || testCase.id.startsWith('policy.')
                            || testCase.id.startsWith('provider.') || testCase.id.startsWith('claim.')
                            || testCase.id.startsWith('processing.') || testCase.id.startsWith('storage.')
                            || testCase.id.startsWith('provenance.') || testCase.id.startsWith('chain.')
                            || testCase.id.startsWith('subscription.') || testCase.id.startsWith('resources.')
                            || testCase.id.startsWith('crafting.') || testCase.id.startsWith('terminal.')
                            || testCase.id.startsWith('automation.') || testCase.id.startsWith('observe.')])
            childArtifacts.add(nativeEvidence)
        }
        def appfluxCases = requestedCases.collect { knownCases[it] }.findAll { it.backend == 'appflux-gametest' }
        appfluxCases.each { testCase ->
            def nativeEvidence = new File(attempt, "native-${testCase.testId}.properties")
            def child = gradleCommand("positive-${testCase.testId}",
                    [':neoforge-1.21.1:runAppfluxGameTestServer',
                     '-PenableAppfluxCompatibility=true',
                     "-PfederationNativeEvidenceFile=${nativeEvidence.absolutePath}"],
                    [timeout: 180, retainRuntime: false])
            if (child.result.exit != 0) {
                throw new GradleException("Applied Flux GameTest failed; report=${childArtifacts.last().absolutePath}")
            }
            verifyNativeEvidence(nativeEvidence, [kind: 'verify', testId: testCase.testId,
                    structure: testCase.structure, assertions: testCase.assertions, operations: 1,
                    allowZeroWork: true, allowUnequalWork: true])
            childArtifacts.add(nativeEvidence)
        }
        def restartCase = requestedCases.collect { knownCases[it] }.find { it.backend == 'gametest-restart' }
        if (restartCase != null) {
            def policyRestart = restartCase.id.startsWith('policy.')
            def restartState = new File(attempt, policyRestart ? 'policy-restart-state.properties' : 'identity-restart-state.properties')
            def phaseProperty = policyRestart ? 'federationPolicyPhase' : 'federationIdentityPhase'
            def stateProperty = policyRestart ? 'federationPolicyStateFile' : 'federationIdentityStateFile'
            def prepare = gradleCommand('restart-prepare', [':neoforge-1.21.1:runGameTestServer',
                    '-PfederationGameTestSelection=positive', "-PfederationGameTestId=${restartCase.testId}",
                    "-P${phaseProperty}=prepare", "-P${stateProperty}=${restartState.absolutePath}",
                    '-PfederationRetainGameTestRuntime=true'], [timeout: 180, retainRuntime: true])
            if (prepare.result.exit != 0 || !restartState.isFile()) {
                throw new GradleException('Identity restart preparation process failed')
            }
            def nativeEvidence = new File(attempt, "native-${restartCase.testId}.properties")
            def verify = gradleCommand('restart-verify', [':neoforge-1.21.1:runGameTestServer',
                    '-PfederationGameTestSelection=positive', "-PfederationGameTestId=${restartCase.testId}",
                    "-P${phaseProperty}=verify", "-P${stateProperty}=${restartState.absolutePath}",
                    "-PfederationNativeEvidenceFile=${nativeEvidence.absolutePath}"], [timeout: 180, retainRuntime: false])
            if (verify.result.exit != 0) throw new GradleException('Identity restart verification process failed')
            verifyNativeEvidence(nativeEvidence, [kind: 'verify', testId: restartCase.testId,
                    structure: restartCase.structure, assertions: restartCase.assertions,
                    operations: policyRestart ? 1 : 2, allowZeroWork: policyRestart])
            childArtifacts.add(restartState); childArtifacts.add(nativeEvidence)
        }
        requestedCases.each { caseId ->
            def testCase = knownCases[caseId] as Map
            switch (caseId) {
                case 'harness.native-smoke':
                case 'harness.gametest-registered':
                    def nativeEvidence = new File(attempt, "native-${testCase.testId}.properties")
                    def nativeResult = verifyNativeEvidence(nativeEvidence, [kind: 'verify', testId: testCase.testId,
                            structure: testCase.structure, assertions: testCase.assertions, operations: 2])
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
                            nativeTestId: testCase.testId, structure: testCase.structure,
                            assertionCount: nativeResult.assertions, operationCount: nativeResult.operations]); break
                case 'harness.reject-stale':
                    def probes = [
                            reportVerifierRejects(attempt, 'stale-source') { report, artifact -> report.sourceRevision = 'stale-source-identity' },
                            reportVerifierRejects(attempt, 'stale-dirty') { report, artifact -> report.dirtyDiffSha256 = 'stale-dirty-identity' },
                            reportVerifierRejects(attempt, 'stale-dependency') { report, artifact -> report.dependencyLockSha256 = 'stale-dependency-identity' },
                            reportVerifierRejects(attempt, 'incomplete') { report, artifact -> report.status = 'running' },
                            reportVerifierRejects(attempt, 'missing') { report, artifact -> artifact.delete() },
                            reportVerifierRejects(attempt, 'hash') { report, artifact -> artifact.text = 'tampered\n' }
                    ]
                    if (probes.any { !it }) throw new GradleException('Persisted stale/incomplete/artifact evidence was accepted')
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
