            def receiptLines = logText.readLines().findAll {
                it.contains('AE2F_OBSERVATION_RECEIPT testId=observerejectcrossfabricedit')
            }
            def parseCrossReceipt = { String line ->
                def match = line =~ / type=(\S+) player=(\S*) menu=(\S*) scope=(.*?) event=(\S+) value=(\d+) secondary=(\d+) resource=(\S*) attribution=(\S*) exactBatch=(true|false)$/
                if (!match.find()) throw new GradleException('Task 32 malformed cross-Fabric runtime receipt')
                [type: match.group(1), player: match.group(2), menu: match.group(3), scope: match.group(4),
                        event: match.group(5), value: match.group(6), secondary: match.group(7),
                        resource: match.group(8), attribution: match.group(9), exactBatch: match.group(10)]
            }
