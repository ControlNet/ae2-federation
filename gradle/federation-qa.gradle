                    def parts = metrics['iteration.0.handler.0'].split('\\|', -1)
                    parts[1] = '4294967295'
                    metrics['iteration.0.handler.0'] = parts.join('|')
                },
                'fake-stocking-attribution': mutateMetrics('fake-stocking-attribution', 'independent runtime authority mismatch') { metrics ->
                    def parts = metrics['iteration.0.stocking.1'].split('\\|', -1)
                    parts[0] = '4294967295'
                    metrics['iteration.0.stocking.1'] = parts.join('|')
                },
                'call-quantity-conflation': mutateMetrics('call-quantity-conflation', 'native iteration authority mismatch') { metrics ->
                    metrics['iteration.0.batch.large.calls'] = metrics['iteration.0.batch.large.quantity']
                },
                'changed-iteration-count': mutateMetrics('changed-iteration-count', 'exact benchmark schema or identity mismatch') { metrics ->
                    metrics['measuredCount'] = '2'
                },
                'extra-metric': mutateMetrics('extra-metric', 'exact benchmark schema or identity mismatch') { metrics ->
                    metrics['unexpected.metric'] = '1'
                },
                'copied-iteration-facts': mutateMetrics('copied-iteration-facts', 'independent runtime authority mismatch') { metrics ->
                    metrics['iteration.1.runtimeIdentity'] = metrics['iteration.0.runtimeIdentity']
                },
                'coordinated-accounting': mutateMetrics('coordinated-accounting', 'independent runtime authority mismatch') { metrics ->
                    metrics['iteration.0.resource.cobblestone.initial'] =
                            ((metrics['iteration.0.resource.cobblestone.initial'] as long) + 1).toString()
                    metrics['iteration.0.resource.cobblestone.finalSource'] =
                            ((metrics['iteration.0.resource.cobblestone.finalSource'] as long) + 1).toString()
                },
                'coordinated-projections': mutateMetrics('coordinated-projections', 'independent runtime authority mismatch') { metrics ->
                    metrics['iteration.0.resource.cobblestone.initial'] =
                            ((metrics['iteration.0.resource.cobblestone.initial'] as long) + 1).toString()
                    metrics['iteration.0.resource.cobblestone.finalSource'] =
                            ((metrics['iteration.0.resource.cobblestone.finalSource'] as long) + 1).toString()
                },
                'coordinated-handler-owner': mutateMetrics('coordinated-handler-owner', 'independent runtime authority mismatch') { metrics ->
                    def replacement = metrics['iteration.0.handler.2'].split('\\|', -1)[3]
                    def parts = metrics['iteration.0.handler.0'].split('\\|', -1)
                    parts[3] = replacement
                    metrics['iteration.0.handler.0'] = parts.join('|')
                },
                'coordinated-stocking-owner': mutateMetrics('coordinated-stocking-owner', 'independent runtime authority mismatch') { metrics ->
                    (0..<3).each { index ->
                        def parts = metrics["iteration.0.stocking.${index}"].split('\\|', -1)
                        parts[0] = '4294967295'
                        metrics["iteration.0.stocking.${index}"] = parts.join('|')
                    }
                },
                'unbound-handler-quantity': mutateMetrics('unbound-handler-quantity',
                        'independent runtime authority mismatch: iteration.0.handlerQuantity') { metrics ->
                    metrics['iteration.0.handlerQuantity'] = '999'
                },
                'unbound-peak-in-flight': mutateMetrics('unbound-peak-in-flight',
                        'independent runtime authority mismatch: iteration.0.peakInFlight') { metrics ->
                    metrics['iteration.0.peakInFlight'] = '1'
                },
                'duplicate-raw-receipt': mutateRaw('duplicate-raw-receipt', 'raw receipt sequence mismatch') { lines ->
                    lines.add(lines.last())
                },
                'replace-raw-receipt': mutateRaw('replace-raw-receipt', 'raw receipt identity mismatch') { lines ->
                    def fields = lines.first().split('\\|', -1)
                    fields[4] = Base64.urlEncoder.withoutPadding()
                            .encodeToString('forged-profile'.getBytes(StandardCharsets.UTF_8))
                    lines[0] = fields.join('|')
                },
                'missing-raw-receipt': mutateRaw('missing-raw-receipt', 'raw inventory mismatch') { lines ->
                    lines.remove(lines.findIndexOf { it.contains('|INVENTORY|') })
                    renumberRaw(lines)
                },
                'extra-raw-receipt': mutateRaw('extra-raw-receipt', 'independent runtime authority mismatch') { lines ->
                    def callback = lines.find { it.contains('|CALLBACK|') }
                    lines.add(lines.findIndexOf { it.contains('|SCENE_END|') }, callback)
                    renumberRaw(lines)
                },
                'conflicting-raw-receipt': mutateRaw('conflicting-raw-receipt', 'independent runtime authority mismatch') { lines ->
                    def index = lines.findIndexOf { it.contains('|INVENTORY|') }
                    def fields = lines[index].split('\\|', -1)
                    fields[fields.length - 1] = Base64.urlEncoder.withoutPadding()
                            .encodeToString('999'.getBytes(StandardCharsets.UTF_8))
                    lines[index] = fields.join('|')
                },
                'out-of-order-raw-receipt': mutateRaw('out-of-order-raw-receipt', 'operation order mismatch') { lines ->
                    def accepted = lines.findIndexOf { it.contains('|MACHINE_ACCEPTED|') }
                    def transition = lines.findIndexOf { it.contains('|MACHINE_TRANSITION|') }
                    def line = lines[accepted]
                    lines[accepted] = lines[transition]
                    lines[transition] = line
                    renumberRaw(lines)
                },
                'wrong-phase-raw-receipt': mutateRaw('wrong-phase-raw-receipt', 'iteration or phase mismatch') { lines ->
                    def index = lines.findIndexOf { it.contains('|1|measured|SCENE_BEGIN') }
                    lines[index] = lines[index].replace('|1|measured|', '|1|warmup|')
                },
                'wrong-iteration-raw-receipt': mutateRaw('wrong-iteration-raw-receipt', 'scene envelope mismatch') { lines ->
                    def index = lines.findIndexOf { it.contains('|1|measured|SCENE_BEGIN') }
                    lines[index] = lines[index].replace('|1|measured|', '|2|measured|')
                },
                'changed-seed': taskSevenEvidenceProbeRejects(source, 'task30-changed-seed',
                        'mixed benchmark profile or budget mismatch') { File attempt, Map report ->
                    def file = new File(attempt, 'benchmark-profile.json')
                    def profile = new JsonSlurper().parse(file) as Map
                    profile.seed = 30028030
                    file.text = JsonOutput.prettyPrint(JsonOutput.toJson(profile)) + '\n'
                }
        ]
        def failedProbes = probes.findAll { name, rejected -> !rejected }.keySet()
        if (!failedProbes.isEmpty()) throw new GradleException("Task 30 benchmark probes failed: ${failedProbes}")
        logger.lifecycle('Task 30 fully rebound benchmark evidence probes were rejected for intended reasons')
    }
}

tasks.register('federationTaskThirtyNegativeEvidenceConsumer') {
    group = 'verification'
    description = 'Consumes the canonical Task 30 empty-order and overload result.'
    dependsOn(tasks.named('jar'))
    doLast {
        def resultPath = resultFileProperty.orNull
        if (resultPath == null || resultPath.isBlank()) throw new GradleException('Missing -PresultFile')
        def report = verifyPersistedReport(strictCanonicalPath(rootProject.file(resultPath)), true)
        if (report.requested != taskThirtyCases) {
            throw new GradleException('Result is not the canonical Task 30 negative case set')
        }
        logger.lifecycle('Task 30 negative evidence verified')
    }
}

tasks.register('federationTaskThirtyNegativeEvidenceSelfTest') {
    group = 'verification'
    description = 'Rejects fabricated Task 30 hidden-queue and overload evidence.'
    dependsOn(tasks.named('jar'))
    doLast {
        def resultPath = resultFileProperty.orNull
        if (resultPath == null || resultPath.isBlank()) throw new GradleException('Missing -PresultFile')
        def source = strictCanonicalPath(rootProject.file(resultPath))
        def mutate = { String name, String artifact, String expected, Closure mutation ->
            taskSevenEvidenceProbeRejects(source, "task30-${name}", expected) { File attempt, Map report ->
                def file = new File(attempt, "native-${artifact}.properties")
                def properties = loadProperties(file)
                mutation(properties)
                file.withOutputStream { properties.store(it, "Task 30 ${name} fully rebound probe") }
            }
        }
        def probes = [
                mutate('empty-native-work', 'mixedrejectemptyorders', 'bounded backpressure evidence mismatch') {
                    it['trackerCallDelta'] = '1'
                },
                mutate('empty-physical-work', 'mixedrejectemptyorders', 'bounded backpressure evidence mismatch') {
                    it['sourceInventoryDelta'] = '1'
                },
                mutate('silent-drop', 'mixedoverloadbackpressure', 'bounded backpressure evidence mismatch') {
                    it['logicalCompletions'] = '1'
                },
                mutate('no-recovery', 'mixedoverloadbackpressure', 'bounded backpressure evidence mismatch') {
                    it['retries'] = '0'
                },
                mutate('hidden-queue', 'mixedoverloadbackpressure', 'bounded backpressure evidence mismatch') {
                    it['queueGrowth'] = '1'
                },
                mutate('extra-negative-metric', 'mixedoverloadbackpressure', 'exact negative schema mismatch') {
                    it['unexpected.metric'] = '1'
                },
                mutate('duplicate-job', 'mixedoverloadbackpressure', 'overload recovery or physical equation mismatch') {
                    def jobs = it['jobIds'].split(',', -1)
                    it['jobIds'] = jobs[0] + ',' + jobs[0]
                }
        ]
        if (probes.any { !it }) throw new GradleException('A Task 30 fully rebound negative probe was accepted')
        logger.lifecycle('Task 30 fully rebound negative evidence probes were rejected for intended reasons')
    }
}
