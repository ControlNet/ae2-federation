def loadTaskTwentyMetrics = { File file ->
    if (!file.isFile()) throw new GradleException("Task 20 benchmark metrics are missing: ${file}")
    def metrics = new LinkedHashMap<String, String>()
    file.readLines(StandardCharsets.UTF_8.name()).eachWithIndex { line, index ->
        if (!line.isBlank() && !line.startsWith('#')) {
            def separator = line.indexOf('=')
            if (separator < 1 || separator == line.length() - 1) {
                throw new GradleException("Task 20 malformed metric at line ${index + 1}")
            }
            def name = line.substring(0, separator)
            if (metrics.put(name, line.substring(separator + 1)) != null) {
                throw new GradleException("Task 20 duplicate metric: ${name}")
            }
        }
    }
    metrics
}
def taskTwentyProjection = { Map metrics, Map budgets, Map lifecycle ->
    def names = metrics.keySet().findAll { it.startsWith('native.') || it.startsWith('federation.') }.sort()
    [profile: [profileVersion: metrics.profileVersion, seed: parsePositiveInteger(metrics.seed, 'Task 20 seed'),
            profileSha256: metrics.profileSha256, comparison: metrics.comparison, lifecycle: lifecycle],
     metrics: names.collectEntries { [(it): metrics[it]] },
     samples: [classification: metrics['timing.classification'], nativeNanos: metrics['timing.nativeSamplesNanos'],
             federationNanos: metrics['timing.federationSamplesNanos']],
     reconciliation: [inputEquation: metrics['reconciliation.inputEquation'],
             outputEquation: metrics['reconciliation.outputEquation'], currentRun: metrics['reconciliation.currentRun'],
             crossRunCarryover: metrics['reconciliation.crossRunCarryover']], budgets: budgets]
