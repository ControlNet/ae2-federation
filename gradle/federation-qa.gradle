tasks.register('federationTaskTwentyExecutionTimeoutContract') {
    group = 'verification'
    description = 'Distinguishes workload execution timeout from shutdown timeout.'
    doLast {
        def result = runProcessLifecycle(['/bin/sh', '-c', 'sleep 30'], rootProject.projectDir,
                new File(temporaryDir, 'execution-timeout.log'), 1, 2)
        if (!result.executionTimedOut || result.shutdownTimedOut || result.succeeded) {
            throw new GradleException('Execution timeout was not reported independently')
        }
        logger.lifecycle('Task 20 execution-timeout contract passed')
    }
}

tasks.register('federationTaskTwentyShutdownTimeoutContract') {
    group = 'verification'
    description = 'Rejects a zero-exit parent whose owned descendant survives shutdown grace.'
    doLast {
        def result = runProcessLifecycle(['/bin/sh', '-c', 'sleep 30 & exit 0'], rootProject.projectDir,
                new File(temporaryDir, 'shutdown-timeout.log'), 5, 1)
        if (result.mainExit != 0 || result.executionTimedOut || !result.shutdownTimedOut || result.succeeded) {
            throw new GradleException('Live descendant after zero-exit parent did not fail closed')
        }
        logger.lifecycle('Task 20 shutdown-timeout contract passed')
    }
}

tasks.register('federationTaskTwentyUnsupportedIsolationContract') {
    group = 'verification'
    description = 'Refuses launch before an immediate zero-exit parent can orphan a live child.'
    doLast {
        def marker = new File(temporaryDir, 'launched.txt')
        def rejected = false
        try {
            runProcessLifecycle(['/bin/sh', '-c', "sleep 30 & printf launched > '${marker.absolutePath}'; exit 0"],
                    rootProject.projectDir, new File(temporaryDir, 'unsupported-isolation.log'), 5, 1,
                    new File(temporaryDir, 'missing-setsid'))
        } catch (GradleException exception) {
            rejected = exception.message.contains('Process isolation is unavailable')
        }
        if (!rejected || marker.exists()) {
            throw new GradleException('Unavailable process isolation did not refuse launch before child creation')
        }
        logger.lifecycle('Task 20 unavailable process-isolation contract passed')
    }
}

tasks.register('federationTaskTwentyCleanShutdownContract') {
    group = 'verification'
    description = 'Accepts a normal zero-exit process with no surviving descendants.'
    doLast {
        def result = runProcessLifecycle(['/bin/sh', '-c', 'exit 0'], rootProject.projectDir,
                new File(temporaryDir, 'clean-shutdown.log'), 5, 1)
        if (!result.succeeded || result.mainExit != 0 || result.executionTimedOut || result.shutdownTimedOut
                || !result.survivingDescendants.isEmpty()) {
            throw new GradleException('Clean zero-exit shutdown did not pass')
        }
        logger.lifecycle('Task 20 clean-shutdown contract passed')
    }
}

