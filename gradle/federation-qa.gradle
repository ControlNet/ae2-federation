def writeEmptyStructure = { File output ->
    output.parentFile.mkdirs()
    new GZIPOutputStream(new FileOutputStream(output)).withCloseable { gzip ->
        new DataOutputStream(gzip).withCloseable { data ->
            data.writeByte(10)
            data.writeUTF('')
            data.writeByte(9); data.writeUTF('size'); data.writeByte(3); data.writeInt(3)
            data.writeInt(3); data.writeInt(3); data.writeInt(3)
            data.writeByte(9); data.writeUTF('palette'); data.writeByte(10); data.writeInt(1)
            data.writeByte(8); data.writeUTF('Name'); data.writeUTF('minecraft:air'); data.writeByte(0)
            data.writeByte(9); data.writeUTF('blocks'); data.writeByte(10); data.writeInt(0)
            data.writeByte(9); data.writeUTF('entities'); data.writeByte(10); data.writeInt(0)
            data.writeByte(3); data.writeUTF('DataVersion'); data.writeInt(3955)
            data.writeByte(0)
        }
    }
}

def prepareGameTestStructure = tasks.register('prepareGameTestStructure') {
    outputs.file(structureFile)
    doLast { writeEmptyStructure(structureFile.asFile) }
}

tasks.named('processTestmodResources').configure { dependsOn(prepareGameTestStructure) }

def cleanupRuntime = { File diagnostics ->
    def runtime = layout.projectDirectory.dir('run-gametest').asFile
    diagnostics.mkdirs()
    try {
        if (runtime.exists()) {
            project.copy {
                from(runtime)
                include('logs/**', 'crash-reports/**')
                into(new File(diagnostics, 'runtime-diagnostics'))
            }
        }
    } finally {
        project.delete(runtime)
        new File(diagnostics, 'runtime-cleanup.txt').text = 'Copied available logs/crash reports; removed task-owned run-gametest world/config/log/session.lock.\n'
    }
}

def cleanupGameTest = tasks.register('federationCleanupGameTest') {
    notCompatibleWithConfigurationCache('Preserves GameTest diagnostics and removes only task-owned runtime data.')
    doLast {
        if (providers.gradleProperty('federationRetainGameTestRuntime').getOrElse('false').toBoolean()) {
            return
        }
        def configured = providers.gradleProperty('federationRuntimeDiagnosticsDir').orNull
        def diagnostics = configured == null
                ? rootProject.file(".omo/evidence/task-02/direct-cleanup/${UUID.randomUUID()}")
                : rootProject.file(configured)
        cleanupRuntime(diagnostics)
    }
}
tasks.named('runGameTestServer').configure { finalizedBy(cleanupGameTest) }

def executeHarness = { String kind, List<String> requestedCases, String profile, File evidenceRoot ->
    evidenceRoot = strictCanonicalPath(evidenceRoot)
    def manifest = new JsonSlurper().parse(manifestFile.asFile)
    def knownCases = manifest.cases.collectEntries { [(it.id): it] }
    def knownProfiles = manifest.profiles.collectEntries { [(it.id): it] }
    if (kind == 'verify') {
        if (requestedCases.isEmpty()) throw new GradleException('No cases requested')
        def unknown = requestedCases.findAll { !knownCases.containsKey(it) }
        if (!unknown.isEmpty()) throw new GradleException("Unknown cases: ${unknown}")
    } else if (!knownProfiles.containsKey(profile)) {
        throw new GradleException("Unknown benchmark profile: ${profile}")
    }
    def processingLifecycle = benchmarkLifecycleForEntry(knownProfiles['processing-small'] as Map)

    def runId = DateTimeFormatter.ofPattern("yyyyMMdd'T'HHmmssSSS'Z'").withZone(ZoneOffset.UTC).format(Instant.now())
    def attempt = new File(evidenceRoot, "attempt-${runId}")
    if (!attempt.mkdirs()) throw new GradleException("Cannot create evidence attempt ${attempt}")
    def sourceIdentity = currentSourceIdentity(attempt)
    def jar = productJar.get().asFile
    def startedAt = Instant.now().toString()
    def executed = []
    def assertions = []
    def childExits = [:]
    def childLifecycles = [:]
    def childArtifacts = sourceIdentity.files as List<File>

    def gradleCommand = { String label, List<String> args, Map options ->
        def log = new File(attempt, "${label}.log")
        def command = [new File(gradle.gradleHomeDir, 'bin/gradle').absolutePath, '--no-daemon',
                '--dependency-verification=strict', "-PfederationRuntimeDiagnosticsDir=${new File(attempt, label + '-cleanup').absolutePath}"] + args
        def result
        try {
            result = runProcessLifecycle(command, repositoryDir.asFile, log, options.timeout as long,
                    (options.shutdownGrace ?: 10) as long)
        } finally {
            if (!options.retainRuntime) cleanupRuntime(new File(attempt, label + '-parent-cleanup'))
        }
        childExits[label] = result.exit
        childLifecycles[label] = [executionTimedOut: result.executionTimedOut,
                shutdownTimedOut: result.shutdownTimedOut, mainExit: result.mainExit,
                survivingDescendants: result.survivingDescendants,
                executionTimeoutSeconds: result.executionTimeoutSeconds,
                shutdownGraceSeconds: result.shutdownGraceSeconds]
        childArtifacts.add(log)
        [result: result, output: log.getText(StandardCharsets.UTF_8.name())]
    }

    if (kind == 'benchmark') {
        def benchmarkProfile = knownProfiles[profile] as Map
        def profileLifecycle = benchmarkLifecycleForEntry(benchmarkProfile)
        def nativeEvidence = new File(attempt, 'benchmark-native.properties')
        def benchmarkArgs = [':neoforge-1.21.1:runGameTestServer',
                '-PfederationGameTestSelection=benchmark', "-PfederationGameTestId=${benchmarkProfile.testId}",
                "-PfederationNativeEvidenceFile=${nativeEvidence.absolutePath}"]
        File benchmarkBudget = null
        if (profile == 'processing-small') {
            def copies = [config: 'benchmark-profile.json', baseline: 'benchmark-baseline.json',
                    budgets: 'benchmark-budgets.json'].collectEntries { field, name ->
                def source = strictCanonicalPath(rootProject.file(benchmarkProfile[field] as String))
                def target = new File(attempt, name)
                target.bytes = source.bytes
                childArtifacts.add(target)
                [(field): target]
            }
            benchmarkBudget = copies.budgets
            benchmarkArgs.add("-PfederationProcessingBenchmarkProfile=${copies.config.absolutePath}")
            def replaySeed = providers.gradleProperty('processingBenchmarkSeed').orNull
            if (replaySeed != null && !replaySeed.isBlank()) {
                benchmarkArgs.add("-PfederationProcessingBenchmarkSeed=${replaySeed}")
            }
        }
        def child = gradleCommand('benchmark-gametest', benchmarkArgs,
                [timeout: profileLifecycle.executionTimeoutSeconds,
                 shutdownGrace: profileLifecycle.shutdownGraceSeconds, retainRuntime: false])
        if (child.result.exit != 0) {
            throw new GradleException("Benchmark GameTest failed; report=${childArtifacts.last().absolutePath}")
        }
        def nativeResult = verifyNativeEvidence(nativeEvidence, [kind: 'benchmark', testId: benchmarkProfile.testId,
                structure: benchmarkProfile.structure, assertions: benchmarkProfile.assertions,
                operations: benchmarkProfile.operations])
        childArtifacts.add(nativeEvidence)
        executed.add(profile)
        def assertion = [caseId: profile, status: 'passed', nativeTestId: benchmarkProfile.testId,
                structure: benchmarkProfile.structure,
                assertionCount: nativeResult.assertions, operationCount: nativeResult.operations,
                inserted: nativeResult.inserted, extracted: nativeResult.extracted,
                elapsedNanos: nativeResult.elapsedNanos, lifecycle: profileLifecycle]
        if (profile == 'processing-small') {
            assertion.putAll(taskTwentyProjection(loadTaskTwentyMetrics(nativeEvidence),
                    new JsonSlurper().parse(benchmarkBudget) as Map, profileLifecycle))
        }
        assertions.add(assertion)
    } else {
        def gameTestCases = requestedCases.collect { knownCases[it] }.findAll { it.backend == 'gametest' }
        gameTestCases.collectEntries { [(it.testId): it] }.each { testId, testCase ->
            def nativeEvidence = new File(attempt, "native-${testId}.properties")
            def child = gradleCommand("positive-${testId}", [':neoforge-1.21.1:runGameTestServer',
                    '-PfederationGameTestSelection=positive', "-PfederationGameTestId=${testId}",
                    "-PfederationNativeEvidenceFile=${nativeEvidence.absolutePath}"], [timeout: 180, retainRuntime: false])
            if (child.result.exit != 0) {
                throw new GradleException("Positive GameTest failed; report=${childArtifacts.last().absolutePath}")
            }
            verifyNativeEvidence(nativeEvidence, [kind: 'verify', testId: testCase.testId,
                    structure: testCase.structure, assertions: testCase.assertions,
                    accounting: !(testCase.id in taskEighteenCases || testCase.id.startsWith('processing.')),
                    operations: (testCase.id.startsWith('ports.') || testCase.id.startsWith('lane.')
                    || testCase.id.startsWith('endpoint.') || testCase.id.startsWith('storage-proof.')
                    || testCase.id.startsWith('craft-proof.') || testCase.id.startsWith('energy-proof.')
                    || testCase.id.startsWith('bridge.') || testCase.id.startsWith('hub.')
                    || testCase.id.startsWith('fabric.') || testCase.id.startsWith('policy.')
                    || testCase.id.startsWith('provider.') || testCase.id.startsWith('claim.')
                    || testCase.id.startsWith('processing.')) ? 1 : 2,
                    allowZeroWork: testCase.id.startsWith('ports.') || testCase.id.startsWith('lane.')
                            || testCase.id.startsWith('endpoint.') || testCase.id.startsWith('storage-proof.')
                            || testCase.id.startsWith('craft-proof.') || testCase.id.startsWith('energy-proof.')
                            || testCase.id.startsWith('bridge.') || testCase.id.startsWith('hub.')
                            || testCase.id.startsWith('fabric.') || testCase.id.startsWith('policy.')
                            || testCase.id.startsWith('provider.') || testCase.id.startsWith('claim.')
                            || testCase.id.startsWith('processing.')])
            childArtifacts.add(nativeEvidence)
        }
        def restartCase = requestedCases.collect { knownCases[it] }.find { it.backend == 'gametest-restart' }
        if (restartCase != null) {
            def policyRestart = restartCase.id.startsWith('policy.')
            def restartState = new File(attempt, policyRestart ? 'policy-restart-state.properties' : 'identity-restart-state.properties')
            def phaseProperty = policyRestart ? 'federationPolicyPhase' : 'federationIdentityPhase'
            def stateProperty = policyRestart ? 'federationPolicyStateFile' : 'federationIdentityStateFile'
            def prepare = gradleCommand('restart-prepare', [':neoforge-1.21.1:runGameTestServer',
                    '-PfederationGameTestSelection=positive', "-PfederationGameTestId=${restartCase.testId}",
                    "-P${phaseProperty}=prepare", "-P${stateProperty}=${restartState.absolutePath}",
                    '-PfederationRetainGameTestRuntime=true'], [timeout: 180, retainRuntime: true])
            if (prepare.result.exit != 0 || !restartState.isFile()) {
                throw new GradleException('Identity restart preparation process failed')
            }
            def nativeEvidence = new File(attempt, "native-${restartCase.testId}.properties")
            def verify = gradleCommand('restart-verify', [':neoforge-1.21.1:runGameTestServer',
                    '-PfederationGameTestSelection=positive', "-PfederationGameTestId=${restartCase.testId}",
                    "-P${phaseProperty}=verify", "-P${stateProperty}=${restartState.absolutePath}",
                    "-PfederationNativeEvidenceFile=${nativeEvidence.absolutePath}"], [timeout: 180, retainRuntime: false])
            if (verify.result.exit != 0) throw new GradleException('Identity restart verification process failed')
            verifyNativeEvidence(nativeEvidence, [kind: 'verify', testId: restartCase.testId,
                    structure: restartCase.structure, assertions: restartCase.assertions,
                    operations: policyRestart ? 1 : 2, allowZeroWork: policyRestart])
            childArtifacts.add(restartState); childArtifacts.add(nativeEvidence)
        }
        requestedCases.each { caseId ->
            def testCase = knownCases[caseId] as Map
            switch (caseId) {
                case 'harness.native-smoke':
                case 'harness.gametest-registered':
                    def nativeEvidence = new File(attempt, "native-${testCase.testId}.properties")
                    def nativeResult = verifyNativeEvidence(nativeEvidence, [kind: 'verify', testId: testCase.testId,
                            structure: testCase.structure, assertions: testCase.assertions, operations: 2])
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
                            nativeTestId: testCase.testId, structure: testCase.structure,
                            assertionCount: nativeResult.assertions, operationCount: nativeResult.operations]); break
                case 'harness.reject-stale':
                    def probes = [
                            reportVerifierRejects(attempt, 'stale-source') { report, artifact -> report.sourceRevision = 'stale-source-identity' },
                            reportVerifierRejects(attempt, 'stale-dirty') { report, artifact -> report.dirtyDiffSha256 = 'stale-dirty-identity' },
                            reportVerifierRejects(attempt, 'stale-dependency') { report, artifact -> report.dependencyLockSha256 = 'stale-dependency-identity' },
                            reportVerifierRejects(attempt, 'incomplete') { report, artifact -> report.status = 'running' },
                            reportVerifierRejects(attempt, 'missing') { report, artifact -> artifact.delete() },
                            reportVerifierRejects(attempt, 'hash') { report, artifact -> artifact.text = 'tampered\n' }
                    ]
                    if (probes.any { !it }) throw new GradleException('Persisted stale/incomplete/artifact evidence was accepted')
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
                            detail: 'persisted source, dirty, dependency, incomplete, missing, and hash-mismatched reports rejected']); break
                case 'harness.reject-empty':
                    def rejected = reportVerifierRejects(attempt, 'empty') { report, artifact -> report.assertions = [] }
                    if (!rejected) throw new GradleException('Empty assertions were accepted')
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed', detail: 'persisted zero assertions rejected']); break
                case 'harness.detect-child-crash':
                    def crashLog = new File(attempt, 'child-crash.log')
                    def crash = runProcess(['/bin/sh', '-c', 'exit 17'], repositoryDir.asFile, crashLog, 10)
                    childExits['child-crash'] = crash.exit
                    childLifecycles['child-crash'] = [executionTimedOut: crash.executionTimedOut,
                            shutdownTimedOut: crash.shutdownTimedOut, mainExit: crash.mainExit,
                            survivingDescendants: crash.survivingDescendants,
                            executionTimeoutSeconds: crash.executionTimeoutSeconds,
                            shutdownGraceSeconds: crash.shutdownGraceSeconds]
                    childArtifacts.add(crashLog)
                    if (crash.exit != 17) throw new GradleException("Child crash not retained: ${crash.exit}")
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed', detail: 'inner exit 17 rejected']); break
                case 'harness.benchmark-reject-unknown':
                    def child = gradleCommand('unknown-profile', [':neoforge-1.21.1:federationBenchmark', '-Pprofile=unknown',
                            "-PevidenceDir=${new File(attempt, 'inner-unknown').absolutePath}"], [timeout: 60, retainRuntime: false])
                    if (child.result.exit == 0 || !child.output.contains('Unknown benchmark profile')) throw new GradleException('Unknown profile did not fail closed')
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed', detail: "inner exit ${child.result.exit} rejected"]); break
                case 'harness.benchmark-reject-empty':
                    def child = gradleCommand('empty-benchmark', [':neoforge-1.21.1:runGameTestServer',
                            '-PfederationGameTestSelection=benchmark',
                            "-PfederationGameTestId=${knownProfiles['harness-native-smoke'].testId}",
                            '-PfederationBenchmarkEmpty=true'], [timeout: 180, retainRuntime: false])
                    if (child.result.exit == 0 || !child.output.contains('Benchmark profile must request nonzero AE2 work')) throw new GradleException('Empty benchmark did not fail closed')
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed', detail: "inner exit ${child.result.exit} rejected"]); break
                case 'benchmark.reject-empty-work':
                    def processingProfile = strictCanonicalPath(rootProject.file(knownProfiles['processing-small'].config as String))
                    def child = gradleCommand('task20-empty-work', [':neoforge-1.21.1:runGameTestServer',
                            '-PfederationGameTestSelection=benchmark',
                            "-PfederationGameTestId=${knownProfiles['processing-small'].testId}",
                            "-PfederationProcessingBenchmarkProfile=${processingProfile.absolutePath}",
                            '-PfederationBenchmarkEmpty=true'],
                            [timeout: processingLifecycle.executionTimeoutSeconds,
                             shutdownGrace: processingLifecycle.shutdownGraceSeconds, retainRuntime: false])
                    if (child.result.exit == 0 || !child.output.contains('Benchmark profile must request nonzero Processing work')) {
                        throw new GradleException('Task 20 empty Processing work did not fail closed')
                    }
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
                            detail: "inner exit ${child.result.exit} rejected"]); break
                case 'benchmark.resource-accounting':
                    def innerRoot = new File(attempt, 'task20-accounting-benchmark')
                    def benchmark = gradleCommand('task20-accounting', [':neoforge-1.21.1:federationBenchmark',
                            '-Pprofile=processing-small', "-PevidenceDir=${innerRoot.absolutePath}"],
                            [timeout: processingLifecycle.executionTimeoutSeconds,
                             shutdownGrace: processingLifecycle.shutdownGraceSeconds, retainRuntime: false])
                    def results = project.fileTree(innerRoot).matching { include('attempt-*/result.json') }.files
                    if (benchmark.result.exit != 0 || results.size() != 1) {
                        throw new GradleException('Task 20 resource-accounting benchmark did not produce one complete result')
                    }
                    def adversarial = gradleCommand('task20-adversarial',
                            [':neoforge-1.21.1:federationTaskTwentyEvidenceSelfTest',
                             "-PresultFile=${results.first().absolutePath}"],
                            [timeout: processingLifecycle.executionTimeoutSeconds,
                             shutdownGrace: processingLifecycle.shutdownGraceSeconds, retainRuntime: false])
                    if (adversarial.result.exit != 0) {
                        throw new GradleException('Task 20 resource-accounting adversarial consumer failed')
                    }
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
                            detail: 'current-run reconciliation and fully rebound adversarial probes passed']); break
                case 'benchmark.evidence-identity':
                    def selected = selectCurrentAttempt(attempt.parentFile, runId)
                    def oldEnvelope = [runId: runId, evidenceRoot: attempt.parentFile.canonicalPath,
                            attemptPath: attempt.canonicalPath,
                            startedAt: Instant.now().minusSeconds(7201).toString(),
                            endedAt: Instant.now().minusSeconds(7200).toString()]
                    validateEvidenceEnvelope(oldEnvelope, selected)
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
                            detail: 'explicit evidence remains valid while repository identity matches']); break
                case 'benchmark.execution-timeout':
                    def timeoutLog = new File(attempt, 'task20-execution-timeout.log')
                    def timeoutResult = runProcessLifecycle(['/bin/sh', '-c', 'sleep 30'], repositoryDir.asFile,
                            timeoutLog, 1, 1)
                    childArtifacts.add(timeoutLog)
                    childExits['task20-execution-timeout'] = timeoutResult.exit
                    childLifecycles['task20-execution-timeout'] = [executionTimedOut: timeoutResult.executionTimedOut,
                            shutdownTimedOut: timeoutResult.shutdownTimedOut, mainExit: timeoutResult.mainExit,
                            survivingDescendants: timeoutResult.survivingDescendants,
                            executionTimeoutSeconds: timeoutResult.executionTimeoutSeconds,
                            shutdownGraceSeconds: timeoutResult.shutdownGraceSeconds]
                    if (!timeoutResult.executionTimedOut || timeoutResult.shutdownTimedOut
                            || !timeoutResult.survivingDescendants.isEmpty()) {
                        throw new GradleException('Task 20 execution timeout phase was not fail-closed')
                    }
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
                            detail: 'workload execution deadline terminated its owned process tree']); break
                case 'benchmark.shutdown-timeout':
                    def shutdownLog = new File(attempt, 'task20-shutdown-timeout.log')
                    def shutdownResult = runProcessLifecycle(['/bin/sh', '-c', 'sleep 30 & exit 0'],
                            repositoryDir.asFile, shutdownLog, 5, 1)
                    childArtifacts.add(shutdownLog)
                    childExits['task20-shutdown-timeout'] = shutdownResult.exit
                    childLifecycles['task20-shutdown-timeout'] = [executionTimedOut: shutdownResult.executionTimedOut,
                            shutdownTimedOut: shutdownResult.shutdownTimedOut, mainExit: shutdownResult.mainExit,
                            survivingDescendants: shutdownResult.survivingDescendants,
                            executionTimeoutSeconds: shutdownResult.executionTimeoutSeconds,
                            shutdownGraceSeconds: shutdownResult.shutdownGraceSeconds]
                    if (shutdownResult.executionTimedOut || !shutdownResult.shutdownTimedOut
                            || shutdownResult.mainExit != 0 || shutdownResult.survivingDescendants.isEmpty()) {
                        throw new GradleException('Task 20 shutdown timeout phase was not fail-closed')
                    }
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
                            detail: 'zero-exit parent with an owned surviving descendant was rejected']); break
                case 'harness.gametest-required-failure':
                    def child = gradleCommand('required-failure', [':neoforge-1.21.1:runGameTestServer', '-PfederationGameTestSelection=required-failure'], [timeout: 180, retainRuntime: false])
                    if (child.result.exit == 0 || !child.output.contains('AE2F_FAULT required failure injection')) throw new GradleException('Required failure did not fail closed')
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed', detail: "inner exit ${child.result.exit} retained"]); break
                case 'harness.gametest-timeout':
                    def child = gradleCommand('timeout-gametest', [':neoforge-1.21.1:runGameTestServer', '-PfederationGameTestSelection=timeout'], [timeout: 180, retainRuntime: false])
                    if (child.result.exit == 0 || !child.output.contains("Didn't succeed or fail within 20 ticks")) throw new GradleException('GameTest timeout did not fail closed')
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed', detail: "inner exit ${child.result.exit} retained"]); break
                case 'harness.gametest-namespace-mismatch':
                    def child = gradleCommand('namespace-mismatch', [':neoforge-1.21.1:runGameTestServer', '-PfederationGameTestNamespace=wrong_namespace'], [timeout: 120, retainRuntime: false])
                    if (!child.output.contains('No test functions were given')) throw new GradleException('Namespace mismatch did not fail closed')
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed', detail: "zero-selection diagnostic rejected despite inner exit ${child.result.exit}"]); break
                case 'harness.gametest-zero-selection':
                    def child = gradleCommand('zero-selection', [':neoforge-1.21.1:runGameTestServer', '-PfederationGameTestSelection=none'], [timeout: 120, retainRuntime: false])
                    if (!child.output.contains('No test functions were given')) throw new GradleException('Zero selection did not fail closed')
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed', detail: "zero-selection diagnostic rejected despite inner exit ${child.result.exit}"]); break
                case 'identity.replace-all-access':
                case 'identity.ambiguous-split':
                case 'identity.copied-node':
                case 'identity.restart':
                    def nativeEvidence = new File(attempt, "native-${testCase.testId}.properties")
                    def nativeResult = verifyNativeEvidence(nativeEvidence, [kind: 'verify', testId: testCase.testId,
                            structure: testCase.structure, assertions: testCase.assertions, operations: 2])
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
                            nativeTestId: testCase.testId, structure: testCase.structure,
                            assertionCount: nativeResult.assertions, operationCount: nativeResult.operations]); break
                case 'ports.bridge-cable-device':
                case 'ports.hub-six-grids':
                case 'ports.hub-repeated-grid':
                case 'ports.reject-floating-node':
                case 'ports.reject-cross-grid-join':
                    def nativeEvidence = new File(attempt, "native-${testCase.testId}.properties")
                    def nativeResult = verifyNativeEvidence(nativeEvidence, [kind: 'verify', testId: testCase.testId,
                            structure: testCase.structure, assertions: testCase.assertions, operations: 1,
                            allowZeroWork: true])
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
                            nativeTestId: testCase.testId, structure: testCase.structure,
                             assertionCount: nativeResult.assertions, operationCount: nativeResult.operations]); break
                case 'lane.native-three-way':
                case 'lane.pattern-subsets':
                case 'lane.single-drop-owner':
                case 'lane.reject-local-fallback':
                case 'lane.native-reload':
                    def nativeEvidence = new File(attempt, "native-${testCase.testId}.properties")
                    def nativeResult = verifyNativeEvidence(nativeEvidence, [kind: 'verify', testId: testCase.testId,
                            structure: testCase.structure, assertions: testCase.assertions, operations: 1,
                            allowZeroWork: true])
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
                            nativeTestId: testCase.testId, structure: testCase.structure,
                             assertionCount: nativeResult.assertions, operationCount: nativeResult.operations]); break
                case 'endpoint.local-native':
                case 'endpoint.five-face-item-fluid':
                case 'endpoint.reject-two-upstreams':
                case 'endpoint.reject-capability-loop':
                case 'endpoint.mode-isolation':
                    def nativeEvidence = new File(attempt, "native-${testCase.testId}.properties")
                    def nativeResult = verifyNativeEvidence(nativeEvidence, [kind: 'verify', testId: testCase.testId,
                            structure: testCase.structure, assertions: testCase.assertions, operations: 1,
                            allowZeroWork: true])
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
                            nativeTestId: testCase.testId, structure: testCase.structure,
                             assertionCount: nativeResult.assertions, operationCount: nativeResult.operations]); break
                case 'endpoint.local':
                case 'endpoint.federated':
                case 'endpoint.five-face-returns':
                case 'endpoint.return-backpressure':
                case 'endpoint.reject-mode-takeover':
                    def nativeEvidence = new File(attempt, "native-${testCase.testId}.properties")
                    def nativeResult = verifyNativeEvidence(nativeEvidence, [kind: 'verify', testId: testCase.testId,
                            structure: testCase.structure, assertions: testCase.assertions, accounting: false])
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
                            nativeTestId: testCase.testId, structure: testCase.structure,
                            assertionCount: nativeResult.assertions]); break
                case 'storage-proof.native-projection':
                case 'storage-proof.four-fabric-diamond':
                case 'storage-proof.reject-loop':
                case 'storage-proof.opaque-alias':
                    def nativeEvidence = new File(attempt, "native-${testCase.testId}.properties")
                    def nativeResult = verifyNativeEvidence(nativeEvidence, [kind: 'verify', testId: testCase.testId,
                            structure: testCase.structure, assertions: testCase.assertions, operations: 1,
                            allowZeroWork: true])
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
                            nativeTestId: testCase.testId, structure: testCase.structure,
                            assertionCount: nativeResult.assertions, operationCount: nativeResult.operations]); break
                case 'craft-proof.native-terminal':
                case 'craft-proof.native-stocking':
                case 'craft-proof.missing-material':
                case 'craft-proof.no-cpu':
                case 'craft-proof.disconnect-cancel-restart':
                    def nativeEvidence = new File(attempt, "native-${testCase.testId}.properties")
                    def nativeResult = verifyNativeEvidence(nativeEvidence, [kind: 'verify', testId: testCase.testId,
                            structure: testCase.structure, assertions: testCase.assertions, operations: 1,
                            allowZeroWork: true])
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
                            nativeTestId: testCase.testId, structure: testCase.structure,
                             assertionCount: nativeResult.assertions, operationCount: nativeResult.operations]); break
                case 'energy-proof.directional':
                case 'energy-proof.cold-start':
                case 'energy-proof.reject-reverse':
                case 'energy-proof.no-source':
                case 'energy-proof.ring':
                    def nativeEvidence = new File(attempt, "native-${testCase.testId}.properties")
                    def nativeResult = verifyNativeEvidence(nativeEvidence, [kind: 'verify', testId: testCase.testId,
                            structure: testCase.structure, assertions: testCase.assertions, operations: 1,
                            allowZeroWork: true])
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
                            nativeTestId: testCase.testId, structure: testCase.structure,
                            assertionCount: nativeResult.assertions, operationCount: nativeResult.operations]); break
                case 'bridge.valid':
                case 'bridge.invalid':
                case 'bridge.same-grid':
                case 'bridge.reject-federation-cable':
                case 'bridge.reload-replace':
                    def nativeEvidence = new File(attempt, "native-${testCase.testId}.properties")
                    def nativeResult = verifyNativeEvidence(nativeEvidence, [kind: 'verify', testId: testCase.testId,
                            structure: testCase.structure, assertions: testCase.assertions, operations: 1,
                            allowZeroWork: true])
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
                            nativeTestId: testCase.testId, structure: testCase.structure,
                            assertionCount: nativeResult.assertions, operationCount: nativeResult.operations]); break
                case 'hub.mixed-six-faces':
                case 'hub.six-independent-me':
                case 'hub.repeat-network':
                case 'hub.port-replacement':
                case 'hub.reject-unsupported':
                    def nativeEvidence = new File(attempt, "native-${testCase.testId}.properties")
                    def nativeResult = verifyNativeEvidence(nativeEvidence, [kind: 'verify', testId: testCase.testId,
                            structure: testCase.structure, assertions: testCase.assertions, operations: 1,
                            allowZeroWork: true])
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
                            nativeTestId: testCase.testId, structure: testCase.structure,
                             assertionCount: nativeResult.assertions, operationCount: nativeResult.operations]); break
                case 'fabric.bridge-diamond':
                case 'fabric.hub-merge-split':
                case 'fabric.redundant-membership':
                case 'fabric.partial-unload':
                case 'fabric.reject-stale-route':
                    def nativeEvidence = new File(attempt, "native-${testCase.testId}.properties")
                    def nativeResult = verifyNativeEvidence(nativeEvidence, [kind: 'verify', testId: testCase.testId,
                            structure: testCase.structure, assertions: testCase.assertions, operations: 1,
                            allowZeroWork: true])
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
                            nativeTestId: testCase.testId, structure: testCase.structure,
                             assertionCount: nativeResult.assertions, operationCount: nativeResult.operations]); break
                case 'policy.lifecycle-matrix':
                case 'policy.new-bridge-restore':
                case 'policy.reject-stale-edit':
                case 'policy.delete-reconnect':
                case 'policy.sparse-scale':
                    def nativeEvidence = new File(attempt, "native-${testCase.testId}.properties")
                    def nativeResult = verifyNativeEvidence(nativeEvidence, [kind: 'verify', testId: testCase.testId,
                            structure: testCase.structure, assertions: testCase.assertions, operations: 1,
                            allowZeroWork: true])
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
                            nativeTestId: testCase.testId, structure: testCase.structure,
                            assertionCount: nativeResult.assertions, operationCount: nativeResult.operations]); break
                case 'provider.pattern-mapping':
                case 'provider.refresh-priority':
                case 'provider.single-inventory':
                case 'provider.reject-stale-pattern':
                case 'provider.native-ticker-count':
                    def nativeEvidence = new File(attempt, "native-${testCase.testId}.properties")
                    def nativeResult = verifyNativeEvidence(nativeEvidence, [kind: 'verify', testId: testCase.testId,
                            structure: testCase.structure, assertions: testCase.assertions, operations: 1,
                            allowZeroWork: true])
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
                            nativeTestId: testCase.testId, structure: testCase.structure,
                             assertionCount: nativeResult.assertions, operationCount: nativeResult.operations]); break
                case 'provider.orientation':
                case 'claim.compete':
                case 'claim.offline-owner':
                case 'claim.overlap':
                case 'provider.rotate-pending':
                case 'provider.reject-same-grid':
                    def nativeEvidence = new File(attempt, "native-${testCase.testId}.properties")
                    def nativeResult = verifyNativeEvidence(nativeEvidence, [kind: 'verify', testId: testCase.testId,
                            structure: testCase.structure, assertions: testCase.assertions, operations: 1,
                            allowZeroWork: true])
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
                            nativeTestId: testCase.testId, structure: testCase.structure,
                            assertionCount: nativeResult.assertions, operationCount: nativeResult.operations]); break
                case 'processing.native-differential':
                case 'processing.shared-capacity':
                case 'processing.lock-isolation':
                case 'processing.disconnect-restart':
                case 'processing.dismantle':
                case 'processing.reject-false-replay':
                    def nativeEvidence = new File(attempt, "native-${testCase.testId}.properties")
                    def nativeResult = verifyNativeEvidence(nativeEvidence, [kind: 'verify', testId: testCase.testId,
                            structure: testCase.structure, assertions: testCase.assertions, accounting: false])
                    executed.add(caseId); assertions.add([caseId: caseId, status: 'passed',
                            nativeTestId: testCase.testId, structure: testCase.structure,
                            assertionCount: nativeResult.assertions]); break
            }
        }
    }

    if (executed != (kind == 'verify' ? requestedCases : [profile]) || assertions.isEmpty()) {
        throw new GradleException("Executed set mismatch or zero assertions: requested=${requestedCases ?: profile}, executed=${executed}")
    }
    def cleanupReceipt = new File(attempt, 'cleanup-receipt.txt')
    cleanupReceipt.text = kind == 'benchmark' && profile == 'processing-small'
            ? 'Task 20: generated native and Federation scenes completed serially; runtime data and session.lock were removed.\n'
            : requestedCases == taskNineteenCases
            ? 'Task 19: six serialized GameTest child finalizers copied diagnostics and removed task-owned runtime data; no session.lock remains.\n'
            : 'GameTest child finalizers copied diagnostics before removing task-owned run-gametest runtime data.\n'
    childArtifacts.add(cleanupReceipt)
    def artifacts = childArtifacts.unique().collect { file ->
        def canonical = file.canonicalFile
        if (!canonical.toPath().startsWith(attempt.canonicalFile.toPath()) || !canonical.isFile()) {
            throw new GradleException("Cannot persist missing or external artifact: ${file}")
        }
        [path: attempt.canonicalFile.toPath().relativize(canonical.toPath()).toString(), sha256: sha256(canonical.bytes)]
    }
    project.fileTree(attempt).matching { exclude('result.json'); exclude('.identity-check/**') }.files.each { file ->
        def path = attempt.toPath().relativize(file.toPath()).toString()
        if (!artifacts.any { it.path == path }) artifacts.add([path: path, sha256: sha256(file.bytes)])
    }
    verifyTaskFourEvidence(attempt, requestedCases, artifacts.collect { it.path as String }, childExits)
    verifyTaskFiveEvidence(attempt, requestedCases, artifacts.collect { it.path as String }, childExits)
    verifyTaskSixEvidence(attempt, requestedCases, artifacts.collect { it.path as String }, childExits)
    verifyTaskSevenEvidence(attempt, requestedCases, artifacts.collect { it.path as String }, childExits)
    verifyTaskEightEvidence(attempt, requestedCases, artifacts.collect { it.path as String }, childExits)
    verifyTaskNineEvidence(attempt, requestedCases, artifacts.collect { it.path as String }, childExits)
    verifyTaskTenEvidence(attempt, requestedCases, artifacts.collect { it.path as String }, childExits)
    verifyTaskElevenEvidence(attempt, requestedCases, artifacts.collect { it.path as String }, childExits)
    verifyTaskTwelveEvidence(attempt, requestedCases, artifacts.collect { it.path as String }, childExits)
    verifyTaskThirteenEvidence(attempt, requestedCases, artifacts.collect { it.path as String }, childExits)
    verifyTaskFourteenEvidence(attempt, requestedCases, artifacts.collect { it.path as String }, childExits)
    verifyTaskSixteenEvidence(attempt, requestedCases, artifacts.collect { it.path as String }, childExits)
    verifyTaskSeventeenEvidence(attempt, requestedCases, artifacts.collect { it.path as String }, childExits)
    verifyTaskEighteenEvidence(attempt, requestedCases, artifacts.collect { it.path as String }, childExits)
    verifyTaskNineteenEvidence(attempt, requestedCases, artifacts.collect { it.path as String }, childExits)
    def binding = [evidenceRoot: evidenceRoot.canonicalPath, attemptPath: attempt.canonicalPath, runId: runId]
    def taskTenBlocked = kind == 'verify' && requestedCases == taskTenCases
    def report = [schemaVersion: 3, status: taskTenBlocked ? 'BLOCKED' : 'complete', runId: runId, kind: kind,
            evidenceRoot: binding.evidenceRoot, attemptPath: binding.attemptPath,
            pathIdentitySha256: sha256(JsonOutput.toJson(binding).getBytes(StandardCharsets.UTF_8)),
            sourceRevision: sourceIdentity.revision,
            dirtyDiffSha256: sourceIdentity.dirtySha256, dependencyLockSha256: sha256(verificationMetadata.asFile.bytes),
            productJarSha256: sha256(jar.bytes), seed: 0, startedAt: startedAt, endedAt: Instant.now().toString(),
            requested: kind == 'verify' ? requestedCases : [profile], executed: executed, assertions: assertions,
            parentExit: taskTenBlocked ? 1 : 0, childExits: childExits,
            childLifecycles: childLifecycles, artifacts: artifacts]
    if (kind == 'benchmark') report.profileLifecycle = assertions[0].lifecycle
    if (kind == 'benchmark' && profile == 'processing-small') report.profile = assertions[0].profile
    verifyTaskTwentyBenchmarkEvidence(attempt, report, artifacts.collect { it.path as String })
    if (taskTenBlocked) {
        report.reason = 'native-energy-directionality-unavailable'
        report.missingHooks = ['shared EnergyOverlayGrid has no caller/edge direction, route identity, or authorization boundary']
        report.availableNativeRoute = ['IGrid.getEnergyService', 'IEnergyService.extractAEPower',
                'IAEPowerStorage.getAECurrentPower', 'IEnergyOverlayGridConnection.connectedEnergyServices']
    }
    def resultFile = new File(attempt, 'result.json')
    resultFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(report)) + '\n'
    if (taskTenBlocked) {
        logger.lifecycle("Federation verify evidence BLOCKED: ${attempt}")
        throw new GradleException("Task 10 BLOCKED: ${report.missingHooks.first()}; result=${resultFile}")
    }
    verifyPersistedReport(new File(selectCurrentAttempt(evidenceRoot, runId), 'result.json'), true)
    logger.lifecycle("Federation ${kind} evidence: ${attempt}")
}

