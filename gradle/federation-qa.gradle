    def selectedBenchmarkProfile = report.kind == 'benchmark' ? lifecycleProfiles[report.requested.first()] : null
    if (report.kind == 'benchmark' && !(selectedBenchmarkProfile instanceof Map)) {
        throw new GradleException('Persisted benchmark report selected an unknown profile')
    }
    def selectedBenchmarkLifecycle = report.kind == 'benchmark'
            ? benchmarkLifecycleForEntry(selectedBenchmarkProfile as Map) : null
    if (report.kind == 'benchmark') {
        requireBenchmarkLifecycleMatch(report.profileLifecycle, selectedBenchmarkLifecycle,
                'persisted benchmark report')
    }
    if (!(report.childExits instanceof Map) || report.childExits.any { label, exit -> !(exit instanceof Number) }) {
        throw new GradleException('Child exit accounting is malformed')
    }
    if (!(report.childLifecycles instanceof Map)) {
        throw new GradleException('Child process lifecycle accounting is missing')
    }
    if (report.childLifecycles instanceof Map) {
        def taskTwentyLifecycleLabels = [
                'benchmark.reject-empty-work': ['task20-empty-work'],
                'benchmark.resource-accounting': ['task20-accounting', 'task20-adversarial'],
                'benchmark.execution-timeout': ['task20-execution-timeout'],
                'benchmark.shutdown-timeout': ['task20-shutdown-timeout']]
        def expectedChildLabels = report.kind == 'benchmark' ? ['benchmark-gametest'] : []
        report.requested.each { expectedChildLabels.addAll(taskTwentyLifecycleLabels[it] ?: []) }
        def expectedExecutionTimeout = report.requested.contains('benchmark.execution-timeout')
                ? ['task20-execution-timeout'] : []
        def expectedShutdownTimeout = report.requested.contains('benchmark.shutdown-timeout')
                ? ['task20-shutdown-timeout'] : []
        def expectedExecutionDeadlines = ['task20-empty-work': processingLifecycle.executionTimeoutSeconds,
                'task20-accounting': processingLifecycle.executionTimeoutSeconds,
                'task20-adversarial': processingLifecycle.executionTimeoutSeconds,
                'task20-execution-timeout': 1L, 'task20-shutdown-timeout': 5L]
        def expectedShutdownGrace = ['task20-empty-work': processingLifecycle.shutdownGraceSeconds,
                'task20-accounting': processingLifecycle.shutdownGraceSeconds,
                'task20-adversarial': processingLifecycle.shutdownGraceSeconds,
                'task20-execution-timeout': 1L, 'task20-shutdown-timeout': 1L]
        if (report.kind == 'benchmark') {
            expectedExecutionDeadlines['benchmark-gametest'] = selectedBenchmarkLifecycle.executionTimeoutSeconds
            expectedShutdownGrace['benchmark-gametest'] = selectedBenchmarkLifecycle.shutdownGraceSeconds
        }
        if (report.childLifecycles.keySet() != report.childExits.keySet()
                || !report.childLifecycles.keySet().containsAll(expectedChildLabels)
                || report.childLifecycles.any { label, lifecycle ->
                    def executionExpected = label in expectedExecutionTimeout
                    def shutdownExpected = label in expectedShutdownTimeout
                    def lifecycleDeclaration = lifecycle instanceof Map ? parseBenchmarkLifecycle(
                            [executionTimeoutSeconds: lifecycle.executionTimeoutSeconds,
                             shutdownGraceSeconds: lifecycle.shutdownGraceSeconds], "child ${label}") : null
                    def executionDeadline = lifecycleDeclaration?.executionTimeoutSeconds ?: 0
                    def shutdownGrace = lifecycleDeclaration?.shutdownGraceSeconds ?: 0
                    def expectedLifecycle = expectedExecutionDeadlines.containsKey(label)
                            ? [executionTimeoutSeconds: expectedExecutionDeadlines[label],
                               shutdownGraceSeconds: expectedShutdownGrace[label]] : null
                    if (expectedLifecycle != null) {
                        requireBenchmarkLifecycleMatch(
                                [executionTimeoutSeconds: executionDeadline, shutdownGraceSeconds: shutdownGrace],
                                expectedLifecycle, "child ${label}")
                    }
                    !(lifecycle instanceof Map) || lifecycle.executionTimedOut != executionExpected
                            || lifecycle.shutdownTimedOut != shutdownExpected
                            || !(lifecycle.survivingDescendants instanceof List)
                            || lifecycle.survivingDescendants.any { !(it instanceof Number) || it.longValue() <= 0 }
                            || (!shutdownExpected && lifecycle.survivingDescendants != [])
                            || (shutdownExpected && lifecycle.survivingDescendants == [])
                            || (executionExpected && (lifecycle.mainExit != null || report.childExits[label] != 124))
                            || (!executionExpected && !shutdownExpected
                            && lifecycle.mainExit != report.childExits[label])
                            || (shutdownExpected && (lifecycle.mainExit != 0 || report.childExits[label] != 125))
                            || executionDeadline > maxOperationalTimeoutSeconds
                            || shutdownGrace > maxShutdownGraceSeconds
                }) {
            throw new GradleException('Child process lifecycle accounting is malformed or incomplete')
        }
    }
    def nativeAssertions = report.assertions.findAll { it.nativeTestId != null }
    if (report.kind == 'benchmark') {
        if (report.childExits['benchmark-gametest'] != 0 || nativeAssertions.size() != 1) {
            throw new GradleException('Benchmark child exit or native assertion accounting is invalid')
        }
    } else if (nativeAssertions.any { assertion ->
        def positiveExit = report.childExits["positive-${assertion.nativeTestId}"]
        def restartExit = report.childExits['restart-verify']
        positiveExit == null ? restartExit != 0 : positiveExit != 0
    }) {
        throw new GradleException('Positive GameTest child exit is missing or nonzero')
    }
    if (!(report.artifacts instanceof List) || report.artifacts.isEmpty()) {
        throw new GradleException('Result report has no artifacts')
    }
    report.artifacts.each { artifact ->
        if (!(artifact instanceof Map) || !(artifact.path instanceof String) || !(artifact.sha256 instanceof String)) {
            throw new GradleException('Artifact metadata is malformed')
        }
        def file = new File(attempt, artifact.path as String).canonicalFile
        if (!file.toPath().startsWith(attempt.toPath()) || !file.isFile() || sha256(file.bytes) != artifact.sha256) {
            throw new GradleException("Artifact is missing, outside the attempt, or hash-mismatched: ${artifact.path}")
        }
    }
    verifyTaskFourEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskFiveEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskSixEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskSevenEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskEightEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskNineEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskTenEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskElevenEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskTwelveEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskThirteenEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskFourteenEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskSixteenEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskSeventeenEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskEighteenEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskNineteenEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskTwentyBenchmarkEvidence(attempt, report as Map, report.artifacts.collect { it.path as String })
    if (requireCurrentIdentity) {
        def identityDir = new File(attempt, '.identity-check')
        def identity = currentSourceIdentity(identityDir)
        project.delete(identityDir)
        def jar = productJar.get().asFile
        if (report.sourceRevision != identity.revision || report.dirtyDiffSha256 != identity.dirtySha256
                || report.dependencyLockSha256 != sha256(verificationMetadata.asFile.bytes)
                || !jar.isFile() || report.productJarSha256 != sha256(jar.bytes)) {
            throw new GradleException('Result source, dependency, or product identity is stale')
        }
        def manifest = new JsonSlurper().parse(manifestFile.asFile)
        def expectedEntries = report.kind == 'benchmark'
                ? manifest.profiles.collectEntries { [(it.id): it] }
                : manifest.cases.collectEntries { [(it.id): it] }
        report.assertions.each { assertion ->
            def expected = expectedEntries[assertion.caseId]
            if (expected == null) throw new GradleException("Result references an unknown manifest entry: ${assertion.caseId}")
            if ((report.kind == 'benchmark' || expected.backend in ['gametest', 'gametest-restart'])
                    && (assertion.nativeTestId != expected.testId
                    || assertion.assertionCount != expected.assertions)) {
                throw new GradleException("Result native identity does not match manifest entry: ${assertion.caseId}")
            }
            if (expected.structure != null && assertion.structure != null && assertion.structure != expected.structure) {
                throw new GradleException("Result structure does not match manifest entry: ${assertion.caseId}")
            }
            if (report.kind == 'benchmark' && assertion.operationCount != expected.operations) {
                throw new GradleException("Result benchmark operations do not match manifest profile: ${assertion.caseId}")
            }
        }
    }
    report
}

def verifyNativeEvidence = { File evidenceFile, Map expected ->
    if (!evidenceFile.isFile()) throw new GradleException("Native evidence artifact is missing: ${evidenceFile}")
    def properties = new Properties()
    evidenceFile.withInputStream { properties.load(it) }
    if (properties.getProperty('schemaVersion') != '1' || properties.getProperty('status') != 'passed'
            || properties.getProperty('kind') != expected.kind
            || properties.getProperty('testId') != expected.testId
            || properties.getProperty('structure') != expected.structure) {
        throw new GradleException("Native evidence identity mismatch: ${evidenceFile}")
    }
    def assertions = parsePositiveInteger(properties.getProperty('assertions'), 'native assertions')
    if (expected.accounting == false) {
        if (assertions != expected.assertions as long
                || ['operations', 'inserted', 'extracted', 'elapsedNanos'].any(properties::containsKey)) {
            throw new GradleException("Task-specific native evidence contains unsupported generic accounting: ${evidenceFile}")
        }
        return [assertions: assertions]
    }
    def operations = parsePositiveInteger(properties.getProperty('operations'), 'native operations')
    def inserted = parseNonnegativeInteger(properties.getProperty('inserted'), 'native inserted')
    def extracted = parseNonnegativeInteger(properties.getProperty('extracted'), 'native extracted')
    def elapsedNanos = parseNonnegativeInteger(properties.getProperty('elapsedNanos'), 'native elapsedNanos')
    if (assertions != expected.assertions as long || operations != expected.operations as long
            || (!expected.allowZeroWork && inserted <= 0) || extracted != inserted
            || (expected.kind == 'benchmark' && elapsedNanos <= 0)) {
        throw new GradleException("Native evidence accounting mismatch: ${evidenceFile}; actual assertions=${assertions}, operations=${operations}, inserted=${inserted}, extracted=${extracted}, elapsedNanos=${elapsedNanos}; expected=${expected}")
    }
    [assertions: assertions, operations: operations, inserted: inserted, extracted: extracted, elapsedNanos: elapsedNanos]
}

def reportVerifierRejects = { File parent, String name, Closure mutate ->
    def runId = "probe-${name}"
    def attempt = new File(parent, "attempt-${runId}")
    attempt.mkdirs()
    def artifact = new File(attempt, 'probe.txt')
    artifact.text = 'persisted verifier probe\n'
    def binding = [evidenceRoot: attempt.parentFile.canonicalPath, attemptPath: attempt.canonicalPath, runId: runId]
    def requireCurrentIdentity = name in ['stale-source', 'stale-dirty', 'stale-dependency']
    def currentIdentity = requireCurrentIdentity
            ? currentSourceIdentity(new File(attempt, '.current-identity'))
            : [revision: 'probe', dirtySha256: 'probe']
    project.delete(new File(attempt, '.current-identity'))
    def report = [schemaVersion: 3, status: 'complete', runId: runId, kind: 'verify',
             evidenceRoot: binding.evidenceRoot, attemptPath: binding.attemptPath,
             pathIdentitySha256: sha256(JsonOutput.toJson(binding).getBytes(StandardCharsets.UTF_8)),
             sourceRevision: currentIdentity.revision, dirtyDiffSha256: currentIdentity.dirtySha256,
             dependencyLockSha256: requireCurrentIdentity ? sha256(verificationMetadata.asFile.bytes) : 'probe',
             productJarSha256: requireCurrentIdentity ? sha256(productJar.get().asFile.bytes) : 'probe',
            seed: 0, startedAt: Instant.now().minusSeconds(1).toString(), endedAt: Instant.now().toString(),
            requested: ['probe'], executed: ['probe'], assertions: [[caseId: 'probe', status: 'passed']],
             parentExit: 0, childExits: [:], childLifecycles: [:],
             artifacts: [[path: 'probe.txt', sha256: sha256(artifact.bytes)]]]
    mutate(report, artifact)
    def result = new File(attempt, 'result.json')
    result.text = JsonOutput.toJson(report)
    try {
        verifyPersistedReport(result, requireCurrentIdentity)
        false
    } catch (GradleException exception) {
        exception.message
    } finally {
        project.delete(attempt)
    }
}

tasks.register('federationTaskTwentyPersistedLifecycleContract') {
    group = 'verification'
    description = 'Rejects incomplete, nonpositive, and unbounded schema-v3 child lifecycle evidence.'
    doLast {
        def configureChild = { Map report ->
            report.childExits = ['probe-child': 1]
            report.childLifecycles = ['probe-child': [executionTimedOut: false, shutdownTimedOut: false,
                    mainExit: 1, survivingDescendants: [], executionTimeoutSeconds: 20,
                    shutdownGraceSeconds: 10]]
        }
        def probes = [
                reportVerifierRejects.call(temporaryDir, 'lifecycle-missing') { report, artifact ->
                    report.remove('childLifecycles')
                },
                reportVerifierRejects.call(temporaryDir, 'lifecycle-entry-missing') { report, artifact ->
                    configureChild(report)
                    report.childLifecycles.clear()
                },
                reportVerifierRejects.call(temporaryDir, 'lifecycle-deadline-zero') { report, artifact ->
                    configureChild(report)
                    report.childLifecycles['probe-child'].executionTimeoutSeconds = 0
                },
                reportVerifierRejects.call(temporaryDir, 'lifecycle-deadline-unbounded') { report, artifact ->
                    configureChild(report)
                    report.childLifecycles['probe-child'].executionTimeoutSeconds = maxOperationalTimeoutSeconds + 1
                },
                reportVerifierRejects.call(temporaryDir, 'lifecycle-deadline-negative') { report, artifact ->
                    configureChild(report)
                    report.childLifecycles['probe-child'].executionTimeoutSeconds = -1
                },
                reportVerifierRejects.call(temporaryDir, 'lifecycle-deadline-malformed') { report, artifact ->
                    configureChild(report)
                    report.childLifecycles['probe-child'].executionTimeoutSeconds = '3600'
                },
                reportVerifierRejects.call(temporaryDir, 'lifecycle-grace-zero') { report, artifact ->
                    configureChild(report)
                    report.childLifecycles['probe-child'].shutdownGraceSeconds = 0
                },
                reportVerifierRejects.call(temporaryDir, 'lifecycle-grace-unbounded') { report, artifact ->
                    configureChild(report)
                    report.childLifecycles['probe-child'].shutdownGraceSeconds = 31
                },
                reportVerifierRejects.call(temporaryDir, 'lifecycle-grace-negative') { report, artifact ->
                    configureChild(report)
                    report.childLifecycles['probe-child'].shutdownGraceSeconds = -1
                },
                reportVerifierRejects.call(temporaryDir, 'lifecycle-grace-malformed') { report, artifact ->
                    configureChild(report)
                    report.childLifecycles['probe-child'].shutdownGraceSeconds = '10'
                }
        ]
        if (probes.any { !(it instanceof String) }) {
            throw new GradleException('Incomplete or unbounded child lifecycle evidence was accepted')
        }
        logger.lifecycle('Task 20 persisted child-lifecycle mutation contract passed')
    }
}

tasks.register('federationTaskTwentyLongDeadlineContract') {
    group = 'verification'
    description = 'Accepts a declared long-profile lifecycle without waiting for its deadline.'
    doLast {
        [2700L, 7200L].each { deadline ->
            def longProfile = new File(temporaryDir, "long-profile-${deadline}.json")
            longProfile.parentFile.mkdirs()
            longProfile.text = JsonOutput.toJson([id: "long-profile-${deadline}", lifecycle: [
                    executionTimeoutSeconds: deadline, shutdownGraceSeconds: 10]])
            def declared = loadBenchmarkLifecycle(longProfile)
            requireBenchmarkLifecycleMatch(
                    [executionTimeoutSeconds: deadline, shutdownGraceSeconds: 10], declared,
                    "long-profile-${deadline} probe")
            def result = reportVerifierRejects.call(temporaryDir, "long-profile-deadline-${deadline}") {
                report, artifact ->
                report.childExits = ['probe-child': 0]
                report.childLifecycles = ['probe-child': [executionTimedOut: false, shutdownTimedOut: false,
                        mainExit: 0, survivingDescendants: [], executionTimeoutSeconds: deadline,
                        shutdownGraceSeconds: 10]]
            }
            if (result) {
                throw new GradleException("Declared ${deadline}-second lifecycle was rejected: ${result}")
            }
            def mismatchRejected = false
            try {
                requireBenchmarkLifecycleMatch(
                        [executionTimeoutSeconds: deadline - 1, shutdownGraceSeconds: 10], declared,
                        "long-profile-${deadline} mismatch probe")
            } catch (GradleException expected) {
                mismatchRejected = true
            }
            if (!mismatchRejected) throw new GradleException('Mismatched long-profile lifecycle was accepted')
        }
        logger.lifecycle('Task 20 long-profile lifecycle contract passed without waiting for its deadline')
    }
}

