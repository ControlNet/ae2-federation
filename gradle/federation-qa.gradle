            'provider', 'destination', 'session', 'key', 'amount', 'inputBefore', 'inputAfter', 'outputBefore',
            'outputAfter', 'trackerCalls', 'trackerSubmissions', 'cpuLogic', 'callbackAccepted',
            'physicalInserted', 'replacementRequester', 'replacementNode'] as Set
