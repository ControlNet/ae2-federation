    def expected = [storagenativeaccess: 20, storagepriority: 16, storageviewonly: 10, storagesimulate: 9,
            storagerejectrevoked: 20]
    def expectedArtifacts = expected.keySet().collect { "native-${it}.properties" } as Set
    def declaredNativeNames = declaredPaths.collect { new File(it).name }.findAll {
        it.startsWith('native-storage') && it.endsWith('.properties')
    }
    if (declaredNativeNames.size() != expectedArtifacts.size() || declaredNativeNames.toSet() != expectedArtifacts) {
        throw new GradleException('Task 21 native artifact set is duplicated, missing, or substituted')
    }
    if (expected.keySet().any { childExits["positive-${it}"] != 0 }) {
        throw new GradleException('Task 21 native child exits are incomplete')
    }
    def parsed = [:]
    expected.each { testId, assertionCount ->
        def artifact = "native-${testId}.properties"
        def log = "positive-${testId}.log"
        if (declaredPaths.count { it == artifact } != 1 || declaredPaths.count { it == log } != 1
                || declaredPaths.count { new File(it).name == artifact } != 1
                || declaredPaths.count { new File(it).name == log } != 1) {
            throw new GradleException("Task 21 requires exactly one hash-bound artifact and execution log for ${testId}")
        }
        def file = new File(attempt, artifact)
        def properties = loadProperties(file)
        requireProperty(properties, 'schemaVersion', '1', file)
        requireProperty(properties, 'status', 'passed', file)
        requireProperty(properties, 'kind', 'verify', file)
        requireProperty(properties, 'testId', testId as String, file)
