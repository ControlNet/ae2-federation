                || authority.forward != properties.getProperty('forwardAuthority')
                || authority.reverse != properties.getProperty('reverseAuthority')
                || authority.nativeState != properties.getProperty('nativeState')
                || authority.controller != properties.getProperty('federationController')
                || authority.ledger != properties.getProperty('federationLedger')
                || properties.getProperty('mountCount') != '1') {
            throw new GradleException("Task 28 native authority mismatch: ${testId}")
        }
        parsed[testId] = properties
        nativeReceipts[testId] = nativeReceipt
        preOperationReceipts[testId] = preOperation
    }
    def stocked = parsed.automationinterfacestock as Properties
    def stockedNative = nativeReceipts.automationinterfacestock as Map
    def stockedAuthority = preOperationReceipts.automationinterfacestock as Map
    if (stocked.stocked != '5' || stocked.sourceBefore != '7' || stocked.sourceAfter != '2'
