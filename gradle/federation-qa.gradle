    requireProperty(cross, 'joinRequested', 'true', crossFile)
    if (cross.getProperty('joinAccepted') != 'false' || cross.getProperty('gridsRemainDistinct') != 'true') {
        throw new GradleException('Task 5 cross-grid join was accepted')
    }
    def northGrid = requireTracedIdentity('portsrejectcrossgridjoin', cross, 'northGrid', crossFile)
    def southGrid = requireTracedIdentity('portsrejectcrossgridjoin', cross, 'southGrid', crossFile)
    if (northGrid == southGrid) throw new GradleException('Task 5 northGrid/southGrid identity facts are equal')
