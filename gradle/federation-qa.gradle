    if (baseline.captureIdentitySha256 != sha256(JsonOutput.toJson(captureBinding).getBytes(StandardCharsets.UTF_8))
            || baseline.profileSha256 != sha256(profileFile.bytes) || baseline.budgetSha256 != sha256(budgetFile.bytes)
            || baseline.dependencyLockSha256 != sha256(verificationMetadata.asFile.bytes)
