tasks.register('federationCleanupSelfTest') {
    notCompatibleWithConfigurationCache('Exercises timed-out and crashed children with task-owned runtime cleanup.')
    doLast {
        def evidence = rootProject.file('.omo/evidence/task-02/path-cleanup-fix/cleanup-probes')
        evidence.mkdirs()
        ['timeout', 'crash', 'validator'].each { fault ->
            def runtime = layout.projectDirectory.dir('run-gametest').asFile
            new File(runtime, 'world').mkdirs()
            new File(runtime, 'world/session.lock').text = 'Explicit synthetic cleanup test fixture\n'
            try {
                if (fault == 'validator') throw new GradleException('Injected validator failure')
                def command = fault == 'timeout' ? ['/bin/sh', '-c', 'sleep 30'] : ['/bin/sh', '-c', 'exit 17']
                def result = runProcess(command, rootProject.projectDir, new File(evidence, "${fault}.log"), 1)
                if (result.exit != (fault == 'timeout' ? 124 : 17)) throw new GradleException('Fault exit mismatch')
            } catch (GradleException failure) {
                if (fault != 'validator') throw failure
            } finally {
                cleanupRuntime(new File(evidence, fault))
            }
            if (runtime.exists()) throw new GradleException("Runtime retained after ${fault}")
        }
    }
}

