tasks.register('federationTaskTwentyRepositoryIdentityCharacterization') {
    group = 'verification'
    description = 'Characterizes repository identity coverage and documented exclusions.'
    notCompatibleWithConfigurationCache('Temporarily changes and restores repository fixtures.')
    doLast {
        def output = layout.buildDirectory.dir('task20-repository-identity-characterization').get().asFile
        def tracked = rootProject.file('README.md')
        def untracked = rootProject.file('task20-repository-identity-probe.txt')
        def excluded = rootProject.file('.omo/task20-repository-identity-probe.txt')
        def renameDestination = rootProject.file('task20-repository-identity-rename-destination.txt')
        def copyDestination = rootProject.file('task20-repository-identity-copy-destination.txt')
        def original = tracked.bytes
        try {
            def initial = currentSourceIdentity(new File(output, 'initial')).dirtySha256
            tracked.append('\nTask 20 repository identity characterization\n')
            def modified = currentSourceIdentity(new File(output, 'modified')).dirtySha256
            tracked.bytes = original
            untracked.text = 'Task 20 untracked repository identity characterization\n'
            def withUntracked = currentSourceIdentity(new File(output, 'untracked')).dirtySha256
            untracked.delete()
            excluded.parentFile.mkdirs()
            excluded.text = 'Task 20 documented exclusion characterization\n'
            def withExcluded = currentSourceIdentity(new File(output, 'excluded')).dirtySha256
            renameDestination.bytes = original
            copyDestination.bytes = original
            def syntheticStatus = ("R  ${renameDestination.name}\u0000README.md\u0000"
                    + "C  ${copyDestination.name}\u0000README.md\u0000").getBytes(StandardCharsets.UTF_8)
            def beforeDestinationEdit = sha256(dirtyIdentityForStatus(syntheticStatus, repositoryDir.asFile)
                    .getBytes(StandardCharsets.UTF_8))
            renameDestination.append('\nTask 20 renamed destination bytes\n')
            def afterRenameEdit = sha256(dirtyIdentityForStatus(syntheticStatus, repositoryDir.asFile)
                    .getBytes(StandardCharsets.UTF_8))
            renameDestination.bytes = original
            copyDestination.append('\nTask 20 copied destination bytes\n')
            def afterCopyEdit = sha256(dirtyIdentityForStatus(syntheticStatus, repositoryDir.asFile)
                    .getBytes(StandardCharsets.UTF_8))
            if (modified == initial || withUntracked == initial || withExcluded != initial) {
                throw new GradleException('Repository identity characterization failed')
            }
            if (beforeDestinationEdit == afterRenameEdit || beforeDestinationEdit == afterCopyEdit) {
                throw new GradleException('Task 20 rename destination identity characterization failed')
            }
            logger.lifecycle('Task 20 repository identity characterization passed')
        } finally {
            tracked.bytes = original
            untracked.delete()
            excluded.delete()
            renameDestination.delete()
            copyDestination.delete()
        }
    }
}

tasks.register('federationTaskTwentyOldEvidenceContract') {
    group = 'verification'
    description = 'Accepts explicitly selected old evidence when its identity and path bindings remain current.'
    dependsOn(tasks.named('jar'))
    notCompatibleWithConfigurationCache('Copies and rebinds a real persisted Task 20 result.')
    doLast {
        def resultPath = oldEvidenceResultFileProperty.orNull
        if (resultPath == null || resultPath.isBlank()) throw new GradleException('Missing -PresultFile')
        def sourceResult = rootProject.file(resultPath).canonicalFile
        verifyPersistedReport.call(sourceResult, true)
        def sourceAttempt = sourceResult.parentFile
        def root = new File(temporaryDir, 'old-evidence').canonicalFile
        def attempt = new File(root, 'attempt-explicit-old').canonicalFile
        sourceAttempt.eachFileRecurse(FileType.FILES) { source ->
            def target = attempt.toPath().resolve(sourceAttempt.toPath().relativize(source.toPath()))
            Files.createDirectories(target.parent)
            Files.copy(source.toPath(), target, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
        def oldStart = Instant.now().minusSeconds(86_400)
        def report = new JsonSlurper().parse(new File(attempt, 'result.json')) as Map
        def binding = [evidenceRoot: root.path, attemptPath: attempt.path, runId: 'explicit-old']
        report.runId = 'explicit-old'
        report.evidenceRoot = root.path
        report.attemptPath = attempt.path
        report.pathIdentitySha256 = sha256(JsonOutput.toJson(binding).getBytes(StandardCharsets.UTF_8))
        report.startedAt = oldStart.toString()
        report.endedAt = oldStart.plusSeconds(30).toString()
        def result = new File(attempt, 'result.json')
        result.text = JsonOutput.toJson(report)
        verifyPersistedReport.call(result, true)
        logger.lifecycle('Task 20 old identity-current explicit evidence contract passed')
    }
}

