def strictCanonicalPath = { File file ->
    def absolute = file.absoluteFile.toPath()
    if (absolute != absolute.normalize() || file.absolutePath != file.canonicalPath) {
        throw new GradleException("Symlink or traversal path rejected: ${file}")
    }
    file.canonicalFile
}
def loadProperties = { File file ->
    if (!file.isFile()) throw new GradleException("Task 4 artifact is missing: ${file}")
    def properties = new Properties()
    try {
        file.withInputStream { properties.load(it) }
    } catch (Exception exception) {
        throw new GradleException("Malformed Task 4 properties artifact: ${file}", exception)
    }
    properties
}
def requireProperty = { Properties properties, String name, String expected, File file ->
    if (properties.getProperty(name) != expected) {
        throw new GradleException("Task 4 ${name} mismatch in ${file.name}")
    }
}
def requireNativeObjectIdentity = { Properties properties, String name, File file ->
    def value = properties.getProperty(name)
    if (value == null || !(value ==~ /0|[1-9][0-9]*/)) {
        throw new GradleException("Task 4 ${name} is missing, empty, or malformed in ${file.name}")
    }
    value
}
def requireDistinct = { Properties properties, String first, String second, File file ->
    def left = properties.getProperty(first)
    def right = properties.getProperty(second)
    if (left == null || right == null || left == right) {
        throw new GradleException("Task 4 ${first}/${second} identity facts are missing or equal in ${file.name}")
    }
}
verifyTaskFourEvidence = { File attempt, List requested, List<String> declaredPaths, Map childExits ->
    def taskFourCases = ['identity.replace-all-access', 'identity.restart',
            'identity.ambiguous-split', 'identity.copied-node']
    if (!requested.any { it in taskFourCases }) return
    if (requested != taskFourCases) throw new GradleException('Task 4 evidence must select the exact canonical case set')
    if (childExits['positive-identityreplaceallaccess'] != 0
            || childExits['positive-identityambiguoussplit'] != 0
            || childExits['positive-identitycopiednode'] != 0
            || childExits['restart-prepare'] != 0 || childExits['restart-verify'] != 0) {
        throw new GradleException('Task 4 native or two-process restart child exits are incomplete')
    }

    def expected = [
            identityreplaceallaccess: [settlement: 'settled', assertions: 8],
            identityrestart: [settlement: 'settled-after-restart', assertions: 5],
            identityambiguoussplit: [settlement: 'ambiguous-split', assertions: 6],
            identitycopiednode: [settlement: 'copied-live-identity', assertions: 5]
    ]
    def parsed = [:]
    def expectedArtifactNames = expected.keySet().collect { "native-${it}.properties" } as Set
    def declaredNativeNames = declaredPaths.findAll {
        new File(it).name.startsWith('native-identity') && new File(it).name.endsWith('.properties')
    }
    if (declaredNativeNames.size() != expectedArtifactNames.size()
            || declaredNativeNames.toSet() != expectedArtifactNames) {
        throw new GradleException('Task 4 native artifact set is duplicated, missing, or substituted')
    }
    expected.each { testId, semantics ->
        def artifactName = "native-${testId}.properties"
        if (declaredPaths.count { new File(it).name == artifactName } != 1
                || declaredPaths.count { it == artifactName } != 1) {
            throw new GradleException("Task 4 requires exactly one hash-bound ${artifactName}")
        }
        def file = new File(attempt, artifactName).canonicalFile
        if (!file.toPath().startsWith(attempt.canonicalFile.toPath())) {
            throw new GradleException("Task 4 artifact escapes attempt: ${artifactName}")
        }
        def properties = loadProperties(file)
        requireProperty(properties, 'schemaVersion', '1', file)
        requireProperty(properties, 'status', 'passed', file)
        requireProperty(properties, 'kind', 'verify', file)
        requireProperty(properties, 'testId', testId as String, file)
        requireProperty(properties, 'structure', 'ae2federation_test:harness_native_smoke', file)
        requireProperty(properties, 'settlement', semantics.settlement as String, file)
        if (parsePositiveInteger(properties.getProperty('assertions'), 'Task 4 assertions') != semantics.assertions
                || parsePositiveInteger(properties.getProperty('operations'), 'Task 4 operations') <= 0) {
            throw new GradleException("Task 4 assertion/trace accounting mismatch in ${artifactName}")
        }
        def networkId = properties.getProperty('networkId')
        if (networkId == null || !(networkId ==~ /ae2federation:network:v1:[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/)) {
            throw new GradleException("Task 4 versioned NetworkId is malformed in ${artifactName}")
        }
        parsed[testId] = properties
    }

    def replace = parsed.identityreplaceallaccess as Properties
    def replaceFile = new File(attempt, 'native-identityreplaceallaccess.properties')
    requireDistinct(replace, 'firstAttachmentId', 'secondAttachmentId', new File(attempt, 'native-identityreplaceallaccess.properties'))
    requireProperty(replace, 'recoveredNetworkId', replace.getProperty('networkId'),
            new File(attempt, 'native-identityreplaceallaccess.properties'))
    requireProperty(replace, 'activeDuringRemoval', '0', new File(attempt, 'native-identityreplaceallaccess.properties'))
    def nativeGridBefore = requireNativeObjectIdentity(replace, 'nativeGridBefore', replaceFile)
    def nativeGridAfter = requireNativeObjectIdentity(replace, 'nativeGridAfter', replaceFile)
    def nativeNodeBefore = requireNativeObjectIdentity(replace, 'nativeNodeBefore', replaceFile)
    def nativeNodeAfter = requireNativeObjectIdentity(replace, 'nativeNodeAfter', replaceFile)
    if (nativeGridAfter != nativeGridBefore || nativeNodeAfter != nativeNodeBefore) {
        throw new GradleException('Task 4 native Grid/node continuity mismatch in native-identityreplaceallaccess.properties')
    }

    def split = parsed.identityambiguoussplit as Properties
    requireDistinct(split, 'leftGrid', 'rightGrid', new File(attempt, 'native-identityambiguoussplit.properties'))
    requireProperty(split, 'leftCanInherit', 'false', new File(attempt, 'native-identityambiguoussplit.properties'))
    requireProperty(split, 'rightCanInherit', 'false', new File(attempt, 'native-identityambiguoussplit.properties'))

    def copied = parsed.identitycopiednode as Properties
    requireDistinct(copied, 'sourceGrid', 'copyGrid', new File(attempt, 'native-identitycopiednode.properties'))
    requireDistinct(copied, 'sourceNode', 'copyNode', new File(attempt, 'native-identitycopiednode.properties'))
    requireProperty(copied, 'sourceCanInherit', 'false', new File(attempt, 'native-identitycopiednode.properties'))
    requireProperty(copied, 'copyCanInherit', 'false', new File(attempt, 'native-identitycopiednode.properties'))

    def restart = parsed.identityrestart as Properties
    requireProperty(restart, 'restored', 'true', new File(attempt, 'native-identityrestart.properties'))
    def stateName = 'identity-restart-state.properties'
    def prepareName = 'restart-prepare.log'
    def verifyName = 'restart-verify.log'
    [stateName, prepareName, verifyName].each { name ->
        if (declaredPaths.count { it == name } != 1) throw new GradleException("Task 4 requires exactly one hash-bound ${name}")
    }
    def state = loadProperties(new File(attempt, stateName))
    requireProperty(state, 'networkId', restart.getProperty('networkId'), new File(attempt, stateName))
    def tracePattern = ~/AE2F_NATIVE_IDENTITY_BASELINE operation=add-node grid=([0-9a-f]+) service=([0-9a-f]+) node=([0-9a-f]+) restored=(true|false)/
    def prepareTraces = (new File(attempt, prepareName).text =~ tracePattern).collect { it[1..4] }
    def verifyTraces = (new File(attempt, verifyName).text =~ tracePattern).collect { it[1..4] }
    if (prepareTraces.isEmpty() || verifyTraces.isEmpty()
            || prepareTraces.any { it[3] != 'false' } || verifyTraces.any { it[3] != 'true' }
            || prepareTraces[0][0] == verifyTraces[0][0]
            || prepareTraces[0][1] == verifyTraces[0][1]
            || prepareTraces[0][2] == verifyTraces[0][2]) {
        throw new GradleException('Task 4 restart traces do not prove two-process native reconstruction')
    }
}
