def sha256 = { byte[] bytes ->
    MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
}

def runProcessLifecycle = { List<String> command, File directory, File stdout, Number executionTimeout,
        Number shutdownGrace, File isolationExecutable = new File('/usr/bin/setsid') ->
    def executionTimeoutSeconds = executionTimeout.longValue()
    def shutdownGraceSeconds = shutdownGrace.longValue()
    stdout.parentFile.mkdirs()
    if (!isolationExecutable.isFile() || !new File('/proc').isDirectory()) {
        throw new GradleException('Process isolation is unavailable; refusing to launch an unowned child process')
    }
    def ownsProcessGroup = true
    def processCommand = [isolationExecutable.absolutePath, '--wait'] + command
    def builder = new ProcessBuilder(processCommand.collect { it.toString() })
            .directory(directory).redirectErrorStream(true).redirectOutput(stdout)
    builder.environment().put('GIT_MASTER', '1')
    def process = builder.start()
    def ownedDescendants = [:]
    def captureOwnedDescendants = {
        process.toHandle().descendants().forEach { ownedDescendants[it.pid()] = it }
        if (ownsProcessGroup) {
            new File('/proc').listFiles()?.findAll { it.name ==~ /\d+/ }?.each { processDirectory ->
                try {
                    def stat = new File(processDirectory, 'stat').text
                    def fields = stat.substring(stat.lastIndexOf(')') + 2).split(' ')
                    if (fields.length > 2 && fields[2] as long == process.pid()) {
                        def pid = processDirectory.name as long
                        if (pid != process.pid()) {
                            ProcessHandle.of(pid).ifPresent { ownedDescendants[pid] = it }
                        }
                    }
                } catch (IOException | IllegalArgumentException ignored) {}
            }
        }
    }
    def executionDeadline = System.nanoTime() + TimeUnit.SECONDS.toNanos(executionTimeoutSeconds)
    while (process.isAlive() && System.nanoTime() < executionDeadline) {
        captureOwnedDescendants()
        process.waitFor(50, TimeUnit.MILLISECONDS)
    }
    captureOwnedDescendants()
    def executionTimedOut = process.isAlive()
    Integer mainExit = executionTimedOut ? null : process.exitValue()
    def shutdownTimedOut = false
    def survivingDescendants = []
    if (executionTimedOut) {
        ownedDescendants.values().toList().reverseEach { it.destroy() }
        process.destroy()
        process.waitFor(shutdownGraceSeconds, TimeUnit.SECONDS)
    } else if (mainExit == 0) {
        def shutdownDeadline = System.nanoTime() + TimeUnit.SECONDS.toNanos(shutdownGraceSeconds)
        while (ownedDescendants.values().any { it.isAlive() } && System.nanoTime() < shutdownDeadline) {
            TimeUnit.MILLISECONDS.sleep(25)
        }
        survivingDescendants = ownedDescendants.values().findAll { it.isAlive() }.collect { it.pid() }.sort()
        shutdownTimedOut = !survivingDescendants.isEmpty()
    }
    if (process.isAlive()) process.destroyForcibly()
    ownedDescendants.values().findAll { it.isAlive() }.toList().reverseEach { it.destroyForcibly() }
    process.waitFor(shutdownGraceSeconds, TimeUnit.SECONDS)
    def succeeded = !executionTimedOut && !shutdownTimedOut && mainExit == 0
    def effectiveExit = executionTimedOut ? 124 : shutdownTimedOut ? 125 : mainExit
    [exit: effectiveExit, timedOut: executionTimedOut, executionTimedOut: executionTimedOut,
            shutdownTimedOut: shutdownTimedOut, mainExit: mainExit, survivingDescendants: survivingDescendants,
            executionTimeoutSeconds: executionTimeoutSeconds, shutdownGraceSeconds: shutdownGraceSeconds,
            succeeded: succeeded]
}
def runProcess = { List<String> command, File directory, File stdout, long timeoutSeconds ->
    runProcessLifecycle(command, directory, stdout, timeoutSeconds, 10)
}

def parsePositiveInteger = { Object value, String field ->
    def text = value?.toString()
    if (text == null || !(text ==~ /[1-9]\d*/)) throw new GradleException("Invalid positive integer ${field}: ${value}")
    text as long
}

def parseNonnegativeInteger = { Object value, String field ->
    def text = value?.toString()
    if (text == null || !(text ==~ /0|[1-9]\d*/)) throw new GradleException("Invalid nonnegative integer ${field}: ${value}")
    text as long
}

def maxOperationalTimeoutSeconds = TimeUnit.DAYS.toSeconds(7)
def maxShutdownGraceSeconds = 30L
def parseBenchmarkLifecycle = { Object value, String field ->
    if (!(value instanceof Map) || value.keySet() != ['executionTimeoutSeconds', 'shutdownGraceSeconds'] as Set) {
        throw new GradleException("Invalid benchmark lifecycle declaration ${field}")
    }
    if (!(value.executionTimeoutSeconds instanceof Number) || !(value.shutdownGraceSeconds instanceof Number)) {
        throw new GradleException("Invalid benchmark lifecycle declaration ${field}")
    }
    def executionTimeoutSeconds = parsePositiveInteger(value.executionTimeoutSeconds,
            "${field}.executionTimeoutSeconds")
    def shutdownGraceSeconds = parsePositiveInteger(value.shutdownGraceSeconds,
            "${field}.shutdownGraceSeconds")
    if (executionTimeoutSeconds > maxOperationalTimeoutSeconds || shutdownGraceSeconds > maxShutdownGraceSeconds) {
        throw new GradleException("Unreasonably large benchmark lifecycle declaration ${field}")
    }
    [executionTimeoutSeconds: executionTimeoutSeconds, shutdownGraceSeconds: shutdownGraceSeconds]
}
def requireBenchmarkLifecycleMatch = { Object value, Map expected, String field ->
    def actual = parseBenchmarkLifecycle(value, field)
    if (actual != expected) {
        throw new GradleException("Benchmark lifecycle declaration mismatch for ${field}")
    }
    actual
}
def loadBenchmarkLifecycle = { File profileFile ->
    def profile = new JsonSlurper().parse(profileFile) as Map
    parseBenchmarkLifecycle(profile.lifecycle, "profile ${profile.id ?: profileFile.name}")
}
def benchmarkLifecycleForEntry = { Map profile ->
    def declared = parseBenchmarkLifecycle(profile.lifecycle, "manifest profile ${profile.id}")
    if (profile.config != null) {
        def configured = loadBenchmarkLifecycle(rootProject.file(profile.config as String).canonicalFile)
        requireBenchmarkLifecycleMatch(configured, declared, "profile ${profile.id}")
    }
    declared
}

def dirtyIdentityForStatus = { byte[] statusBytes, File sourceRoot ->
    def statusEntries = new String(statusBytes, StandardCharsets.UTF_8).split('\u0000', -1)
    def worktreeIdentity = new StringBuilder()
    for (int index = 0; index < statusEntries.length; index++) {
        def statusLine = statusEntries[index]
        if (statusLine.length() > 3) {
            def destinationPath = statusLine.substring(3)
            worktreeIdentity.append(statusLine).append('\u0000')
            if ((statusLine.startsWith('R') || statusLine.startsWith('C')) && index + 1 < statusEntries.length) {
                worktreeIdentity.append(statusEntries[++index]).append('\u0000')
            }
            def destinationFile = new File(sourceRoot, destinationPath)
            if (destinationFile.isFile()) {
                worktreeIdentity.append(destinationPath).append('=').append(sha256(destinationFile.bytes)).append('\n')
            }
        }
    }
    worktreeIdentity.toString()
}

def currentSourceIdentity = { File outputDir ->
    outputDir.mkdirs()
    def headFile = new File(outputDir, 'source-head.txt')
    def diffFile = new File(outputDir, 'source-diff.patch')
    def statusFile = new File(outputDir, 'source-status.txt')
    if (runProcess(['git', 'rev-parse', 'HEAD'], repositoryDir.asFile, headFile, 20).exit != 0) {
        throw new GradleException('Cannot resolve source revision')
    }
    if (runProcess(['git', 'diff', '--binary', 'HEAD'], repositoryDir.asFile, diffFile, 20).exit != 0) {
        throw new GradleException('Cannot capture dirty diff')
    }
    if (runProcess(['git', 'status', '--porcelain=v1', '-z', '--untracked-files=all', '--', '.',
            ':(exclude).omo/**', ':(exclude)**/build/**',
            ':(exclude)neoforge-1.21.1/run-gametest/**', ':(exclude)neoforge-1.21.1/run-server/**'],
            repositoryDir.asFile, statusFile, 20).exit != 0) {
        throw new GradleException('Cannot capture worktree status')
    }
    def dirtyIdentityFile = new File(outputDir, 'dirty-identity.txt')
    dirtyIdentityFile.text = dirtyIdentityForStatus(statusFile.bytes, repositoryDir.asFile)
    [revision: headFile.text.trim(), dirtySha256: sha256(dirtyIdentityFile.bytes), files: [headFile, diffFile, statusFile, dirtyIdentityFile]]
}
