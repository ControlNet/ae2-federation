            throw new GradleException("Task 20 ${kind} Pattern participation cardinality mismatch")
        }
        def receipts = []
        def laneOwners = [:]
        (0..<256).each { slot ->
            def key = "patterns.${kind}.receipt.${slot.toString().padLeft(3, '0')}"
            def match = metrics[key] =~ /^(\d+),(\d+),(\d+),(\d+),(\d+),(\d+),(\d+),(\d+),(\d+),(.+),(\d+),(\d+),(true|false)$/
