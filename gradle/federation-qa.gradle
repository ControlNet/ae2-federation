    doLast {
        def resultPath = resultFileProperty.orNull
        if (resultPath == null || resultPath.isBlank()) throw new GradleException('Missing -PresultFile')
        def sourceResult = strictCanonicalPath(rootProject.file(resultPath))
        def rebound = { String name, String expectedMessage, String testId, String fact, String value ->
            def rejection = taskFiveEvidenceProbeRejects(sourceResult, "task09-${name}") { attempt, report ->
                def file = new File(attempt, "native-${testId}.properties")
                def properties = loadProperties(file)
                properties.setProperty(fact, value)
                file.withOutputStream { properties.store(it, "Task 9 ${name} probe") }
                def log = new File(attempt, "positive-${testId}.log")
                log.text = log.text.replaceAll(
                        /(AE2F_CRAFT_NATIVE_ENTRY testId=${testId} fact=${fact} value=)[^\s]+/, "\$1${value}")
            }
            rejection instanceof String && rejection.contains(expectedMessage)
        }
        def probes = [
                rebound('duplicate-native-task', 'Task 9 terminal native lifecycle semantics are incomplete',
                        'craftproofnativeterminal', 'uniqueNativeTasks', '2'),
                rebound('duplicate-invocation-submitted', 'Task 9 stocking native lifecycle semantics are incomplete',
                        'craftproofnativestocking', 'duplicateInvocationSubmitted', 'true'),
                rebound('duplicate-native-job-id', 'Task 9 stocking native lifecycle semantics are incomplete',
                        'craftproofnativestocking', 'nativeJobIds',
                        '00000000-0000-4000-8000-000000000001,00000000-0000-4000-8000-000000000002'),
                rebound('missing-provider-dispatch', 'Task 9 terminal native lifecycle semantics are incomplete',
                        'craftproofnativeterminal', 'providerDispatch', 'false'),
                rebound('unaccepted-stocking-result', 'Task 9 stocking native lifecycle semantics are incomplete',
                        'craftproofnativestocking', 'acceptedResult', '0'),
                rebound('missing-material-submitted', 'Task 9 missing-material semantics are incomplete',
                        'craftproofmissingmaterial', 'submitted', 'true'),
                rebound('no-cpu-submitted', 'Task 9 no-CPU semantics are incomplete',
                        'craftproofnocpu', 'submitted', 'true'),
                rebound('restart-link-active', 'Task 9 disconnect/cancel/restart semantics are incomplete',
                        'craftproofdisconnectcancelrestart', 'linkCanceled', 'false'),
                rebound('restart-pre-cancel-extraction-forged',
                        'Task 9 disconnect/cancel/restart semantics are incomplete',
                        'craftproofdisconnectcancelrestart', 'materialBeforeSuspend', '64'),
                rebound('restart-cpu-extraction-forged',
                        'Task 9 disconnect/cancel/restart semantics are incomplete',
                        'craftproofdisconnectcancelrestart', 'cpuMaterialBeforeSuspend', '0'),
                rebound('restart-material-lost', 'Task 9 disconnect/cancel/restart semantics are incomplete',
                        'craftproofdisconnectcancelrestart', 'materialAfterCancel', '0')
        ]
        def missingArtifact = taskFiveEvidenceProbeRejects(sourceResult, 'task09-missing-artifact') { attempt, report ->
            report.artifacts.removeAll { it.path == 'native-craftproofnativestocking.properties' }
        }
        probes.add(missingArtifact instanceof String
                && missingArtifact.contains('Task 9 native artifact set is duplicated, missing, or substituted'))
        if (probes.any { !it }) throw new GradleException('Task 9 adversarial persisted evidence was accepted')
        logger.lifecycle('Task 9 adversarial native Crafting lifecycle evidence probes were rejected for intended reasons')
    }
}

