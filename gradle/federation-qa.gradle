    verifyTaskTwentyOneEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskTwentyTwoEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
