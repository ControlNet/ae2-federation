tasks.register('federationTaskTwentyFiveEvidenceSelfTest') {
    group = 'verification'
    description = 'Rejects fabricated, stale, incomplete, truncated, coupled, and optional-leaking Task 25 evidence.'
    dependsOn(tasks.named('jar'))
    notCompatibleWithConfigurationCache('Copies and fully rebinds persisted Task 25 evidence.')
    doLast {
        def resultPath = resultFileProperty.orNull
        if (resultPath == null || resultPath.isBlank()) throw new GradleException('Missing -PresultFile')
        def sourceResult = strictCanonicalPath(rootProject.file(resultPath))
        def probe = { String name, String expectedMessage, boolean rehash, Closure mutate ->
            def sourceAttempt = sourceResult.parentFile.canonicalFile
            def evidenceRoot = sourceAttempt.parentFile.canonicalFile
            def runId = "task25-${name}-${UUID.randomUUID()}"
            def attempt = new File(evidenceRoot, "attempt-${runId}")
            sourceAttempt.eachFileRecurse(FileType.FILES) { source ->
                def target = attempt.toPath().resolve(sourceAttempt.toPath().relativize(source.toPath()))
                Files.createDirectories(target.parent)
                Files.copy(source.toPath(), target, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
            def resultFile = new File(attempt, 'result.json')
            def report = new JsonSlurper().parse(resultFile) as Map
            mutate(attempt, report)
            report.runId = runId
            report.evidenceRoot = evidenceRoot.canonicalPath
            report.attemptPath = attempt.canonicalPath
            def binding = [evidenceRoot: report.evidenceRoot, attemptPath: report.attemptPath, runId: runId]
            report.pathIdentitySha256 = sha256(JsonOutput.toJson(binding).getBytes(StandardCharsets.UTF_8))
            report.startedAt = Instant.now().minusSeconds(1).toString()
            report.endedAt = Instant.now().toString()
            if (rehash) {
                report.artifacts.each { artifact ->
                    def file = new File(attempt, artifact.path as String)
                    if (file.isFile()) artifact.sha256 = sha256(file.bytes)
                }
            }
            resultFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(report)) + '\n'
            try {
                verifyPersistedReport(resultFile, false)
                false
            } catch (GradleException exception) {
                if (!exception.message.contains(expectedMessage)) throw exception
                true
            } finally {
                if (attempt.exists()) {
                    Files.walk(attempt.toPath()).withCloseable { paths ->
                        paths.sorted(Comparator.reverseOrder()).forEach { Files.deleteIfExists(it) }
                    }
                }
            }
        }
        def mutateFact = { String artifactId, String fact, String value, String expectedMessage ->
            probe("${artifactId}-${fact}", expectedMessage, true) { File attempt, Map report ->
                def file = new File(attempt, "native-${artifactId}.properties")
