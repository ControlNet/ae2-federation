                String comment ->
            return { File attempt, Map report ->
                def file = new File(attempt, 'native-endpointfederated.properties')
                def properties = loadProperties(file)
                def oldValue = properties.getProperty(property)
                properties.setProperty(property, newValue)
                file.withOutputStream { properties.store(it, comment) }
                def log = new File(attempt, 'positive-endpointfederated.log')
                log.text = log.text.replace("fact=${property} value=${oldValue}",
                        "fact=${property} value=${newValue}")
                        .replace("step=${step} fact=${traceFact} value=${oldValue}",
                                "step=${step} fact=${traceFact} value=${newValue}")
            }
        }
        def copyPersistenceFact = { String property, String sourceProperty, String step, String traceFact,
                String comment ->
            return { File attempt, Map report ->
                def file = new File(attempt, 'native-endpointfederated.properties')
                def properties = loadProperties(file)
                def oldValue = properties.getProperty(property)
                def newValue = properties.getProperty(sourceProperty)
                properties.setProperty(property, newValue)
                file.withOutputStream { properties.store(it, comment) }
                def log = new File(attempt, 'positive-endpointfederated.log')
                log.text = log.text.replace("fact=${property} value=${oldValue}",
                        "fact=${property} value=${newValue}")
                        .replace("step=${step} fact=${traceFact} value=${oldValue}",
                                "step=${step} fact=${traceFact} value=${newValue}")
            }
        }
        def setFact = { String artifactId, String fact, String newValue, String comment ->
            return { File attempt, Map report ->
                def file = new File(attempt, "native-${artifactId}.properties")
                def properties = loadProperties(file)
                def oldValue = properties.getProperty(fact)
                properties.setProperty(fact, newValue)
                file.withOutputStream { properties.store(it, comment) }
                def log = new File(attempt, "positive-${artifactId}.log")
                log.text = log.text.replace("fact=${fact} value=${oldValue}", "fact=${fact} value=${newValue}")
            }
        }
        def copyFact = { String artifactId, String targetFact, String sourceFact, String comment ->
            return { File attempt, Map report ->
                def file = new File(attempt, "native-${artifactId}.properties")
                def properties = loadProperties(file)
                def oldValue = properties.getProperty(targetFact)
                def newValue = properties.getProperty(sourceFact)
                properties.setProperty(targetFact, newValue)
                file.withOutputStream { properties.store(it, comment) }
                def log = new File(attempt, "positive-${artifactId}.log")
                log.text = log.text.replace("fact=${targetFact} value=${oldValue}",
                        "fact=${targetFact} value=${newValue}")
            }
        }
        def swapFacts = { String artifactId, String firstFact, String secondFact, String comment ->
            return { File attempt, Map report ->
                def file = new File(attempt, "native-${artifactId}.properties")
                def properties = loadProperties(file)
                def firstValue = properties.getProperty(firstFact)
                def secondValue = properties.getProperty(secondFact)
                properties.setProperty(firstFact, secondValue)
                properties.setProperty(secondFact, firstValue)
                file.withOutputStream { properties.store(it, comment) }
                def log = new File(attempt, "positive-${artifactId}.log")
                def marker = "fact=${firstFact} value=__task18_swap__"
                log.text = log.text.replace("fact=${firstFact} value=${firstValue}", marker)
                        .replace("fact=${secondFact} value=${secondValue}",
                                "fact=${secondFact} value=${firstValue}")
                        .replace(marker, "fact=${firstFact} value=${secondValue}")
            }
        }
        def mutateCount = { Map spec, String variant ->
            return { File attempt, Map report ->
                def file = new File(attempt, "native-${spec.artifact}.properties")
                def properties = loadProperties(file)
                def oldValue = properties.getProperty(spec.property as String)
                def newValue = switch (variant) {
                    case 'malformed' -> 'not-a-count'
                    case 'contradictory' -> oldValue == '0' ? '1' : Long.toString(Long.parseLong(oldValue) + 1)
                    case 'substituted' -> properties.getProperty(spec.substitute as String)
