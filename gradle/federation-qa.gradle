                    || !snapshots[0].contains(' resource=members=2,providers=1,endpoints=1,policies=0,locks=3,tasks=3,flows=0 ')
                    || !deltas.any { it.contains(' resource=members=2,providers=1,endpoints=1,policies=1,') }
