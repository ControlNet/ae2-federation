            def rejection = receipts.findAll { it.type == 'rejection' }
            def opened = receipts.findAll { it.type == 'subscription' && it.event == 'OPENED' }
            def closed = receipts.findAll { it.type == 'subscription' && it.event == 'CLOSED' }
            def snapshots = receipts.findAll { it.type == 'snapshot' }
