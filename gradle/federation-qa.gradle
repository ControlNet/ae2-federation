            }
        }
        def parseReceipt = { String marker, Set fields ->
            def expectedPhase = marker == 'AE2F_AUTOMATION_PREOP_AUTHORITY' ? 'pre-operation' : 'final'
            def lines = logText.readLines().findAll { it.contains("${marker} testId=${testId} ") }
            if (lines.size() != 1) {
                throw new GradleException("Task 28 ${marker} receipt is missing or duplicated: ${testId}")
            }
            def payload = lines.first().substring(lines.first().indexOf(marker + ' ') + marker.length() + 1)
            def receipt = [:]
            payload.split(/\s+/).each { token ->
                def separator = token.indexOf('=')
                if (separator < 1 || receipt.put(token.substring(0, separator), token.substring(separator + 1)) != null) {
                    throw new GradleException("Task 28 malformed or duplicate ${marker} field: ${testId}")
                }
            }
            if (receipt.keySet() != fields || receipt.testId != testId || receipt.selected != testId
                    || receipt.phase != expectedPhase) {
                throw new GradleException("Task 28 ${marker} child identity is invalid: ${testId}")
            }
