                    || !parts[5].contains('minecraft:')
                    || parsePositiveInteger(parts[6], 'Task 30 machine accepted amount')
                            != parsePositiveInteger(parts[7], 'Task 30 machine consumed amount')
                    || parsePositiveInteger(parts[7], 'Task 30 machine consumed amount')
                            != parsePositiveInteger(parts[8], 'Task 30 machine produced amount')) {
                throw new GradleException("Task 30 handler authority receipt mismatch: ${prefix}")
            }
        }
        def stockingOwners = new LinkedHashSet<String>()
        (0..<profile.stockingCycles).each { receiptIndex ->
            def parts = metrics.getProperty("${prefix}.stocking.${receiptIndex}").split('\\|', -1)
            if (parts.size() != 4 || !(parts[0] ==~ /0|[1-9][0-9]*/)
                    || (parts[1] as long) + (parts[2] as long) != (parts[3] as long)) {
                throw new GradleException("Task 30 stocking authority receipt mismatch: ${prefix}")
            }
            stockingOwners.add(parts[0])
        }
        if (stockingOwners.size() != 1) {
            throw new GradleException("Task 30 stocking owner attribution mismatch: ${prefix}")
        }
        if (position > 0) measuredElapsed += numeric("${prefix}.elapsedNanos")
        resources.each { resource ->
            def stem = "${prefix}.resource.${resource}."
            def initial = numeric(stem + 'initial')
            def projectionInserted = numeric(stem + 'projectionInserted')
            def projectionExtracted = numeric(stem + 'projectionExtracted')
            def consumed = numeric(stem + 'handlerConsumed')
            def produced = numeric(stem + 'handlerProduced')
            def finalSource = numeric(stem + 'finalSource')
            if (metrics.getProperty(stem + 'equation') != 'true'
                    || initial + projectionInserted + produced != projectionExtracted + consumed + finalSource) {
                throw new GradleException("Task 30 per-key physical equation mismatch: ${prefix}.${resource}")
            }
        }
        def diamond = "${prefix}.resource.diamond."
        if (numeric(diamond + 'projectionExtracted') != numeric(diamond + 'stockingConsumed')
                + numeric(diamond + 'finalStocked') + numeric(diamond + 'finalExported')
                || numeric(diamond + 'finalStocked') != profile.requested.stockedDiamonds
                || numeric(diamond + 'finalExported') != profile.requested.busDiamonds
                || numeric("${prefix}.resource.emerald.callbackInserted") != profile.requested.emeralds
                || numeric("${prefix}.resource.glass.callbackInserted") != profile.requested.glass) {
            throw new GradleException("Task 30 destination or callback equation mismatch: ${prefix}")
        }
    }
    if (numeric('elapsedNanos') != measuredElapsed
            || numeric('operations') != profile.measuredIterations * (profile.largeBatchCalls + profile.smallBatchCalls)
            || numeric('inserted') != numeric('extracted')) {
        throw new GradleException('Task 30 measured aggregate recomputation mismatch')
    }
}
verifyTaskThirtyNegativeEvidence = { File attempt, List requested, List<String> declaredPaths, Map childExits ->
    if (requested != taskThirtyCases) return
    def taskThirtyUuid = ~/(?i)[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/
    def common = ['schemaVersion', 'status', 'kind', 'testId', 'structure', 'assertions'] as Set
    def expected = [mixedrejectemptyorders: [rejected: 'true', amount: '0', queueGrowth: '0', plannerDelta: '0',
                    trackerCallDelta: '0', nativeSubmissionDelta: '0', projectionCallDelta: '0',
                    projectionQuantityDelta: '0', handlerCallDelta: '0', handlerQuantityDelta: '0',
                    interfaceWorkDelta: '0', busWorkDelta: '0', inFlightDelta: '0', waitingDelta: '0',
                    sourceInventoryDelta: '0', consumerInventoryDelta: '0'],
            mixedoverloadbackpressure: [logicalCompletions: '2', initialDeferred: '1', retries: '1',
                    nativeSubmissions: '2', uniqueJobIds: '2', peakInFlight: '1', hardPeakBound: '1',
                    queueGrowth: '0', silentDrops: '0', resultAccepted: '8', resultPhysical: '8',
                    registryPeak: '1', registryFinal: '0', linkOwnersFinal: '0']]
    expected.each { testId, facts ->
        def name = "native-${testId}.properties"
        if (declaredPaths.count { it == name } != 1 || childExits["positive-${testId}"] != 0) {
            throw new GradleException("Task 30 negative artifact mismatch: ${testId}")
        }
        def properties = new Properties()
        new File(attempt, name).withInputStream { properties.load(it) }
        def dynamicOverload = ['jobIds', 'sourceInitial', 'sourceConsumed', 'sourceFinal', 'completionWindowBound',
                'firstDeferredTick', 'capacityReleaseTick', 'retryTick', 'firstCompletionTick',
                'secondSubmissionTick', 'secondCompletionTick'] as Set
        def expectedFields = common + facts.keySet()
        if (testId == 'mixedoverloadbackpressure') expectedFields += dynamicOverload
        if (properties.keySet() as Set != expectedFields
                || properties.getProperty('schemaVersion') != '1'
                || properties.getProperty('status') != 'passed'
                || properties.getProperty('kind') != 'verify'
                || properties.getProperty('testId') != testId
                || properties.getProperty('structure') != 'ae2federation_test:harness_native_smoke'
                || parsePositiveInteger(properties.getProperty('assertions'), "Task 30 ${testId} assertions")
                        != expectedFields.size() - common.size()) {
            throw new GradleException("Task 30 exact negative schema mismatch: ${testId}")
        }
        facts.each { key, value ->
            if (properties.getProperty(key) != value) {
                throw new GradleException("Task 30 bounded backpressure evidence mismatch: ${testId}.${key}")
            }
        }
        if (testId == 'mixedoverloadbackpressure') {
            def jobs = properties.getProperty('jobIds').split(',', -1) as List
            def firstDeferred = parseNonnegativeInteger(properties.getProperty('firstDeferredTick'),
                    'Task 30 overload first deferred tick')
            def release = parseNonnegativeInteger(properties.getProperty('capacityReleaseTick'),
                    'Task 30 overload capacity release tick')
            def retry = parseNonnegativeInteger(properties.getProperty('retryTick'), 'Task 30 overload retry tick')
            def firstCompletion = parseNonnegativeInteger(properties.getProperty('firstCompletionTick'),
                    'Task 30 overload first completion tick')
            def secondSubmission = parseNonnegativeInteger(properties.getProperty('secondSubmissionTick'),
                    'Task 30 overload second submission tick')
            def secondCompletion = parseNonnegativeInteger(properties.getProperty('secondCompletionTick'),
                    'Task 30 overload second completion tick')
            def completionWindow = parsePositiveInteger(properties.getProperty('completionWindowBound'),
                    'Task 30 overload completion window')
            if (jobs.size() != 2 || jobs.toSet().size() != 2 || jobs.any { !taskThirtyUuid.matcher(it).matches() }
                    || parseNonnegativeInteger(properties.getProperty('sourceInitial'), 'Task 30 overload source initial')
                            != parseNonnegativeInteger(properties.getProperty('sourceConsumed'),
                            'Task 30 overload source consumed')
                            + parseNonnegativeInteger(properties.getProperty('sourceFinal'),
                            'Task 30 overload source final')
                    || firstDeferred > release || release != firstCompletion || retry != release
                    || secondSubmission != retry || secondCompletion < secondSubmission
                    || completionWindow != secondCompletion - firstDeferred || completionWindow > 2000) {
                throw new GradleException('Task 30 overload recovery or physical equation mismatch')
            }
        }
    }
}
verifyPersistedReport = { File resultFile, boolean requireCurrentIdentity ->
    strictCanonicalPath(resultFile)
    if (!resultFile.isFile()) throw new GradleException("Result report does not exist: ${resultFile}")
    def attempt = resultFile.parentFile.canonicalFile
    def report
    try {
        report = new JsonSlurper().parse(resultFile)
    } catch (Exception exception) {
        throw new GradleException("Malformed result report: ${resultFile}", exception)
    }
    if (report.schemaVersion != 3 || report.status != 'complete' || report.parentExit != 0) {
        throw new GradleException('Result report is incomplete or has an unsupported schema')
    }
    validateEvidenceEnvelope(report as Map, attempt)
    def binding = [evidenceRoot: report.evidenceRoot, attemptPath: report.attemptPath, runId: report.runId]
    if (report.pathIdentitySha256 != sha256(JsonOutput.toJson(binding).getBytes(StandardCharsets.UTF_8))) {
        throw new GradleException('Producer path identity hash mismatch')
    }
    if (!(report.kind in ['verify', 'benchmark'])) {
        throw new GradleException('Result run identity does not match its attempt directory')
    }
    def lifecycleManifest = new JsonSlurper().parse(manifestFile.asFile)
    def lifecycleProfiles = lifecycleManifest.profiles.collectEntries { [(it.id): it] }
    def processingLifecycle = benchmarkLifecycleForEntry(lifecycleProfiles['processing-small'] as Map)
    if (!(report.requested instanceof List) || report.requested.isEmpty()
            || report.executed != report.requested || !(report.assertions instanceof List)
            || report.assertions.size() != report.requested.size()
            || report.assertions.any { it.status != 'passed' || !(it.caseId in report.requested) }) {
        throw new GradleException('Requested, executed, or assertion accounting is incomplete')
    }
    def selectedBenchmarkProfile = report.kind == 'benchmark' ? lifecycleProfiles[report.requested.first()] : null
    if (report.kind == 'benchmark' && !(selectedBenchmarkProfile instanceof Map)) {
        throw new GradleException('Persisted benchmark report selected an unknown profile')
    }
    def selectedBenchmarkLifecycle = report.kind == 'benchmark'
            ? benchmarkLifecycleForEntry(selectedBenchmarkProfile as Map) : null
    if (report.kind == 'benchmark') {
        requireBenchmarkLifecycleMatch(report.profileLifecycle, selectedBenchmarkLifecycle,
                'persisted benchmark report')
    }
    if (!(report.childExits instanceof Map) || report.childExits.any { label, exit -> !(exit instanceof Number) }) {
        throw new GradleException('Child exit accounting is malformed')
    }
    if (!(report.childLifecycles instanceof Map)) {
        throw new GradleException('Child process lifecycle accounting is missing')
    }
    if (report.childLifecycles instanceof Map) {
        def taskTwentyLifecycleLabels = [
                'benchmark.reject-empty-work': ['task20-empty-work'],
                'benchmark.resource-accounting': ['task20-accounting', 'task20-adversarial'],
                'benchmark.execution-timeout': ['task20-execution-timeout'],
                'benchmark.shutdown-timeout': ['task20-shutdown-timeout']]
        def expectedChildLabels = report.kind == 'benchmark' ? ['benchmark-gametest'] : []
        report.requested.each { expectedChildLabels.addAll(taskTwentyLifecycleLabels[it] ?: []) }
        def expectedExecutionTimeout = report.requested.contains('benchmark.execution-timeout')
                ? ['task20-execution-timeout'] : []
        def expectedShutdownTimeout = report.requested.contains('benchmark.shutdown-timeout')
                ? ['task20-shutdown-timeout'] : []
        def expectedExecutionDeadlines = ['task20-empty-work': processingLifecycle.executionTimeoutSeconds,
                'task20-accounting': benchmarkOuterTimeoutSeconds(processingLifecycle),
                'task20-adversarial': benchmarkOuterTimeoutSeconds(processingLifecycle),
                'task20-execution-timeout': 1L, 'task20-shutdown-timeout': 5L]
        def expectedShutdownGrace = ['task20-empty-work': processingLifecycle.shutdownGraceSeconds,
                'task20-accounting': processingLifecycle.shutdownGraceSeconds,
                'task20-adversarial': processingLifecycle.shutdownGraceSeconds,
                'task20-execution-timeout': 1L, 'task20-shutdown-timeout': 1L]
        if (report.kind == 'benchmark') {
            expectedExecutionDeadlines['benchmark-gametest'] = selectedBenchmarkLifecycle.executionTimeoutSeconds
            expectedShutdownGrace['benchmark-gametest'] = selectedBenchmarkLifecycle.shutdownGraceSeconds
        }
        if (report.childLifecycles.keySet() != report.childExits.keySet()
                || !report.childLifecycles.keySet().containsAll(expectedChildLabels)
                || report.childLifecycles.any { label, lifecycle ->
                    def executionExpected = label in expectedExecutionTimeout
                    def shutdownExpected = label in expectedShutdownTimeout
                    def lifecycleDeclaration = lifecycle instanceof Map ? parseBenchmarkLifecycle(
                            [executionTimeoutSeconds: lifecycle.executionTimeoutSeconds,
                             shutdownGraceSeconds: lifecycle.shutdownGraceSeconds], "child ${label}") : null
                    def executionDeadline = lifecycleDeclaration?.executionTimeoutSeconds ?: 0
                    def shutdownGrace = lifecycleDeclaration?.shutdownGraceSeconds ?: 0
                    def expectedLifecycle = expectedExecutionDeadlines.containsKey(label)
                            ? [executionTimeoutSeconds: expectedExecutionDeadlines[label],
                               shutdownGraceSeconds: expectedShutdownGrace[label]] : null
                    if (expectedLifecycle != null) {
                        requireBenchmarkLifecycleMatch(
                                [executionTimeoutSeconds: executionDeadline, shutdownGraceSeconds: shutdownGrace],
                                expectedLifecycle, "child ${label}")
                    }
                    !(lifecycle instanceof Map) || lifecycle.executionTimedOut != executionExpected
                            || lifecycle.shutdownTimedOut != shutdownExpected
                            || !(lifecycle.survivingDescendants instanceof List)
                            || lifecycle.survivingDescendants.any { !(it instanceof Number) || it.longValue() <= 0 }
                            || (!shutdownExpected && lifecycle.survivingDescendants != [])
                            || (shutdownExpected && lifecycle.survivingDescendants == [])
                            || (executionExpected && (lifecycle.mainExit != null || report.childExits[label] != 124))
                            || (!executionExpected && !shutdownExpected
                            && lifecycle.mainExit != report.childExits[label])
                            || (shutdownExpected && (lifecycle.mainExit != 0 || report.childExits[label] != 125))
                            || executionDeadline > maxOperationalTimeoutSeconds
                            || shutdownGrace > maxShutdownGraceSeconds
                }) {
            throw new GradleException('Child process lifecycle accounting is malformed or incomplete')
        }
    }
    def nativeAssertions = report.assertions.findAll { it.nativeTestId != null }
    if (report.kind == 'benchmark') {
        if (report.childExits['benchmark-gametest'] != 0 || nativeAssertions.size() != 1) {
            throw new GradleException('Benchmark child exit or native assertion accounting is invalid')
        }
    } else if (nativeAssertions.any { assertion ->
        def positiveExit = report.childExits["positive-${assertion.nativeTestId}"]
        def restartExit = report.childExits['restart-verify']
        positiveExit == null ? restartExit != 0 : positiveExit != 0
    }) {
        throw new GradleException('Positive GameTest child exit is missing or nonzero')
    }
    if (!(report.artifacts instanceof List) || report.artifacts.isEmpty()) {
        throw new GradleException('Result report has no artifacts')
    }
    report.artifacts.each { artifact ->
        if (!(artifact instanceof Map) || !(artifact.path instanceof String) || !(artifact.sha256 instanceof String)) {
            throw new GradleException('Artifact metadata is malformed')
        }
        def file = new File(attempt, artifact.path as String).canonicalFile
        if (!file.toPath().startsWith(attempt.toPath()) || !file.isFile() || sha256(file.bytes) != artifact.sha256) {
            throw new GradleException("Artifact is missing, outside the attempt, or hash-mismatched: ${artifact.path}")
        }
    }
    verifyTaskFourEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskFiveEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskSixEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskSevenEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskEightEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskNineEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskTenEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskElevenEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskTwelveEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskThirteenEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskFourteenEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskSixteenEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskSeventeenEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskEighteenEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
            report.childExits as Map)
    verifyTaskNineteenEvidence(attempt, report.requested as List, report.artifacts.collect { it.path as String },
