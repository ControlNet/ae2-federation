            def large = receipt.schedule < 15
            if (receipt.slot != slot || receipt.revision < 1 || receipt.lane < 0 || receipt.lane >= 15
                    || receipt.planner != 1 || receipt.submitted != 1 || receipt.busy < 1
                    || receipt.input != (large ? 256 : 16) || receipt.completions != 1
                    || receipt.primary != (large ? 64 : 4) || receipt.byproduct != (large ? 32 : 2)
