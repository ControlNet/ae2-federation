    description = 'Proves missing and empty native Grid/node continuity facts fail persisted Task 4 consumption.'
    dependsOn(tasks.named('jar'))
    notCompatibleWithConfigurationCache('Copies and fully rebinds a persisted Task 4 attempt for adversarial probes.')
    doLast {
        def resultPath = resultFileProperty.orNull
        if (resultPath == null || resultPath.isBlank()) throw new GradleException('Missing -PresultFile')
        def sourceResult = strictCanonicalPath(rootProject.file(resultPath))
        def names = ['nativeGridBefore', 'nativeGridAfter', 'nativeNodeBefore', 'nativeNodeAfter']
        def missingRejected = taskFourIdentityFactsProbeRejects(sourceResult, 'missing') { properties ->
            names.each { properties.remove(it) }
        }
        def emptyRejected = taskFourIdentityFactsProbeRejects(sourceResult, 'empty') { properties ->
            names.each { properties.setProperty(it, '') }
        }
        if (!missingRejected || !emptyRejected) {
            throw new GradleException('Missing or empty Task 4 native identity facts were accepted')
        }
        logger.lifecycle('Task 4 native identity fact probes rejected missing and empty paired properties')
    }
}

tasks.register('federationTaskFiveEvidenceSelfTest') {
    group = 'verification'
    description = 'Proves Task 5 topology artifacts and semantics fail closed after full evidence rebinding.'
    dependsOn(tasks.named('jar'))
    notCompatibleWithConfigurationCache('Copies and fully rebinds a persisted Task 5 attempt for adversarial probes.')
    doLast {
        def resultPath = resultFileProperty.orNull
        if (resultPath == null || resultPath.isBlank()) throw new GradleException('Missing -PresultFile')
        def sourceResult = strictCanonicalPath(rootProject.file(resultPath))
        def probes = [
                taskFiveEvidenceProbeRejects(sourceResult, 'missing-artifact') { attempt, report ->
                    new File(attempt, 'native-portshubsixgrids.properties').delete()
                },
                taskFiveEvidenceProbeRejects(sourceResult, 'duplicate-artifact') { attempt, report ->
                    def duplicate = new File(attempt, 'duplicate/native-portshubsixgrids.properties')
                    duplicate.parentFile.mkdirs()
                    duplicate.bytes = new File(attempt, 'native-portshubsixgrids.properties').bytes
                    report.artifacts.add([path: 'duplicate/native-portshubsixgrids.properties', sha256: 'rebound'])
                },
                taskFiveEvidenceProbeRejects(sourceResult, 'substituted-artifact') { attempt, report ->
                    def artifact = report.artifacts.find { it.path == 'native-portshubsixgrids.properties' }
                    artifact.path = 'native-portshubrepeatedgrid.properties'
                },
                taskFiveEvidenceProbeRejects(sourceResult, 'malformed-artifact') { attempt, report ->
                    new File(attempt, 'native-portshubsixgrids.properties').text = '\\u-not-hex'
                },
                taskFiveEvidenceProbeRejects(sourceResult, 'forged-grid-identity') { attempt, report ->
                    def file = new File(attempt, 'native-portshubrepeatedgrid.properties')
                    def properties = loadProperties(file)
                    properties.setProperty('face.south', properties.getProperty('face.east'))
                    file.withOutputStream { properties.store(it, 'Task 5 forged Grid identity probe') }
                },
                taskFiveEvidenceProbeRejects(sourceResult, 'distinct-grid-substitution') { attempt, report ->
                    def file = new File(attempt, 'native-portshubsixgrids.properties')
                    def properties = loadProperties(file)
                    def existing = ['down', 'up', 'north', 'south', 'west', 'east']
                            .collect { properties.getProperty("face.${it}") } as Set
                    def replacement = (4_000_000_000L..4_000_000_010L).find { !existing.contains(it.toString()) }
                    properties.setProperty('face.east', replacement.toString())
                    file.withOutputStream { properties.store(it, 'Task 5 distinct Grid substitution probe') }
                },
                taskFiveEvidenceProbeRejects(sourceResult, 'floating-accepted') { attempt, report ->
                    def file = new File(attempt, 'native-portsrejectfloatingnode.properties')
                    def properties = loadProperties(file)
                    properties.setProperty('floatingAccepted', 'true')
                    file.withOutputStream { properties.store(it, 'Task 5 floating acceptance probe') }
                },
                taskFiveEvidenceProbeRejects(sourceResult, 'replaced-accepted') { attempt, report ->
                    def file = new File(attempt, 'native-portsrejectfloatingnode.properties')
                    def properties = loadProperties(file)
                    properties.setProperty('replacedAccepted', 'true')
                    file.withOutputStream { properties.store(it, 'Task 5 replacement acceptance probe') }
                },
                taskFiveEvidenceProbeRejects(sourceResult, 'cross-grid-accepted') { attempt, report ->
                    def file = new File(attempt, 'native-portsrejectcrossgridjoin.properties')
                    def properties = loadProperties(file)
                    properties.setProperty('joinAccepted', 'true')
                    file.withOutputStream { properties.store(it, 'Task 5 cross-grid acceptance probe') }
                }
        ]
        if (probes.any { !it }) throw new GradleException('Task 5 adversarial persisted evidence was accepted')
        logger.lifecycle('Task 5 adversarial topology evidence probes were rejected')
    }
}

tasks.register('federationTaskTwentyProjectionMutationContract') {
    group = 'verification'
    description = 'Proves fully rebound Task 20 lifecycle and profile projection contradictions fail closed.'
    doLast {
        def resultPath = resultFileProperty.orNull
        if (resultPath == null || resultPath.isBlank()) throw new GradleException('Missing -PresultFile')
        def sourceResult = strictCanonicalPath(rootProject.file(resultPath))
        def rejections = [
                assertionLifecycle: taskFiveEvidenceProbeRejects(sourceResult,
                        'task20-contract-assertion-lifecycle') { attempt, report ->
                    report.assertions[0].lifecycle.executionTimeoutSeconds = 299
                },
                topLevelProfile: taskFiveEvidenceProbeRejects(sourceResult,
                        'task20-contract-top-level-profile') { attempt, report ->
                    report.profile.profileVersion = 'contradictory-profile'
                }]
        def accepted = rejections.findAll { name, rejection -> !(rejection instanceof String) }.keySet()
        if (!accepted.isEmpty()) {
            throw new GradleException("Task 20 fully rebound projection mutations were accepted: ${accepted}")
        }
        logger.lifecycle('Task 20 fully rebound projection mutation contract passed')
    }
}

tasks.register('federationTaskTwentyEvidenceSelfTest') {
    group = 'verification'
    description = 'Proves Task 20 benchmark identity, accounting, and timing-only evidence fails closed.'
    dependsOn(tasks.named('jar'))
    notCompatibleWithConfigurationCache('Copies and fully rebinds persisted Task 20 evidence for adversarial probes.')
    doLast {
        def resultPath = resultFileProperty.orNull
        if (resultPath == null || resultPath.isBlank()) throw new GradleException('Missing -PresultFile')
        def sourceResult = strictCanonicalPath(rootProject.file(resultPath))
        def processingLifecycle = loadBenchmarkLifecycle(
                rootProject.file('tests/benchmarks/processing/processing-small.json'))
        def mutateMetrics = { String name, Closure mutate ->
            taskFiveEvidenceProbeRejects(sourceResult, "task20-${name}") { attempt, report ->
                def file = new File(attempt, 'benchmark-native.properties')
                def metrics = loadTaskTwentyMetrics(file)
                mutate(metrics, file, report)
                if (file.isFile() && !name.startsWith('duplicate')) {
                    file.text = metrics.collect { key, value -> "${key}=${value}" }.join('\n') + '\n'
                }
            }
        }
        def mutateJson = { String name, String artifact, Closure mutate ->
            taskFiveEvidenceProbeRejects(sourceResult, "task20-${name}") { attempt, report ->
                def file = new File(attempt, artifact)
                def value = new JsonSlurper().parse(file)
                mutate(value, report)
                file.text = JsonOutput.prettyPrint(JsonOutput.toJson(value)) + '\n'
            }
        }
        def mutateCohort = { String name, int cohortId, String expected, Closure mutate ->
            taskSevenEvidenceProbeRejects(sourceResult, "task20-${name}", expected) { attempt, report ->
                def file = new File(attempt, 'benchmark-native.properties')
                def metrics = loadTaskTwentyMetrics(file)
                def parts = metrics["tS06.cohort.${cohortId}"].split('\\|', -1)
                mutate(parts, metrics)
                metrics["tS06.cohort.${cohortId}"] = parts.join('|')
                file.text = metrics.collect { key, value -> "${key}=${value}" }.join('\n') + '\n'
            }
        }
        def recomputeRuntimeDigest = { Map metrics, String kind ->
            def receipts = (0..<256).collect { slot ->
                metrics["patterns.${kind}.receipt.${slot.toString().padLeft(3, '0')}"]
            }.sort { left, right ->
                (left.substring(0, left.indexOf(',')) as int) <=> (right.substring(0, right.indexOf(',')) as int)
            }
            metrics["patterns.${kind}.runtimeScheduleDigest"] =
                    sha256(receipts.join(';').getBytes(StandardCharsets.UTF_8))
        }
        def probes = [
                mutateMetrics('missing-metric') { metrics, file, report -> metrics.remove('native.acceptedInput') },
                mutateMetrics('extra-metric') { metrics, file, report -> metrics['native.fabricated'] = '1' },
                taskFiveEvidenceProbeRejects(sourceResult, 'task20-duplicate-metric') { attempt, report ->
                    def file = new File(attempt, 'benchmark-native.properties')
                    file.append('native.acceptedInput=3\n')
                },
                mutateMetrics('wrong-seed') { metrics, file, report -> metrics.seed = '20019007' },
                mutateMetrics('wrong-profile') { metrics, file, report -> metrics.profileVersion = 'processing-small-v2' },
                mutateMetrics('unequal-scenes') { metrics, file, report -> metrics['federation.routes'] = '2' },
                mutateMetrics('starting-input') { metrics, file, report -> metrics['native.startingInput'] = '3840' },
                mutateMetrics('offered-input') { metrics, file, report -> metrics['native.offeredInput'] = '4095' },
                mutateMetrics('fabricated-input') { metrics, file, report -> metrics['native.acceptedInput'] = '4' },
                mutateMetrics('final-input-inventory') { metrics, file, report ->
                    metrics['native.finalInputInventory'] = '0'
                },
                mutateMetrics('fabricated-output') { metrics, file, report -> metrics['native.deliveredPrimary'] = '13' },
                mutateMetrics('retained-responsibility') { metrics, file, report -> metrics['native.finalRetained'] = '1' },
                mutateMetrics('unreconciled-run') { metrics, file, report -> metrics['reconciliation.currentRun'] = 'false' },
                mutateMetrics('timing-promoted') { metrics, file, report -> metrics['timing.classification'] = 'correctness' },
                mutateMetrics('unequal-ts04-volume') { metrics, file, report -> metrics['tS04.small.inputVolume'] = '3839' },
                mutateMetrics('forged-pattern-slot') { metrics, file, report ->
                    def receipt = metrics['patterns.native.receipt.000']
                    def firstComma = receipt.indexOf(',')
                    def secondComma = receipt.indexOf(',', firstComma + 1)
                    metrics['patterns.native.receipt.000'] = receipt.substring(0, firstComma + 1)
                            .concat('1').concat(receipt.substring(secondComma))
                    def receipts = (0..<256).collect { slot ->
                        metrics["patterns.native.receipt.${slot.toString().padLeft(3, '0')}"]
                    }.sort { left, right ->
                        (left.substring(0, left.indexOf(',')) as int) <=> (right.substring(0, right.indexOf(',')) as int)
                    }
                    metrics['patterns.native.runtimeScheduleDigest'] = sha256(
                            receipts.join(';').getBytes(StandardCharsets.UTF_8))
                },
                mutateMetrics('split-runtime-topology') { metrics, file, report ->
                    metrics['runtime.federation.small.topologyDigest'] = '0' * 64
                },
                mutateMetrics('unfair-ts06-cohort') { metrics, file, report ->
                    def parts = metrics['tS06.cohort.0'].split('\\|', -1)
                    def values = parts[4].split(',', -1)
                    values[17] = '2'
                    parts[4] = values.join(',')
                    metrics['tS06.cohort.0'] = parts.join('|')
                },
                mutateMetrics('reused-ts06-endpoint') { metrics, file, report ->
                    def parts = metrics['tS06.cohort.0'].split('\\|', -1)
                    def endpoint = parts[2].substring(0, parts[2].indexOf(','))
                    parts[2] = [endpoint, endpoint, endpoint].join(',')
                    metrics['tS06.cohort.0'] = parts.join('|')
                },
                mutateMetrics('invented-retry-scheduler') { metrics, file, report ->
                    metrics['tS06.retrySchedulerPresent'] = 'true'
                },
                mutateJson('stale-baseline', 'benchmark-baseline.json') { baseline, report ->
                    baseline.captureIdentitySha256 = '0' * 64
                },
                mutateJson('altered-budget', 'benchmark-budgets.json') { budgets, report ->
                    budgets.maxNativeRemainder = 1
                },
                taskFiveEvidenceProbeRejects(sourceResult, 'task20-report-projection') { attempt, report ->
                    report.assertions[0].metrics['native.acceptedInput'] = '4'
                },
                taskFiveEvidenceProbeRejects(sourceResult, 'task20-assertion-lifecycle-projection') {
                    attempt, report -> report.assertions[0].lifecycle.executionTimeoutSeconds = 299
                },
                taskFiveEvidenceProbeRejects(sourceResult, 'task20-top-level-profile-projection') {
                    attempt, report -> report.profile.profileVersion = 'contradictory-profile'
                },
                taskFiveEvidenceProbeRejects(sourceResult, 'task20-lifecycle-collection-missing') {
                    attempt, report -> report.remove('childLifecycles')
                },
                taskFiveEvidenceProbeRejects(sourceResult, 'task20-lifecycle-entry-missing') { attempt, report ->
                    report.childLifecycles.remove('benchmark-gametest')
                },
                taskFiveEvidenceProbeRejects(sourceResult, 'task20-lifecycle-deadline-zero') { attempt, report ->
                    report.childLifecycles['benchmark-gametest'].executionTimeoutSeconds = 0
                },
                taskFiveEvidenceProbeRejects(sourceResult, 'task20-lifecycle-deadline-wrong') { attempt, report ->
                    report.childLifecycles['benchmark-gametest'].executionTimeoutSeconds = 181
                },
                taskFiveEvidenceProbeRejects(sourceResult, 'task20-lifecycle-grace-zero') { attempt, report ->
                    report.childLifecycles['benchmark-gametest'].shutdownGraceSeconds = 0
                },
                taskFiveEvidenceProbeRejects(sourceResult, 'task20-lifecycle-grace-unbounded') { attempt, report ->
                    report.childLifecycles['benchmark-gametest'].shutdownGraceSeconds = 31
                }
        ]
        def expectedExisting = ['metric schema is missing or extra', 'metric schema is missing or extra',
                'duplicate metric', 'alternate seed is producer-only', 'identity or top-level accounting mismatch',
                'resource reconciliation mismatch', 'resource reconciliation mismatch',
                'resource reconciliation mismatch', 'resource reconciliation mismatch',
                'resource reconciliation mismatch', 'resource reconciliation mismatch',
                'resource reconciliation mismatch',
                'identity or top-level accounting mismatch', 'identity or top-level accounting mismatch',
                'T-S04 equal-volume mismatch', 'violates runtime participation', 'runtime identity mismatch',
                'fairness or backpressure mismatch', 'fairness or backpressure mismatch',
                'fairness or backpressure mismatch', 'capture identity is stale', 'capture identity is stale',
                'report projection mismatch', 'report projection mismatch', 'report projection mismatch',
                'lifecycle accounting is missing',
                'lifecycle accounting is malformed or incomplete', 'Invalid positive integer',
                'Benchmark lifecycle declaration mismatch', 'Invalid positive integer',
                'Unreasonably large benchmark lifecycle declaration']
        def acceptedProbe = probes.findIndexOf { probe ->
            def index = probes.indexOf(probe)
            !(probe instanceof String) || !probe.contains(expectedExisting[index])
        }
        if (acceptedProbe >= 0) {
            throw new GradleException("Task 20 adversarial benchmark evidence probe ${acceptedProbe} was accepted")
        }
        def extendedProbes = [
                taskSevenEvidenceProbeRejects(sourceResult, 'task20-pattern-omission',
                        'metric schema is missing or extra') { attempt, report ->
                    def file = new File(attempt, 'benchmark-native.properties')
                    def metrics = loadTaskTwentyMetrics(file)
                    metrics.remove('patterns.native.receipt.000')
                    file.text = metrics.collect { key, value -> "${key}=${value}" }.join('\n') + '\n'
                },
                taskSevenEvidenceProbeRejects(sourceResult, 'task20-pattern-duplicate', 'duplicate metric') {
                    attempt, report -> new File(attempt, 'benchmark-native.properties')
                            .append('patterns.native.receipt.000=duplicate\n')
                },
                mutateMetrics('registered-unused-pattern') { metrics, file, report ->
                    def fields = metrics['patterns.native.receipt.000'].split(',', -1)
                    fields[4] = '0'
                    metrics['patterns.native.receipt.000'] = fields.join(',')
                    recomputeRuntimeDigest(metrics, 'native')
                }.contains('violates runtime participation'),
                mutateMetrics('marker-only-participation') { metrics, file, report ->
                    def fields = metrics['patterns.native.receipt.001'].split(',', -1)
                    fields[8] = '0'
                    metrics['patterns.native.receipt.001'] = fields.join(',')
                    recomputeRuntimeDigest(metrics, 'native')
                }.contains('violates runtime participation'),
                mutateMetrics('metadata-only-seed') { metrics, file, report ->
                    metrics['runtime.native.large.topologyDigest'] = '0' * 64
                    metrics['runtime.native.small.topologyDigest'] = '0' * 64
                }.contains('seed-authoritative topology mismatch'),
                mutateMetrics('fixed-alternate-schedule') { metrics, file, report -> metrics.seed = '20019007' }
                        .contains('alternate seed is producer-only'),
                {
                    def runtimeEvidence = new File(temporaryDir, 'alternate-seed-runtime')
                    def runtimeLog = new File(temporaryDir, 'alternate-seed-runtime.log')
                    runtimeEvidence.deleteDir()
                    try {
                        def execution = runProcess([rootProject.file('gradlew').canonicalPath,
                                ':neoforge-1.21.1:federationBenchmark', '-Pprofile=processing-small',
                                '-PprocessingBenchmarkSeed=20019007', "-PevidenceDir=${runtimeEvidence.absolutePath}",
                                '--no-daemon', '--no-configuration-cache'], rootProject.projectDir, runtimeLog,
                                benchmarkOuterTimeoutSeconds(processingLifecycle))
                        if (execution.exit != 0 || execution.timedOut) {
                            throw new GradleException('Task 20 alternate-seed runtime producer mutation failed')
                        }
                        def attempts = runtimeEvidence.listFiles()?.findAll { it.isDirectory() && it.name.startsWith('attempt-') }
                        def result = new File(attempts.max { it.name }, 'result.json')
                        try {
                            verifyPersistedReport(result, false)
                            false
                        } catch (GradleException exception) {
                            exception.message.contains('alternate seed is producer-only')
                        }
                    } finally {
                        runtimeEvidence.deleteDir()
                    }
                }(),
                mutateMetrics('cohort-omission') { metrics, file, report -> metrics.remove('tS06.cohort.2') }
                        .contains('metric schema is missing or extra'),
                taskSevenEvidenceProbeRejects(sourceResult, 'task20-cohort-duplicate', 'duplicate metric') {
                    attempt, report -> new File(attempt, 'benchmark-native.properties')
                            .append('tS06.cohort.2=duplicate\n')
                },
                taskSevenEvidenceProbeRejects(sourceResult, 'task20-cohort-reorder', 'cohort 0 shape mismatch') {
                    attempt, report ->
                        def file = new File(attempt, 'benchmark-native.properties')
                        def metrics = loadTaskTwentyMetrics(file)
                        def first = metrics['tS06.cohort.0']
                        metrics['tS06.cohort.0'] = metrics['tS06.cohort.1']
                        metrics['tS06.cohort.1'] = first
                        file.text = metrics.collect { key, value -> "${key}=${value}" }.join('\n') + '\n'
                },
                mutateCohort('cohort-overlap', 1, 'cohorts are not independently identified') { parts, metrics ->
                    parts[2] = (metrics['tS06.cohort.0'].split('\\|', -1)[2].split(',', -1)[0]
                            + ',' + parts[2].split(',', -1).drop(1).join(','))
                },
                mutateCohort('cohort-wrong-size', 2, 'fairness or backpressure mismatch') { parts, metrics ->
                    parts[2] = parts[2].split(',', -1).take(2).join(',')
                },
                mutateCohort('cohort-wrong-identity', 2, 'fairness or backpressure mismatch') { parts, metrics ->
                    parts[2] = ',' + parts[2].split(',', -1).drop(1).join(',')
                },
                mutateCohort('cohort-wrong-type', 3, 'cohort 3 shape mismatch') { parts, metrics ->
                    parts[1] = 'busy'
                },
                mutateCohort('cohort-ineligible-completion', 4, 'eligible scenario equation mismatch') {
                    parts, metrics -> def values = parts[4].split(',', -1); values[16] = '2'; parts[4] = values.join(',')
                },
                mutateCohort('cohort-fabricated-fairness', 4, 'eligible scenario equation mismatch') {
                    parts, metrics -> def values = parts[4].split(',', -1); values[17] = '1'; parts[4] = values.join(',')
                },
                mutateCohort('cohort-fabricated-starvation', 4, 'eligible scenario equation mismatch') {
                    parts, metrics -> def values = parts[4].split(',', -1); values[18] = '0'; parts[4] = values.join(',')
                },
                mutateCohort('cohort-fabricated-bounds', 4, 'fairness or backpressure mismatch') {
                    parts, metrics -> def values = parts[4].split(',', -1); values[9] = '97'; parts[4] = values.join(',')
                },
                mutateMetrics('lane-owner-swap') { metrics, file, report ->
                    metrics['patterns.federation.receipt.000'] = metrics['patterns.federation.receipt.000']
                            .replaceFirst(/laneIndex=\d+/, 'laneIndex=99')
                    recomputeRuntimeDigest(metrics, 'federation')
                }.contains('violates runtime participation'),
                mutateMetrics('lane-stale-generation') { metrics, file, report ->
                    metrics['patterns.federation.receipt.000'] = metrics['patterns.federation.receipt.000']
                            .replace('modeGeneration=1]', 'modeGeneration=2]')
                    recomputeRuntimeDigest(metrics, 'federation')
                }.contains('Lane ownership mismatch'),
                mutateMetrics('unequal-workload') { metrics, file, report ->
                    metrics['federation.acceptedInput'] = '3839'
                }.contains('resource reconciliation mismatch'),
                mutateMetrics('broken-ts04-totals') { metrics, file, report ->
                    metrics['tS04.large.inputVolume'] = '3839'
                }.contains('T-S04 equal-volume mismatch'),
                mutateJson('loosened-budget', 'benchmark-budgets.json') { budgets, report ->
                    budgets.maxReturnRetriesPerScene = 211
                }.contains('capture identity is stale'),
                taskSevenEvidenceProbeRejects(sourceResult, 'task20-cleanup-omission',
                        'Artifact is missing, outside the attempt, or hash-mismatched') { attempt, report ->
                    new File(attempt, 'cleanup-receipt.txt').delete()
                },
                taskSevenEvidenceProbeRejects(sourceResult, 'task20-cleanup-replacement', 'cleanup receipt mismatch') {
                    attempt, report -> new File(attempt, 'cleanup-receipt.txt').text = 'fabricated cleanup\n'
                }
        ]
        if (extendedProbes.any { it != true }) {
            throw new GradleException('Task 20 complete semantic adversarial matrix was accepted')
        }
        logger.lifecycle("Task 20 ${probes.size() + extendedProbes.size()} fully rebound semantic probes were rejected")
    }
}

