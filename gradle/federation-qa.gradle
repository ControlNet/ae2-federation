                throw new GradleException('Task 32 cross-Fabric authority is not backed by production subscription lifecycle')
            }
            def snapshotA = snapshots.find { matchesAuthority(it, authorityA) }
            def snapshotB = snapshots.find { matchesAuthority(it, authorityB) }
            def expectedRejectionFacts = 'rejected=true,valueStable=true,bytesStable=true,serverAStable=true,' +
                    'serverBStable=true,reboundAbsent=true,subscriptionsStable=true,removalsStable=true,' +
                    'policyStable=true,topologyStable=true'
            if (snapshotA.resource != 'members=2,providers=1,endpoints=1,policies=1,locks=3,tasks=3,flows=2'
                    || snapshotB.resource != 'members=2,providers=0,endpoints=0,policies=0,locks=0,tasks=0,flows=0'
                    || !matchesAuthority(rejection[0], authorityA) || rejection[0].event != 'rejected'
                    || rejection[0].value != '2' || rejection[0].secondary != '0'
                    || rejection[0].resource != expectedRejectionFacts
                    || rejection[0].attribution != authorityB.event || rejection[0].exactBatch != 'false') {
                throw new GradleException('Task 32 cross-Fabric encoded rejection or zero-mutation receipt is invalid')
            }
        }
    }
