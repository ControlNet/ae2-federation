name: Newest modpacks

# Each modpack profile on its pack's newest CurseForge release instead of its pin (tools/compat_run.py --latest), weekly
# and on demand. Kept apart from Compatibility so that a modpack update shows as its own red run, not as a regression in
# the pinned profiles. It only reports what it tested against the pin; it never changes pins, and it caches nothing.
# Each server's start accepts the Minecraft EULA (https://aka.ms/MinecraftEULA) for these test runs.
# Third-party files are never uploaded as artifacts; only logs and reports are.

on:
  schedule:
    - cron: '41 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latest-modpacks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      profiles: ${{ steps.plan.outputs.profiles }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: List the modpack profiles
        id: plan
        run: echo "profiles=$(python3 tools/compat_run.py --list --json --group modpacks)" >> "$GITHUB_OUTPUT"
      - name: Build AE2 Federation and the compatibility test mod
        run: ./gradlew :neoforge-1.21.1:jar :neoforge-1.21.1:compatTestJar --dependency-verification=strict --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: federation-jars
          path: |
            neoforge-1.21.1/build/libs/ae2federation-*.jar
            !neoforge-1.21.1/build/libs/*-sources.jar
            neoforge-1.21.1/build/compat/ae2federation-compat-tests-*.jar
          if-no-files-found: error
          retention-days: 1

  # The pack is downloaded fresh each time and never cached: the repository's Actions cache is full, and a server pack
  # is up to 1.2 GB.
  latest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.build.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v7
      - name: Compare ${{ matrix.profile }} with its newest release
        id: resolve
        run: |
          python3 tools/compat_run.py latest ${{ matrix.profile }} --json | tee latest.json
          # A lookup that failed counts as outdated, so the run step below records the error in the summary.
          python3 -c 'import json; print("outdated=" + str(json.load(open("latest.json"))[0].get("outdated", True)).lower())' >> "$GITHUB_OUTPUT"
      # The zip and the unpacked pack sit side by side until extraction ends, beside a NeoForge install and the world.
      - name: Free disk space
        if: steps.resolve.outputs.outdated == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@v6
        if: steps.resolve.outputs.outdated == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v8
        if: steps.resolve.outputs.outdated == 'true'
        with:
          name: federation-jars
          path: neoforge-1.21.1/build
      # When the pin is the newest release this only records that, for the summary, and starts no server.
      - name: Run ${{ matrix.profile }} on its newest release
        run: python3 tools/compat_run.py --accept-eula --no-build --latest ${{ matrix.profile }} --summary results/summary-latest-${{ matrix.profile }}.json
      - name: Retain logs and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compat-latest-${{ matrix.profile }}
          path: |
            results/
            neoforge-1.21.1/build/compat/runs/*/server-console.log
            neoforge-1.21.1/build/compat/runs/*/compat-report.json
            neoforge-1.21.1/build/compat/runs/*/logs/latest.log
            neoforge-1.21.1/build/compat/runs/*/crash-reports/
          if-no-files-found: ignore
          retention-days: 14

  summary:
    needs: latest
    if: always() && needs.latest.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: compat-latest-*
          path: results
      - name: Results table
        run: python3 tools/compat_run.py report results >> "$GITHUB_STEP_SUMMARY"
