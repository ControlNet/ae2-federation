name: Optional compatibility and artifact qualification

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 0'

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Strict build and archive checks
        run: ./gradlew :neoforge-1.21.1:check :neoforge-1.21.1:build --dependency-verification=strict --no-configuration-cache
      - name: Artifact negatives and isolated reproducibility
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_artifact_verify.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 tools/artifact_verify.py clean-build --report .omo/evidence/task-39-ci/clean-build.json
      - name: Every required manifest GameTest (exact selected count)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B tools/required_gametests.py
      - name: Pinned compatibility matrix
        run: ./gradlew :neoforge-1.21.1:federationVerify -Pcases=compat.native-differential,compat.provider-hooks,compat.real-tech-line,compat.optional-absent,compat.reject-unsupported -PevidenceDir=.omo/evidence/task-36-ci --dependency-verification=strict --no-configuration-cache
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-diagnostics
          path: |
            gametest.log
            .omo/evidence/task-39-ci/
            .omo/evidence/task-36-ci/
          if-no-files-found: ignore
