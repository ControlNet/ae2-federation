name: Playthrough

# The NAST modpack playthrough regressions (docs/compatibility/modpack-playthrough.md) on every push: the 8-item
# machine regression once per machine path, and the default topology matrix. About 3 minutes with a warm cache.
# Each server's start accepts the Minecraft EULA (https://aka.ms/MinecraftEULA) for these test runs.
# Third-party jars are cached for this repository's runs only and never uploaded as artifacts; only logs and reports are.

on:
  push:
    branches-ignore: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playthrough-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Build AE2 Federation and the compatibility test mod
        run: ./gradlew :neoforge-1.21.1:jar :neoforge-1.21.1:compatTestJar --dependency-verification=strict --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: federation-jars
          path: |
            neoforge-1.21.1/build/libs/ae2federation-*.jar
            !neoforge-1.21.1/build/libs/*-sources.jar
            neoforge-1.21.1/build/compat/ae2federation-compat-tests-*.jar
          if-no-files-found: error
          retention-days: 1

  regression:
    needs: build
    name: regression (${{ matrix.machinePath }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        machinePath: [projection, endpoint]
    env:
      RUN_DIR: neoforge-1.21.1/build/compat/runs/nast-machines-${{ matrix.machinePath }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v8
        with:
          name: federation-jars
          path: neoforge-1.21.1/build
      # Same key and contents as compat.yml's nast cache. Saved even when the run fails, so a second run is warm.
      - uses: actions/cache/restore@v5
        id: cache
        with:
          path: ~/.cache/ae2federation-compat
          key: compat-nast-${{ hashFiles('tests/compat/mods.json', 'tests/compat/profiles/nast.json') }}
      - name: Install NeoForge and unpack the NAST pack
        run: |
          python3 -c 'import sys; sys.path.insert(0, "tools"); import compat_run as c
          profile = c.load_profiles()["nast"]; c.neoforge_server(profile["neoforge"]); c.unpack_pack(profile["pack"])'
      - name: Run the 8-item machine regression (${{ matrix.machinePath }})
        run: |
          python3 tools/compat_run.py --accept-eula --no-build --tests playthroughCrafting --run-suffix machines-${{ matrix.machinePath }} \
            --jvm-property ae2federation.playthrough.chapter= \
            --jvm-property ae2federation.playthrough.maxTargets=0 \
            --jvm-property ae2federation.playthrough.machinePath=${{ matrix.machinePath }} \
            --jvm-property ae2federation.playthrough.items=industrialforegoing:plastic,bigreactors:graphite_ingot,enderio:conduit_binder,laserio:logic_chip,ae2:logic_processor,ae2:engineering_processor,ae2:calculation_processor,ae2:charged_certus_quartz_crystal \
            --summary results/summary-machines-${{ matrix.machinePath }}.json nast
      - name: Check 8 both-pass with observed machine runs
        env:
          MACHINE_PATH: ${{ matrix.machinePath }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          run = os.environ["RUN_DIR"]
          crafting = json.load(open(f"{run}/playthrough-crafting.json"))
          machines = json.load(open(f"{run}/playthrough-machines.json"))
          errors = []
          if not crafting["completed"] or crafting["harnessError"]:
              errors.append(f"incomplete: completed={crafting['completed']} harnessError={crafting['harnessError']!r}")
          if crafting["completedTargetCount"] != 8 or crafting["overall"]["both-pass"] != 8:
              errors.append(f"expected 8 both-pass of 8, got {crafting['completedTargetCount']} targets: {crafting['overall']}")
          if machines["machinePath"] != os.environ["MACHINE_PATH"]:
              errors.append(f"machinePath {machines['machinePath']}")
          for target in machines["targets"]:
              if not target["realMachineSteps"]:
                  errors.append(f"{target['item']}: no observed machine run")
          print(json.dumps(crafting["overall"]))
          print("\n".join(errors) or "8 both-pass, every target with an observed machine run")
          sys.exit(1 if errors else 0)
          EOF
      - name: Keep the extracted pack, not its zip, in the cache
        if: always()
        run: find ~/.cache/ae2federation-compat/downloads -name '*.zip' -delete || true
      - uses: actions/cache/save@v5
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ae2federation-compat
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Retain logs and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playthrough-machines-${{ matrix.machinePath }}
          path: |
            results/
            ${{ env.RUN_DIR }}/playthrough-*.json
            ${{ env.RUN_DIR }}/playthrough-*.md
            ${{ env.RUN_DIR }}/compat-report.json
            ${{ env.RUN_DIR }}/server-console.log
            ${{ env.RUN_DIR }}/logs/latest.log
            ${{ env.RUN_DIR }}/crash-reports/
          if-no-files-found: ignore
          retention-days: 14

  topology:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUN_DIR: neoforge-1.21.1/build/compat/runs/nast-topology
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v8
        with:
          name: federation-jars
          path: neoforge-1.21.1/build
      - uses: actions/cache/restore@v5
        id: cache
        with:
          path: ~/.cache/ae2federation-compat
          key: compat-nast-${{ hashFiles('tests/compat/mods.json', 'tests/compat/profiles/nast.json') }}
      - name: Install NeoForge and unpack the NAST pack
        run: |
          python3 -c 'import sys; sys.path.insert(0, "tools"); import compat_run as c
          profile = c.load_profiles()["nast"]; c.neoforge_server(profile["neoforge"]); c.unpack_pack(profile["pack"])'
      - name: Run the default topology matrix
        run: |
          python3 tools/compat_run.py --accept-eula --no-build --tests playthroughTopology --run-suffix topology \
            --summary results/summary-topology.json nast
      - name: Check 108 both-pass and 3 expected-refusal
        run: |
          python3 - <<'EOF'
          import collections, json, os, sys
          report = json.load(open(f"{os.environ['RUN_DIR']}/playthrough-topology.json"))
          counts = collections.Counter(case["classification"] for case in report["cases"])
          print(dict(counts))
          errors = []
          if not report["completed"] or report["harnessError"]:
              errors.append(f"incomplete: completed={report['completed']} harnessError={report['harnessError']!r}")
          if counts != {"both-pass": 108, "expected-refusal": 3}:
              errors.append("expected 108 both-pass and 3 expected-refusal")
          print("\n".join(errors) or "108 both-pass, 3 expected-refusal")
          sys.exit(1 if errors else 0)
          EOF
      - name: Keep the extracted pack, not its zip, in the cache
        if: always()
        run: find ~/.cache/ae2federation-compat/downloads -name '*.zip' -delete || true
      - uses: actions/cache/save@v5
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ae2federation-compat
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Retain logs and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playthrough-topology
          path: |
            results/
            ${{ env.RUN_DIR }}/playthrough-*.json
            ${{ env.RUN_DIR }}/playthrough-*.md
            ${{ env.RUN_DIR }}/compat-report.json
            ${{ env.RUN_DIR }}/server-console.log
            ${{ env.RUN_DIR }}/logs/latest.log
            ${{ env.RUN_DIR }}/crash-reports/
          if-no-files-found: ignore
          retention-days: 14
