def prepareReleaseServer = tasks.register('prepareReleaseServer') {
    doLast {
        def directory = releaseServerGameDirectory
        directory.mkdirs()
        def properties = new Properties()
        properties.setProperty('server-ip', '127.0.0.1')
        properties.setProperty('server-port', '0')
        properties.setProperty('online-mode', 'false')
        properties.setProperty('enforce-secure-profile', 'false')
        properties.setProperty('level-name', 'task35-world')
        new File(directory, 'server.properties').withOutputStream {
            properties.store(it, 'Task 35 production-only dedicated server')
        }
        new File(directory, 'eula.txt').text = 'eula=true\n'
    }
}

