tasks.register('federationTaskThirtyFivePacketProbe', JavaExec) {
    group = 'verification'
    description = 'Executes production packet codecs and context rejection without starting a game runtime.'
    dependsOn(tasks.named('testmodClasses'))
    classpath = testmod.runtimeClasspath
    mainClass = 'space.controlnet.ae2federation.test.TaskThirtyFivePacketProbe'
    notCompatibleWithConfigurationCache('Reads the parent-selected evidence path at execution time.')
    doFirst {
        def evidencePath = providers.gradleProperty('federationPacketEvidenceFile').orNull
        if (evidencePath == null || evidencePath.isBlank()) throw new GradleException('Missing packet evidence file')
        def evidence = rootProject.file(evidencePath)
        evidence.parentFile.mkdirs()
        def runtimeDirectory = new File(evidence.parentFile, 'packet-probe-runtime')
        runtimeDirectory.mkdirs()
        workingDir(runtimeDirectory)
        args(evidence.absolutePath)
    }
    doLast {
        def evidencePath = providers.gradleProperty('federationPacketEvidenceFile').get()
        def runtimeDirectory = new File(rootProject.file(evidencePath).parentFile, 'packet-probe-runtime')
        if (runtimeDirectory.exists()) {
            Files.walk(runtimeDirectory.toPath()).sorted(java.util.Comparator.reverseOrder()).forEach(Files::deleteIfExists)
        }
    }
}

