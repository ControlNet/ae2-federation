def prepareLoopbackServerProperties = tasks.register('prepareLoopbackServerProperties') {
    def serverPropertiesFile = layout.projectDirectory.file('run-server/server.properties')
    outputs.file(serverPropertiesFile)

    doLast {
        def serverProperties = new Properties()
        def propertiesFile = serverPropertiesFile.asFile
        if (propertiesFile.exists()) {
            propertiesFile.withInputStream { serverProperties.load(it) }
        } else {
            propertiesFile.parentFile.mkdirs()
        }
        serverProperties.setProperty('server-ip', '127.0.0.1')
        propertiesFile.withOutputStream { serverProperties.store(it, 'Task-owned NeoForge development server settings') }
    }
}

def releaseServerGameDirectory = providers.gradleProperty('federationReleaseServerGameDir')
