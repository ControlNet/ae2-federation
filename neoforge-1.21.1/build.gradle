def targetJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def targetSourcesJar = tasks.named('sourcesJar', Jar).flatMap { it.archiveFile }
def verifyReleaseArchive = { File archive, boolean sources ->
    def entries = [:]
    new java.util.zip.ZipFile(archive).withCloseable { zip ->
        zip.entries().findAll { !it.directory }.each { entry -> entries[entry.name] = zip.getInputStream(entry).bytes }
    }
    def forbiddenPaths = ['space/controlnet/ae2federation/test/', 'data/ae2federation_test/',
            'assets/ae2federation_test/', 'com/glodblock/github/appflux/', 'ae2federation_test.mixins.json']
    def forbiddenSymbols = ['FederationTestMod', 'RegisterGameTestsEvent', 'LDLRegisterClient',
            'UIScenario', 'ae2federation.testId', 'ae2federation_test', 'RegisterCommandsEvent']
    def leaked = entries.findAll { name, bytes ->
        def text = new String(bytes, sources ? StandardCharsets.UTF_8 : StandardCharsets.ISO_8859_1)
        forbiddenPaths.any(name::contains) || forbiddenSymbols.any(text::contains)
    }.keySet().sort()
    if (!leaked.isEmpty()) {
        throw new GradleException("Test, scenario, instrumentation, or debug registration leaked into ${archive}: ${leaked}")
    }
    if (!sources) {
        def metadata = new String(entries['META-INF/neoforge.mods.toml'], StandardCharsets.UTF_8)
        if (metadata.count('modId="ae2federation"') != 1 || metadata.contains('modId="ae2federation_test"')
                || metadata.count('config="ae2federation.mixins.json"') != 1) {
            throw new GradleException("Production mod metadata is not exact in ${archive}")
        }
        def mixins = new JsonSlurper().parse(entries['ae2federation.mixins.json'])
        if (mixins.package != 'space.controlnet.ae2federation.mixin'
                || (mixins.mixins as List).any { (it as String).contains('test') }) {
            throw new GradleException("Production Mixin registration is not release-only in ${archive}")
        }
    }
}
def verifySharedJarContent = tasks.register('verifySharedJarContent') {
    group = 'verification'
    description = 'Checks that the target JAR contains shared code and resources.'
    dependsOn(tasks.named('jar'), tasks.named('sourcesJar'))
    inputs.file(targetJar)
    inputs.file(targetSourcesJar)

    doLast {
        def archive = targetJar.get().asFile
        def expectedEntries = [
                'space/controlnet/ae2federation/CommonStartup.class',
                'assets/ae2federation/lang/en_us.json',
                'pack.mcmeta'
        ] as Set
        def actualEntries = [] as Set
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            zip.entries().each { actualEntries.add(it.name) }
        }
        if (!actualEntries.containsAll(expectedEntries)) {
            throw new GradleException("Shared content missing from ${archive}: expected ${expectedEntries}")
        }
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def forbiddenControls = ['ae2federation.testId', 'ProviderRuntimeReplay', 'ProviderRuntimeProbe',
                    'ProviderRuntimeReplayControl', 'ae2federation_test']
            def forbiddenEntries = ['space/controlnet/ae2federation/test/', 'com/glodblock/github/appflux/', 'NativeStorageTrace',
                    'NativeEndpointTrace', 'ProviderTargetTrace', 'PatternProviderLogicEndpointTrace',
                    'PatternProviderTargetCacheEndpointTrace', 'NetworkStorageTrace', 'DelegatingMEInventoryTrace',
                    'ae2federation_test.mixins.json']
            def leaked = zip.entries().findAll { !it.directory }.findAll { entry ->
                def content = new String(zip.getInputStream(entry).bytes, StandardCharsets.ISO_8859_1)
                forbiddenEntries.any(entry.name::contains) || forbiddenControls.any(content::contains)
            }.collect { it.name }
            if (!leaked.isEmpty()) {
                throw new GradleException("Test control leaked into ${archive}: ${leaked}")
            }
            def runtimeEntry = zip.getEntry('space/controlnet/ae2federation/processing/provider/ProviderRuntime.class')
            def symbols = new String(zip.getInputStream(runtimeEntry).bytes, StandardCharsets.ISO_8859_1)
            if (['replayResolutions', 'laneResolutions', 'replayAuthorizedResolutionOnce', 'laneProvenance'].any {
                symbols.contains(it)
            }) {
                throw new GradleException("Replay-only ProviderRuntime state or API leaked into ${archive}")
            }
        }
        def sourcesArchive = targetSourcesJar.get().asFile
        new java.util.zip.ZipFile(sourcesArchive).withCloseable { zip ->
            def sourceNames = zip.entries().collect { it.name }
            def forbiddenControls = ['ae2federation.testId', 'ProviderRuntimeReplay', 'ProviderRuntimeProbe',
                    'ProviderRuntimeReplayControl', 'ae2federation_test']
            def forbiddenEntries = ['space/controlnet/ae2federation/test/', 'com/glodblock/github/appflux/', 'NativeStorageTrace',
                    'NativeEndpointTrace', 'ProviderTargetTrace', 'PatternProviderLogicEndpointTrace',
                    'PatternProviderTargetCacheEndpointTrace', 'NetworkStorageTrace', 'DelegatingMEInventoryTrace',
                    'ae2federation_test.mixins.json']
            def leaked = zip.entries().findAll { !it.directory }.findAll { entry ->
                def content = zip.getInputStream(entry).getText(StandardCharsets.UTF_8.name())
                forbiddenEntries.any(entry.name::contains) || forbiddenControls.any(content::contains)
            }.collect { it.name }
            if (!leaked.isEmpty()) {
                throw new GradleException("Test control source leaked into ${sourcesArchive}: ${leaked}")
            }
            def runtimeEntry = zip.getEntry('space/controlnet/ae2federation/processing/provider/ProviderRuntime.java')
            def source = zip.getInputStream(runtimeEntry).getText(StandardCharsets.UTF_8.name())
            if (['replayResolutions', 'laneResolutions', 'replayAuthorizedResolutionOnce', 'laneProvenance'].any {
                source.contains(it)
            }) {
                throw new GradleException("Replay-only ProviderRuntime source leaked into ${sourcesArchive}")
            }
        }
        verifyReleaseArchive(archive, false)
        verifyReleaseArchive(sourcesArchive, true)
    }
}

tasks.register('federationReleaseServerSmoke') {
    group = 'verification'
    description = 'Starts and stops a production-source-set dedicated server without testmod or optional addons.'
    dependsOn(tasks.named('jar'), tasks.named('verifySharedJarContent'))
    notCompatibleWithConfigurationCache('Launches and controls an isolated nested production server.')
    doLast {
        def evidencePath = providers.gradleProperty('federationReleaseEvidenceFile').orNull
        if (evidencePath == null || evidencePath.isBlank()) throw new GradleException('Missing release evidence file')
        def evidence = rootProject.file(evidencePath)
        evidence.parentFile.mkdirs()
        def gameDirectory = new File(evidence.parentFile, 'release-server-runtime')
        def command = [new File(gradle.gradleHomeDir, 'bin/gradle').absolutePath, '--no-daemon',
                '--no-configuration-cache', '--dependency-verification=strict', ':neoforge-1.21.1:runReleaseServer',
                "-PfederationReleaseServerGameDir=${gameDirectory.absolutePath}"].collect { it.toString() }
        def processLog = new File(evidence.parentFile, 'release-server-process.log')
        def process = new ProcessBuilder(command).directory(rootProject.projectDir).redirectErrorStream(true)
                .redirectOutput(processLog).start()
        def deadline = System.nanoTime() + java.util.concurrent.TimeUnit.SECONDS.toNanos(120)
        while (process.isAlive() && System.nanoTime() < deadline
                && (!processLog.isFile() || !processLog.text.contains('Done ('))) {
            java.util.concurrent.TimeUnit.MILLISECONDS.sleep(250)
        }
        def text = processLog.isFile() ? processLog.text : ''
        def started = text.contains('Done (')
        if (started && process.isAlive()) {
            process.outputStream.withWriter { it.write('stop\n'); it.flush() }
        }
        if (!process.waitFor(5, java.util.concurrent.TimeUnit.SECONDS)) {
            process.toHandle().descendants().forEach { it.destroy() }
            process.destroy()
        }
        if (!process.waitFor(20, java.util.concurrent.TimeUnit.SECONDS)) {
            process.toHandle().descendants().forEach { it.destroyForcibly() }
            process.destroyForcibly()
            process.waitFor(10, java.util.concurrent.TimeUnit.SECONDS)
        }
        text = processLog.text
        logger.lifecycle(text)
        def forbidden = ['ae2federation_test', 'com.glodblock.github.appflux', 'Attempted to load class net/minecraft/client',
                'NoClassDefFoundError', 'ClassNotFoundException', 'LoadingFailedException']
        if (process.isAlive() || !started || forbidden.any(text::contains)) {
            throw new GradleException('Production dedicated-server smoke failed or loaded forbidden content')
        }
        def facts = new Properties()
        facts.setProperty('serverStarted', 'true')
        facts.setProperty('runtimeTerminated', 'true')
        facts.setProperty('sourceSet', 'main')
        facts.setProperty('testmodLoaded', 'false')
        facts.setProperty('clientClassLoadFailure', 'false')
        facts.setProperty('optionalAddonPresent', 'false')
        facts.setProperty('debugRegistrationPresent', 'false')
        facts.setProperty('productJarSha256', MessageDigest.getInstance('SHA-256').digest(targetJar.get().asFile.bytes).encodeHex().toString())
        facts.setProperty('sourcesJarSha256', MessageDigest.getInstance('SHA-256').digest(targetSourcesJar.get().asFile.bytes).encodeHex().toString())
        evidence.withOutputStream { facts.store(it, 'Task 35 production release runtime') }
        if (gameDirectory.exists()) {
            Files.walk(gameDirectory.toPath()).sorted(java.util.Comparator.reverseOrder()).forEach(Files::deleteIfExists)
        }
    }
}

