tasks.named('test', Test).configure {
    useJUnitPlatform()
}

def cleanupAppfluxGameTest = tasks.register('cleanupAppfluxGameTest', Delete) {
    delete(layout.projectDirectory.dir('run-appflux-gametest'))
}

tasks.named('runAppfluxGameTestServer').configure {
    finalizedBy(cleanupAppfluxGameTest)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
                'Implementation-Title': mod_name,
                'Implementation-Version': project.version,
                'Built-For-Minecraft': minecraft_version,
                'Built-For-NeoForge': neo_version,
                'Applied-Energistics-Version': ae2_version,
                'LDLib2-Version': ldlib2_version
        )
    }
}

def targetJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def targetSourcesJar = tasks.named('sourcesJar', Jar).flatMap { it.archiveFile }
def verifySharedJarContent = tasks.register('verifySharedJarContent') {
    group = 'verification'
    description = 'Checks that the target JAR contains shared code and resources.'
    dependsOn(tasks.named('jar'), tasks.named('sourcesJar'))
    inputs.file(targetJar)
    inputs.file(targetSourcesJar)

    doLast {
        def archive = targetJar.get().asFile
        def expectedEntries = [
                'space/controlnet/ae2federation/CommonStartup.class',
                'assets/ae2federation/lang/en_us.json',
                'pack.mcmeta'
        ] as Set
        def actualEntries = [] as Set
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            zip.entries().each { actualEntries.add(it.name) }
        }
        if (!actualEntries.containsAll(expectedEntries)) {
            throw new GradleException("Shared content missing from ${archive}: expected ${expectedEntries}")
        }
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def forbiddenControls = ['ae2federation.testId', 'ProviderRuntimeReplay', 'ProviderRuntimeProbe',
                    'ProviderRuntimeReplayControl', 'ae2federation_test']
            def forbiddenEntries = ['space/controlnet/ae2federation/test/', 'com/glodblock/github/appflux/', 'NativeStorageTrace',
                    'NativeEndpointTrace', 'ProviderTargetTrace', 'PatternProviderLogicEndpointTrace',
                    'PatternProviderTargetCacheEndpointTrace', 'NetworkStorageTrace', 'DelegatingMEInventoryTrace',
                    'ae2federation_test.mixins.json']
            def leaked = zip.entries().findAll { !it.directory }.findAll { entry ->
                def content = new String(zip.getInputStream(entry).bytes, StandardCharsets.ISO_8859_1)
                forbiddenEntries.any(entry.name::contains) || forbiddenControls.any(content::contains)
            }.collect { it.name }
            if (!leaked.isEmpty()) {
                throw new GradleException("Test control leaked into ${archive}: ${leaked}")
            }
            def runtimeEntry = zip.getEntry('space/controlnet/ae2federation/processing/provider/ProviderRuntime.class')
            def symbols = new String(zip.getInputStream(runtimeEntry).bytes, StandardCharsets.ISO_8859_1)
            if (['replayResolutions', 'laneResolutions', 'replayAuthorizedResolutionOnce', 'laneProvenance'].any {
                symbols.contains(it)
            }) {
                throw new GradleException("Replay-only ProviderRuntime state or API leaked into ${archive}")
            }
        }
        def sourcesArchive = targetSourcesJar.get().asFile
        new java.util.zip.ZipFile(sourcesArchive).withCloseable { zip ->
            def sourceNames = zip.entries().collect { it.name }
            def forbiddenControls = ['ae2federation.testId', 'ProviderRuntimeReplay', 'ProviderRuntimeProbe',
                    'ProviderRuntimeReplayControl', 'ae2federation_test']
            def forbiddenEntries = ['space/controlnet/ae2federation/test/', 'com/glodblock/github/appflux/', 'NativeStorageTrace',
                    'NativeEndpointTrace', 'ProviderTargetTrace', 'PatternProviderLogicEndpointTrace',
                    'PatternProviderTargetCacheEndpointTrace', 'NetworkStorageTrace', 'DelegatingMEInventoryTrace',
                    'ae2federation_test.mixins.json']
            def leaked = zip.entries().findAll { !it.directory }.findAll { entry ->
                def content = zip.getInputStream(entry).getText(StandardCharsets.UTF_8.name())
                forbiddenEntries.any(entry.name::contains) || forbiddenControls.any(content::contains)
            }.collect { it.name }
            if (!leaked.isEmpty()) {
                throw new GradleException("Test control source leaked into ${sourcesArchive}: ${leaked}")
            }
            def runtimeEntry = zip.getEntry('space/controlnet/ae2federation/processing/provider/ProviderRuntime.java')
            def source = zip.getInputStream(runtimeEntry).getText(StandardCharsets.UTF_8.name())
            if (['replayResolutions', 'laneResolutions', 'replayAuthorizedResolutionOnce', 'laneProvenance'].any {
                source.contains(it)
            }) {
                throw new GradleException("Replay-only ProviderRuntime source leaked into ${sourcesArchive}")
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn(rootProject.tasks.named('verifyTaskOneStructure'))
    dependsOn(verifySharedJarContent)
}

apply from: rootProject.file('gradle/federation-qa.gradle')
apply from: rootProject.file('gradle/federation-ui.gradle')

tasks.register('federationAppliedFluxCompatibility') {
    group = 'verification'
    description = 'Resolves the pinned isolated Applied Flux compatibility runtime and validates its dossier.'
    def dossier = rootProject.layout.projectDirectory.file('tests/compatibility/applied-flux.properties')
    inputs.file(dossier)

    doLast {
        def facts = new Properties()
        dossier.asFile.withInputStream { facts.load(it) }
        if (facts.getProperty('status') != 'QUALIFIED'
                || facts.getProperty('inspectedCommit') != 'a54eafb72d72bd259bc3b5fa226b4f5542c4c3c4'
                || facts.getProperty('artifactSha256') != '2d5c0dfbf1853e28d515b4224ca39a1de4520a1ac2e0fe987e6400965bf1f555'
                || facts.getProperty('sourceArtifactCorrelation') != 'authoritative-ordinary') {
            throw new GradleException('Applied Flux qualification dossier is malformed')
        }
        def resolved = configurations.appliedFluxCompatibility.resolve()
        if (resolved*.name.toSet() != ['appflux-1.21-2.1.4-neoforge.jar',
                'guideme-21.1.1.jar', 'glodium-1.21-2.2-neoforge.jar'] as Set) {
            throw new GradleException("Applied Flux compatibility artifacts are incomplete: ${resolved*.name}")
        }
        logger.lifecycle('Applied Flux 2.1.4 isolated compatibility artifacts verified')
    }
}

tasks.register('dependencyVerificationSelfTest') {
    group = 'verification'
    description = 'Proves strict verification rejects a corrupted task-owned dependency copy.'
    notCompatibleWithConfigurationCache('Creates and invokes an isolated nested Gradle build.')

    doLast {
        def workDir = layout.buildDirectory.dir('tmp/dependency-verification-self-test').get().asFile
        def reportFile = layout.buildDirectory.file('reports/dependency-verification-self-test.log').get().asFile
        delete(workDir)
        workDir.mkdirs()
        reportFile.parentFile.mkdirs()

        def trustedArtifact = new File(workDir, 'trusted/task1-probe-1.0.jar')
        trustedArtifact.parentFile.mkdirs()
        trustedArtifact.setText('task-one-trusted-artifact\n', StandardCharsets.UTF_8.name())

        def repositoryDir = new File(workDir, 'probe/repository/com/example/task1-probe/1.0')
        repositoryDir.mkdirs()
        def corruptedCopy = new File(repositoryDir, 'task1-probe-1.0.jar')
        Files.copy(trustedArtifact.toPath(), corruptedCopy.toPath())
        corruptedCopy.append('corruption\n', StandardCharsets.UTF_8.name())
        new File(repositoryDir, 'task1-probe-1.0.pom').setText('''<project xmlns="http://maven.apache.org/POM/4.0.0">
  <modelVersion>4.0.0</modelVersion>
  <groupId>com.example</groupId>
  <artifactId>task1-probe</artifactId>
  <version>1.0</version>
</project>
''', StandardCharsets.UTF_8.name())

        def digest = MessageDigest.getInstance('SHA-256')
        def trustedSha256 = digest.digest(trustedArtifact.bytes).encodeHex().toString()
        def probeDir = new File(workDir, 'probe')
        new File(probeDir, 'settings.gradle').setText("rootProject.name = 'dependency-verification-probe'\n", StandardCharsets.UTF_8.name())
        new File(probeDir, 'build.gradle').setText('''repositories {
    maven { url = uri('repository') }
}
configurations { probe }
dependencies { probe 'com.example:task1-probe:1.0' }
tasks.register('resolveProbe') {
    doLast { configurations.probe.files.each { println "PROBE_ARTIFACT=${it.name}" } }
}
''', StandardCharsets.UTF_8.name())
        def metadataDir = new File(probeDir, 'gradle')
        metadataDir.mkdirs()
        new File(metadataDir, 'verification-metadata.xml').setText("""<?xml version=\"1.0\" encoding=\"UTF-8\"?>
<verification-metadata>
  <configuration>
    <verify-metadata>false</verify-metadata>
    <verify-signatures>false</verify-signatures>
  </configuration>
  <components>
    <component group=\"com.example\" name=\"task1-probe\" version=\"1.0\">
      <artifact name=\"task1-probe-1.0.jar\">
        <sha256 value=\"${trustedSha256}\" origin=\"Task 1 pristine fixture\"/>
      </artifact>
    </component>
  </components>
</verification-metadata>
""", StandardCharsets.UTF_8.name())

        def isolatedGradleHome = new File(workDir, 'gradle-home')
        def gradleExecutable = new File(gradle.gradleHomeDir, 'bin/gradle')
        def process = new ProcessBuilder(
                gradleExecutable.absolutePath,
                '--no-daemon',
                '--offline',
                '--dependency-verification=strict',
                '--gradle-user-home', isolatedGradleHome.absolutePath,
                'resolveProbe'
        ).directory(probeDir).redirectErrorStream(true).start()
        def output = process.inputStream.getText(StandardCharsets.UTF_8.name())
        def exitCode = process.waitFor()
        reportFile.setText(output, StandardCharsets.UTF_8.name())

        if (exitCode == 0 || !output.contains('Dependency verification failed')) {
            throw new GradleException("Corrupted dependency was not rejected as expected; exit=${exitCode}, report=${reportFile}")
        }

        delete(workDir)
        logger.lifecycle("Strict dependency verification rejected the corrupted task-owned copy; report: ${reportFile}")
    }
}
