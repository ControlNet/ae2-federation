import java.nio.charset.StandardCharsets
import java.nio.file.Files
import java.security.MessageDigest
import java.util.Properties

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

group = rootProject.group
version = rootProject.version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets.main {
    java.srcDir(rootProject.file('common/src/main/java'))
    resources.srcDir(rootProject.file('common/src/main/resources'))
}

sourceSets.test {
    java.srcDir(rootProject.file('common/src/test/java'))
    resources.srcDir(rootProject.file('common/src/test/resources'))
}

def testmod = sourceSets.create('testmod') {
    java.srcDir(rootProject.file('common/src/testmod/java'))
    resources.srcDir(rootProject.file('common/src/testmod/resources'))
    compileClasspath += sourceSets.main.output + configurations.compileClasspath
    runtimeClasspath += output + compileClasspath + configurations.runtimeClasspath
}

def appfluxTest = sourceSets.create('appfluxTest') {
    java.srcDir(rootProject.file('common/src/appfluxtest/java'))
    compileClasspath += sourceSets.main.output + testmod.output + configurations.compileClasspath
    runtimeClasspath += output + sourceSets.main.output + testmod.output + compileClasspath + configurations.runtimeClasspath
}

repositories {
    mavenCentral()
    maven {
        name = 'FirstDark'
        url = 'https://maven.firstdark.dev/snapshots'
        content {
            includeGroup('com.lowdragmc.ldlib2')
            includeGroup('dev.vfyjxf')
            includeGroup('org.appliedenergistics.yoga')
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeModule('maven.modrinth', 'appflux')
            includeModule('maven.modrinth', 'glodium')
        }
    }
}

def prepareLoopbackServerProperties = tasks.register('prepareLoopbackServerProperties') {
    def serverPropertiesFile = layout.projectDirectory.file('run-server/server.properties')
    outputs.file(serverPropertiesFile)

    doLast {
        def serverProperties = new Properties()
        def propertiesFile = serverPropertiesFile.asFile
        if (propertiesFile.exists()) {
            propertiesFile.withInputStream { serverProperties.load(it) }
        } else {
            propertiesFile.parentFile.mkdirs()
        }
        serverProperties.setProperty('server-ip', '127.0.0.1')
        propertiesFile.withOutputStream { serverProperties.store(it, 'Task-owned NeoForge development server settings') }
    }
}

def prepareUiTestClientOptions = tasks.register('prepareUiTestClientOptions') {
    def optionsFile = layout.projectDirectory.file('run-uitest/options.txt')
    outputs.file(optionsFile)

    doLast {
        def file = optionsFile.asFile
        file.parentFile.mkdirs()
        file.setText('onboardAccessibility:false\n', StandardCharsets.UTF_8.name())
    }
}

neoForge {
    version = neo_version
    validateAccessTransformers = true

    runs {
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument('--nogui')
            logLevel = org.slf4j.event.Level.INFO
            taskBefore(prepareLoopbackServerProperties)
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
            sourceSet = testmod
            systemProperty('neoforge.enabledGameTestNamespaces', providers.gradleProperty('federationGameTestNamespace').getOrElse('ae2federation_test'))
            systemProperty('ae2federation.testSelection', providers.gradleProperty('federationGameTestSelection').getOrElse('positive'))
            systemProperty('ae2federation.testId', providers.gradleProperty('federationGameTestId').getOrElse('harnessnativesmoke'))
            systemProperty('ae2federation.nativeEvidenceFile', providers.gradleProperty('federationNativeEvidenceFile').getOrElse(''))
            systemProperty('ae2federation.benchmarkEmpty', providers.gradleProperty('federationBenchmarkEmpty').getOrElse('false'))
    systemProperty('ae2federation.processingBenchmarkProfile', providers.gradleProperty('federationProcessingBenchmarkProfile').getOrElse(''))
    systemProperty('ae2federation.processingBenchmarkSeed', providers.gradleProperty('federationProcessingBenchmarkSeed').getOrElse(''))
            systemProperty('ae2federation.identityPhase', providers.gradleProperty('federationIdentityPhase').getOrElse(''))
            systemProperty('ae2federation.identityStateFile', providers.gradleProperty('federationIdentityStateFile').getOrElse(''))
            systemProperty('ae2federation.policyPhase', providers.gradleProperty('federationPolicyPhase').getOrElse(''))
            systemProperty('ae2federation.policyStateFile', providers.gradleProperty('federationPolicyStateFile').getOrElse(''))
            logLevel = org.slf4j.event.Level.INFO
        }
        appfluxGameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-appflux-gametest')
            sourceSet = appfluxTest
            systemProperty('neoforge.enabledGameTestNamespaces', 'ae2federation_test')
            systemProperty('ae2federation.testSelection', 'positive')
            systemProperty('ae2federation.testId', 'resourcesstoredfe')
            systemProperty('ae2federation.nativeEvidenceFile', providers.gradleProperty('federationNativeEvidenceFile').getOrElse(''))
            logLevel = org.slf4j.event.Level.INFO
        }
        uiTestClient {
            client()
            gameDirectory = project.file('run-uitest')
            sourceSet = testmod
            systemProperty('ldlib2.uitest.run', providers.gradleProperty('federationUiSelection').getOrElse(''))
            systemProperty('ldlib2.uitest.out', providers.gradleProperty('federationUiOutputDir').getOrElse(''))
            systemProperty('ldlib2.uitest.guiScale', providers.gradleProperty('federationUiGuiScale').getOrElse('3'))
            systemProperty('ldlib2.uitest.window', providers.gradleProperty('federationUiWindow').getOrElse('1280x720'))
            systemProperty('ldlib2.uitest.inputMode', 'SYNTHETIC')
            systemProperty('ldlib2.uitest.watchdogSec', providers.gradleProperty('federationUiWatchdogSec').getOrElse('90'))
            systemProperty('ae2federation.ui.runId', providers.gradleProperty('federationUiRunId').getOrElse(''))
            logLevel = org.slf4j.event.Level.INFO
            taskBefore(prepareUiTestClientOptions)
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        ae2federation_test {
            sourceSet(testmod)
            if (providers.gradleProperty('enableAppfluxCompatibility').getOrElse('false').toBoolean()) {
                sourceSet(appfluxTest)
            }
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom(localRuntime)
    appliedFluxCompatibility {
        canBeConsumed = false
        canBeResolved = true
        description = 'Isolated Task 25 Applied Flux compatibility runtime.'
    }
    appfluxTestImplementation.extendsFrom(appliedFluxCompatibility)
}

